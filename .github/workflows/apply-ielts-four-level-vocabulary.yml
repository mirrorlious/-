name: Apply IELTS four-level vocabulary

on:
  push:
    branches:
      - feat/ielts-four-level-vocabulary
    paths:
      - .github/workflows/apply-ielts-four-level-vocabulary.yml

permissions:
  contents: write

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out IELTS feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ielts-four-level-vocabulary
          fetch-depth: 0

      - name: Build four-level IELTS vocabulary and patch reader
        shell: bash
        run: |
          python tools/build_ielts_four_level.py

      - name: Validate generated resources
        shell: bash
        run: |
          python -m json.tool public-resources/ielts-vocabulary/ielts-vocabulary-4-level.json > /dev/null
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('public-resources/ielts-vocabulary/ielts-vocabulary-4-level.json').read_text(encoding='utf-8'))
          print(len(data))
          PY
          )" -eq 1992
          grep -q '雅思核心词' index.html
          grep -q '雅思场景词' index.html
          grep -q '雅思基础重合词' index.html
          grep -q '雅思扩展词' index.html
          grep -q 'IELTS_DICT_URL' index.html
          grep -q '<option value="daily">核心＋场景</option>' index.html
          git diff --check

      - name: Commit generated IELTS vocabulary
        shell: bash
        run: |
          rm -f .github/workflows/apply-ielts-four-level-vocabulary.yml
          rm -f tools/ielts-vocabulary-4-level.payload.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add four-level IELTS vocabulary interaction'
          git push origin HEAD:feat/ielts-four-level-vocabulary
