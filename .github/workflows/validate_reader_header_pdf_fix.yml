name: Validate reader header and PDF repair

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Run validation and capture diagnostics
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/static.log 2>&1
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "layoutMode === 'split' ? 'max-w-[1480px]'",
              'const deleteReaderStore = async',
              "extractionMethod = 'text-raw'",
              "await deleteReaderStore('pdf-tasks', taskKey)",
              '可读页 ${readablePages.length}'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          print('Static markers and script extraction passed')
          PY
          static_code=$?

          npm init -y > /tmp/npm.log 2>&1
          npm install --no-save @babel/core @babel/preset-react >> /tmp/npm.log 2>&1
          npm_code=$?

          node - <<'NODE' > /tmp/babel.log 2>&1
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE
          babel_code=$?
          set -e

          {
            echo "static_code=$static_code"
            echo "npm_code=$npm_code"
            echo "babel_code=$babel_code"
            echo "---- static ----"
            cat /tmp/static.log
            echo "---- npm ----"
            tail -n 30 /tmp/npm.log
            echo "---- babel ----"
            cat /tmp/babel.log
          } > TASK_LOGS/reader-repair-validation-output.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASK_LOGS/reader-repair-validation-output.txt
          git commit -m "chore: record reader repair validation"
          git push origin HEAD:feat/reader-annotations-v2
