name: Apply four reading panel improvements once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply patch and capture diagnostics
        shell: bash
        run: |
          set +e
          python scripts/one_shot_four_panel_improvements.py > /tmp/four-panel.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "commit=${GITHUB_SHA}"
            echo "---- output ----"
            cat /tmp/four-panel.log
          } > TASK_LOGS/four-panel-patch-output.txt

      - name: Commit patch or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if grep -q '^exit_code=0$' TASK_LOGS/four-panel-patch-output.txt; then
            git commit -m "feat: reorganize learning panel and selection notes"
          else
            git commit -m "chore: record four-panel patch failure"
          fi
          git push origin HEAD:feat/reader-annotations-v2
