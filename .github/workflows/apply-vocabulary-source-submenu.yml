name: Apply vocabulary source submenu

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ci/vocabulary-source-submenu'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add IELTS and kaoyan source submenu
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = Path('src/App.jsx')
          paragraph = Path('src/components/Paragraph.jsx')

          replace_once(
              app,
              "    const [highlightMode, setHighlightMode] = useState('daily');",
              "    const [vocabularySource, setVocabularySource] = useState('all');\n    const [highlightMode, setHighlightMode] = useState('all');",
              'vocabulary source state'
          )

          old_active = """    const activeDicts = useMemo(() => [
              { data: ieltsDict, type: 'extended' },
              { data: customDict, type: 'custom' }
          ], [ieltsDict, customDict]);
          """
          new_active = """    const activeDicts = useMemo(() => {
              const ieltsSource = { data: ieltsDict, type: 'extended' };
              const kaoyanSources = [
                  { data: extraDict, type: 'extra' },
                  { data: requiredDict, type: 'required' },
                  { data: basicDict, type: 'basic' }
              ];
              const customSource = { data: customDict, type: 'custom' };

              if (vocabularySource === 'ielts') return [ieltsSource, customSource];
              if (vocabularySource === 'kaoyan') return [...kaoyanSources, customSource];
              return [ieltsSource, ...kaoyanSources, customSource];
          }, [vocabularySource, ieltsDict, extraDict, requiredDict, basicDict, customDict]);

          const handleVocabularySourceChange = (nextSource) => {
              setVocabularySource(nextSource);
              if (nextSource === 'ielts') setHighlightMode('daily');
              else if (nextSource === 'kaoyan') setHighlightMode('exam');
              else setHighlightMode('all');
          };
          """
          replace_once(app, old_active, new_active, 'active vocabulary sources')

          replace_once(
              app,
              "            console.error('Error loading IELTS vocabulary packs:', error);\n            window.showToast('雅思分层词库加载失败，请刷新后重试', 'error');",
              "            console.error('Error loading vocabulary packs:', error);\n            window.showToast('词汇库加载失败，请刷新后重试', 'error');",
              'vocabulary load error'
          )

          text = app.read_text(encoding='utf-8')
          selector_pattern = re.compile(
              r"\{readingMode === 'intensive' && \(\s*"
              r"<select value=\{highlightMode\} onChange=\{\(event\) => setHighlightMode\(event\.target\.value\)\} aria-label=\"词汇高亮范围\" title=\"词汇高亮范围\" className=\"[^\"]+\">"
              r"[\s\S]*?</select>\s*\)\}",
              re.S,
          )
          selector_replacement = '''{readingMode === 'intensive' && (
                                    <div className="flex items-center gap-1 shrink-0" role="group" aria-label="词汇标注设置">
                                        <select
                                            value={vocabularySource}
                                            onChange={(event) => handleVocabularySourceChange(event.target.value)}
                                            aria-label="词汇库来源"
                                            title="词汇库来源"
                                            className="h-9 w-[72px] sm:w-[82px] px-2 rounded-sm text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer"
                                        >
                                            <option value="all">全部</option>
                                            <option value="ielts">雅思</option>
                                            <option value="kaoyan">考研</option>
                                        </select>

                                        {vocabularySource === 'all' ? (
                                            <select
                                                value={highlightMode}
                                                onChange={(event) => setHighlightMode(event.target.value)}
                                                aria-label="全部词汇显示范围"
                                                title="全部词汇显示范围"
                                                className="h-9 w-[104px] sm:w-[116px] px-2 rounded-sm text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer"
                                            >
                                                <option value="all">全部词汇</option>
                                                <option value="none">关闭标注</option>
                                            </select>
                                        ) : vocabularySource === 'ielts' ? (
                                            <select
                                                value={highlightMode}
                                                onChange={(event) => setHighlightMode(event.target.value)}
                                                aria-label="雅思词汇显示范围"
                                                title="雅思词汇显示范围"
                                                className="h-9 w-[112px] sm:w-[126px] px-2 rounded-sm text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer"
                                            >
                                                <option value="daily">核心＋场景</option>
                                                <option value="all">全部雅思词</option>
                                                <option value="core">雅思核心词</option>
                                                <option value="scenario">雅思场景词</option>
                                                <option value="overlap">基础重合词</option>
                                                <option value="extended">雅思扩展词</option>
                                                <option value="none">关闭标注</option>
                                            </select>
                                        ) : (
                                            <select
                                                value={highlightMode}
                                                onChange={(event) => setHighlightMode(event.target.value)}
                                                aria-label="考研词汇显示范围"
                                                title="考研词汇显示范围"
                                                className="h-9 w-[112px] sm:w-[126px] px-2 rounded-sm text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer"
                                            >
                                                <option value="exam">必考＋超纲</option>
                                                <option value="all">全部考研词</option>
                                                <option value="basic">考研基础词</option>
                                                <option value="required">考研必考词</option>
                                                <option value="extra">考研超纲词</option>
                                                <option value="none">关闭标注</option>
                                            </select>
                                        )}
                                    </div>
                                )}'''
          text, count = selector_pattern.subn(selector_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'vocabulary submenu: expected 1 match, found {count}')
          app.write_text(text, encoding='utf-8')

          text = paragraph.read_text(encoding='utf-8')
          marker = """    custom: {
                  label: '个人词库', advice: '个人标记',
          """
          kaoyan_meta = """    basic: {
                  label: '考研基础词', advice: '基础掌握',
                  underline: 'decoration-green-600 dark:decoration-green-400',
                  badge: 'bg-green-600 dark:bg-green-700', text: 'text-green-700 dark:text-green-300'
              },
              required: {
                  label: '考研必考词', advice: '重点掌握',
                  underline: 'decoration-blue-700 dark:decoration-blue-400',
                  badge: 'bg-blue-700 dark:bg-blue-700', text: 'text-blue-700 dark:text-blue-300'
              },
              extra: {
                  label: '考研超纲词', advice: '拓展掌握',
                  underline: 'decoration-red-600 dark:decoration-red-400',
                  badge: 'bg-red-600 dark:bg-red-700', text: 'text-red-700 dark:text-red-300'
              },
              custom: {
                  label: '个人词库', advice: '个人标记',
          """
          if text.count(marker) != 1:
              raise SystemExit(f'kaoyan metadata marker: expected 1 match, found {text.count(marker)}')
          text = text.replace(marker, kaoyan_meta, 1)

          old_filter = """const shouldShowVocabType = (type, highlightMode) => {
              if (highlightMode === 'none') return false;
              if (highlightMode === 'all') return true;
              if (highlightMode === 'daily') return type === 'core' || type === 'scenario';
              return highlightMode === type;
          };
          """
          new_filter = """const shouldShowVocabType = (type, highlightMode) => {
              if (highlightMode === 'none') return false;
              if (highlightMode === 'all') return true;
              if (highlightMode === 'daily') return type === 'core' || type === 'scenario';
              if (highlightMode === 'exam') return type === 'required' || type === 'extra';
              return highlightMode === type;
          };
          """
          if text.count(old_filter) != 1:
              raise SystemExit(f'vocabulary filter: expected 1 match, found {text.count(old_filter)}')
          paragraph.write_text(text.replace(old_filter, new_filter, 1), encoding='utf-8')
          PY

      - name: Validate source switching
        run: |
          grep -q "vocabularySource, setVocabularySource.*'all'" src/App.jsx
          grep -q "value=\"ielts\"" src/App.jsx
          grep -q "value=\"kaoyan\"" src/App.jsx
          grep -q "全部词汇" src/App.jsx
          grep -q "全部雅思词" src/App.jsx
          grep -q "全部考研词" src/App.jsx
          grep -q "考研基础词" src/components/Paragraph.jsx
          grep -q "highlightMode === 'exam'" src/components/Paragraph.jsx
          grep -q "IELTS_DICT_URL" src/core/vocabulary.js
          grep -q "registerPwa" src/main.jsx
          git diff --check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production app
        run: npm run build

      - name: Commit and push to main
        run: |
          rm -f .github/workflows/apply-vocabulary-source-submenu.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve IELTS and kaoyan vocabulary menus'
          git push origin HEAD:main
