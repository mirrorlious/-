name: Diagnose translation alignment patch

on:
  push:
    branches:
      - feat/reader-annotations-v2
    paths:
      - TASK_LOGS/.trigger-translation-read-status-debug

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Extract embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          workflow = Path('.github/workflows/apply_reader_translation_read_status.yml').read_text(encoding='utf-8')
          match = re.search(r"cat > /tmp/reader_patch\.b64 <<'B64'\n\s*([A-Za-z0-9+/=\n ]+?)\n\s*B64", workflow)
          if not match:
              raise SystemExit('Embedded patch payload not found')
          payload = ''.join(match.group(1).split())
          patch_path = Path('/tmp/patch_reader.py')
          script = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          old = "replace_once(old_translation, new_translation, 'replace full translation protocol')"
          new = "sub_once(r\"        const callGeminiFullTranslation = async \\\\(fullText, apiConfig\\\\) => \\\\{[\\\\s\\\\S]*?\\\\n        \\\\};\\\\n\\\\n        const callGeminiTranslation\", new_translation + \\"\\\\n        const callGeminiTranslation\\", 'replace full translation protocol', flags=re.M)"
          if old not in script:
              raise SystemExit('Translation replacement hook not found in patch')
          patch_path.write_text(script.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile /tmp/patch_reader.py

      - name: Run patch and preserve diagnostics
        shell: bash
        run: |
          set +e
          python /tmp/patch_reader.py > /tmp/patch-output.txt 2>&1
          status=$?
          cat /tmp/patch-output.txt
          if [ "$status" -ne 0 ]; then
            cp /tmp/patch-output.txt TASK_LOGS/translation-patch-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add TASK_LOGS/translation-patch-error.txt
            git commit -m "chore: log translation patch failure" || true
            git push origin HEAD:feat/reader-annotations-v2
            exit "$status"
          fi
          echo 'Patch succeeded during diagnostic run.'
