name: Apply full-width icon reader layout

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply, validate and capture diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/one_shot_fullwidth_icon_layout.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('split(/\\n+/)', 'split(/\\\\n+/)')
          path.write_text(source, encoding='utf-8')
          PY

          set +e
          python scripts/one_shot_fullwidth_icon_layout.py > /tmp/patch.log 2>&1
          patch_code=$?
          diff_code=99
          static_code=99
          npm_code=99
          babel_code=99

          if [ "$patch_code" -eq 0 ]; then
            git diff --check > /tmp/diff.log 2>&1
            diff_code=$?

            python - <<'PY' > /tmp/static.log 2>&1
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'const [articleColumnMode, setArticleColumnMode]',
              'readerToolbarIconClass',
              'reader-article-columns',
              'aria-label="标准布局"',
              'aria-label="正文与侧栏分栏"',
              'aria-label="专注布局"',
              'reader-side-shell',
              'reader-side-scroll custom-scrollbar',
              "articleColumnMode === 'double' ? 'reader-article-body-wide reader-article-columns'",
              "isReadingMode || isPdfMode ? 'w-full max-w-none"
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          if 'max-w-[1480px] sm:my-8' in text:
              raise SystemExit('Old constrained split main width still present')
          print('Static layout markers passed')
          PY
            static_code=$?

            python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          PY

            npm init -y > /tmp/npm.log 2>&1
            npm install --no-save @babel/core @babel/preset-react >> /tmp/npm.log 2>&1
            npm_code=$?

            node - <<'NODE' > /tmp/babel.log 2>&1
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE
            babel_code=$?
          fi
          set -e

          {
            echo "patch_code=$patch_code"
            echo "diff_code=$diff_code"
            echo "static_code=$static_code"
            echo "npm_code=$npm_code"
            echo "babel_code=$babel_code"
            echo "commit=${GITHUB_SHA}"
            echo "---- patch ----"
            cat /tmp/patch.log
            echo "---- diff ----"
            cat /tmp/diff.log 2>/dev/null || true
            echo "---- static ----"
            cat /tmp/static.log 2>/dev/null || true
            echo "---- npm ----"
            tail -n 20 /tmp/npm.log 2>/dev/null || true
            echo "---- babel ----"
            cat /tmp/babel.log 2>/dev/null || true
          } > TASK_LOGS/fullwidth-icon-layout-run-output.txt

      - name: Commit feature or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if grep -q '^patch_code=0$' TASK_LOGS/fullwidth-icon-layout-run-output.txt \
            && grep -q '^diff_code=0$' TASK_LOGS/fullwidth-icon-layout-run-output.txt \
            && grep -q '^static_code=0$' TASK_LOGS/fullwidth-icon-layout-run-output.txt \
            && grep -q '^npm_code=0$' TASK_LOGS/fullwidth-icon-layout-run-output.txt \
            && grep -q '^babel_code=0$' TASK_LOGS/fullwidth-icon-layout-run-output.txt; then
            git commit -m "feat: use full-width icon reader layout"
          else
            git commit -m "chore: record full-width layout failure"
          fi
          git push origin HEAD:feat/reader-annotations-v2
