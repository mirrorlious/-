name: Validate four reading panel improvements once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Static and JSX validation
        shell: bash
        run: |
          git diff --check HEAD~3..HEAD
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "['outline', 'quiz', 'analysis', 'notes']",
              "['quiz', '模拟习题']",
              'data-reader-structure-view-toggle="true"',
              "rightPanelTab === 'quiz' && renderPracticePanel()",
              'data-reader-practice-panel="document"',
              'data-reader-translation-stack="true"',
              '>添加笔记</button>',
              'data-reader-note-flag="true"'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if "['mindmap', '思维导图']" in text:
              raise SystemExit('Legacy mindmap tab remains')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          print('Static validation passed')
          PY
          npm init -y >/tmp/npm.log 2>&1
          npm install --no-save @babel/core @babel/preset-react >>/tmp/npm.log 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          babel.transformSync(fs.readFileSync('/tmp/reader.jsx', 'utf8'), {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE

      - name: Remove temporary diagnostics and validator
        shell: bash
        run: |
          rm -f TASK_LOGS/four-panel-patch-output.txt
          rm -f .github/workflows/validate_four_panel_cleanup_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize four-panel validation"
          git push origin HEAD:feat/reader-annotations-v2
