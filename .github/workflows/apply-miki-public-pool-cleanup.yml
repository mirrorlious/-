name: Apply and verify Miki public pool cleanup

on:
  push:
    branches:
      - chore/remove-miki-public-pool
    paths:
      - .apply-miki-public-pool-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded cleanup
        run: python .github/scripts/apply_miki_public_pool_cleanup.py

      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm ci --include=dev

      - id: unit
        name: Run unit tests
        continue-on-error: true
        run: npm run test:unit

      - id: lint
        name: Run accessibility lint
        continue-on-error: true
        run: npm run lint:a11y

      - id: build
        name: Build production application
        continue-on-error: true
        run: npm run build

      - id: edge_install
        name: Install Playwright Edge
        continue-on-error: true
        run: npx playwright install --with-deps msedge

      - id: e2e
        name: Run end-to-end tests
        if: steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.edge_install.outcome == 'success'
        continue-on-error: true
        run: npm run test:e2e

      - id: diff_check
        name: Check whitespace
        continue-on-error: true
        run: git diff --check

      - name: Finalize cleanup branch and task log
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          EDGEINSTALL_RESULT: ${{ steps.edge_install.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
          DIFFCHECK_RESULT: ${{ steps.diff_check.outcome }}
        run: |
          set -euo pipefail
          python .github/scripts/finalize_miki_public_pool_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove migrated Miki public resources"
          git push origin HEAD:chore/remove-miki-public-pool

      - name: Fail when required verification failed
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
          DIFFCHECK_RESULT: ${{ steps.diff_check.outcome }}
        run: |
          test "${INSTALL_RESULT}" = success
          test "${UNIT_RESULT}" = success
          test "${LINT_RESULT}" = success
          test "${BUILD_RESULT}" = success
          test "${E2E_RESULT}" = success
          test "${DIFFCHECK_RESULT}" = success
