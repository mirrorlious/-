name: Apply mobile inline paragraph results once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply scoped patch
        shell: bash
        run: python scripts/one_shot_mobile_inline_paragraph_results.py

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "window.matchMedia('(min-width: 1200px)')",
              "const isLearningPanelDocked = layoutMode === 'split' && rightPanelOpen && isLearningPanelWide;",
              'inlineResultsEnabled={!isLearningPanelDocked}',
              'if (isLearningPanelDocked) {',
              'inlineResultsEnabled && showTranslation && finalTranslationToShow',
              'inlineResultsEnabled && showAnalysis && analysisData && <SyntaxBreakdowns data={analysisData} />'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if text.count('inlineResultsEnabled={!isLearningPanelDocked}') != 1:
              raise SystemExit('Unexpected inline result prop count')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          print('Static checks passed')
          PY
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          PY
          npm init -y >/tmp/npm.log 2>&1
          npm install --no-save @babel/core @babel/preset-react >>/tmp/npm.log 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show paragraph results inline when side panel is not docked"
          git push origin HEAD:feat/reader-annotations-v2
