name: Run reader patch on feature branch

on:
  pull_request:
    branches:
      - feat/reader-annotations-v2
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-feature-branch:
    if: github.head_ref == 'feat/reader-polish-book-import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --single-branch --branch feat/reader-polish-book-import "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Apply patch when needed
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          if grep -q 'ANNOTATION_COLOR_MAP' index.html; then
            echo 'Reader patch is already present; skipping the one-time patch.'
            exit 0
          fi
          git show 13e05e1eb69df0a5948508c7f24968c78e934a99:scripts/apply_reader_improvements.py.gz.b64 | base64 -d | gzip -d > /tmp/apply_reader_improvements.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_reader_improvements.py')
          source = path.read_text(encoding='utf-8')
          helper_anchor = """def regex_once(pattern, repl, label, flags=re.S):
              global text
              text2, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 regex match, got {count}')
              text = text2
          """
          helper_replacement = helper_anchor + """

          def replace_last(old, new, label):
              global text
              count = text.count(old)
              if count < 1:
                  raise RuntimeError(f'{label}: expected at least 1 exact match, got {count}')
              head, separator, tail = text.rpartition(old)
              text = head + new + tail
          """
          if helper_anchor not in source:
              raise SystemExit('helper anchor missing')
          source = source.replace(helper_anchor, helper_replacement, 1)
          fullscreen_anchor = """replace_once(
              '                                            <LogicTreeNode node={fullMapData.mindmap} isRoot={true} displayMode={mapMode} collapsedNodes={collapsedMapNodes} onToggle={toggleMapNode} />',
          """
          if fullscreen_anchor not in source:
              raise SystemExit('fullscreen anchor missing')
          source = source.replace(fullscreen_anchor, fullscreen_anchor.replace('replace_once(', 'replace_last(', 1), 1)
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile /tmp/apply_reader_improvements.py
          python /tmp/apply_reader_improvements.py > /tmp/reader-patch.log 2>&1

      - name: Show concise patch failure
        if: steps.patch.outcome == 'failure'
        run: |
          echo '--- reader patch failure ---'
          cat /tmp/reader-patch.log || true
          exit 1

      - name: Repair generated escape sequences
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          broken = 'const totalText = extractedPages.map(page => page.text).join("\n\n").trim();'
          fixed = 'const totalText = extractedPages.map(page => page.text).join("\\n\\n").trim();'
          if broken in text:
              text = text.replace(broken, fixed, 1)
              path.write_text(text, encoding='utf-8')
              print('Repaired PDF page join escape sequence')
          else:
              print('No generated escape repair needed')
          PY

      - name: Validate markers and Babel JSX
        env:
          npm_config_loglevel: silent
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['ANNOTATION_COLOR_MAP', '书籍识别结果', 'saveSelectedBookArticles', '编辑内容', 'book-imports', 'reader-theme-root']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing required markers: {missing}')
          if text.count('<html') != 1 or text.count('</html>') != 1:
              raise SystemExit('HTML shell is malformed')
          match = re.search(r'<script type="text/babel"[^>]*>([\s\S]*?)</script>', text)
          if not match:
              raise SystemExit('Babel application script not found')
          Path('/tmp/reader-app.jsx').write_text(match.group(1), encoding='utf-8')
          print('Validation markers present; JSX extracted')
          PY
          mkdir -p /tmp/babel-check
          cd /tmp/babel-check
          npm init -y >/dev/null 2>&1
          npm install --silent @babel/core @babel/preset-react
          NODE_PATH=/tmp/babel-check/node_modules node - <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const presetReact = require('@babel/preset-react');
          const source = fs.readFileSync('/tmp/reader-app.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'reader-app.jsx',
            presets: [[presetReact, { runtime: 'classic' }]],
            parserOpts: { sourceType: 'module', plugins: ['jsx'] }
          });
          console.log('Babel JSX parse passed');
          NODE
          cd "$GITHUB_WORKSPACE"
          git diff --check

      - name: Commit feature changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 0
          fi
          git config user.name 'reader-improvement-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: validate and repair reader improvements [skip ci]'
          git push origin HEAD:feat/reader-polish-book-import
