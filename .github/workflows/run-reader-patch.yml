name: Run reader patch on feature branch

on:
  pull_request:
    branches:
      - feat/reader-annotations-v2
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-feature-branch:
    if: github.head_ref == 'feat/reader-polish-book-import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --single-branch --branch feat/reader-polish-book-import "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Decode and apply patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          base64 -d scripts/apply_reader_improvements.py.gz.b64 | gzip -d > /tmp/apply_reader_improvements.py
          python -m py_compile /tmp/apply_reader_improvements.py
          python /tmp/apply_reader_improvements.py > /tmp/reader-patch.log 2>&1

      - name: Show concise patch failure
        if: steps.patch.outcome == 'failure'
        run: |
          echo '--- reader patch failure ---'
          cat /tmp/reader-patch.log || true
          exit 1

      - name: Validate page
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['ANNOTATION_COLOR_MAP', '书籍识别结果', 'saveSelectedBookArticles', '编辑内容', 'book-imports', 'reader-theme-root']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing required markers: {missing}')
          if text.count('<html') != 1 or text.count('</html>') != 1:
              raise SystemExit('HTML shell is malformed')
          print('Validation markers present')
          PY
          git diff --check

      - name: Commit feature changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 0
          fi
          git config user.name 'reader-improvement-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: polish annotations, editable tree and book import [skip ci]'
          git push origin HEAD:feat/reader-polish-book-import
