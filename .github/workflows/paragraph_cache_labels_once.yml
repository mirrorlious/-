name: Add paragraph cache labels once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply scoped patch
        shell: bash
        run: python scripts/one_shot_paragraph_cache_labels.py

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'finalTranslationToShow ? <span className="text-[10px] text-sky-600 dark:text-sky-400">已缓存</span>',
              'analysisData ? <span className="text-[10px] text-amber-600 dark:text-amber-400">已缓存</span>',
              'audioUrl ? <span className="text-[10px] text-blue-600 dark:text-blue-400">已缓存</span>',
              'quizData ? <span className="text-[10px] text-violet-600 dark:text-violet-400">已缓存</span>',
              'if (existingTranslation)',
              'if (analysisData)',
              'if (quizData)'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          print('Static checks passed')
          PY
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          PY
          npm init -y >/tmp/npm.log 2>&1
          npm install --no-save @babel/core @babel/preset-react >>/tmp/npm.log 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show cached status in paragraph tools"
          git push origin HEAD:feat/reader-annotations-v2
