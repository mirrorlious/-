name: Record Miki cleanup post-merge state

on:
  push:
    branches:
      - main
    paths:
      - .record-miki-cleanup-post-merge-trigger

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/record_miki_cleanup_post_merge.py
      - name: Commit task log update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: record public pool cleanup merge"
          git push origin HEAD:main
