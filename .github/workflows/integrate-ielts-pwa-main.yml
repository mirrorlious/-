name: Integrate IELTS vocabulary into PWA main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'ci/integrate-ielts-pwa-main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch IELTS source branch
        run: git fetch origin feat/ielts-four-level-vocabulary

      - name: Port IELTS four-level vocabulary into Vite app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-resources/ielts-vocabulary
          git show origin/feat/ielts-four-level-vocabulary:public-resources/ielts-vocabulary/README.md > public-resources/ielts-vocabulary/README.md
          git show origin/feat/ielts-four-level-vocabulary:public-resources/ielts-vocabulary/ielts-vocabulary-4-level.json > public-resources/ielts-vocabulary/ielts-vocabulary-4-level.json

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_count(path, old, new, expected, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          vocab = Path('src/core/vocabulary.js')
          app = Path('src/App.jsx')
          paragraph = Path('src/components/Paragraph.jsx')

          replace_once(
              vocab,
              "const EXTRA_DICT_URL = `${VOCAB_RESOURCE_BASE}/考研英语红宝书词汇27新版【超纲词】qy自制.json`;\n",
              "const EXTRA_DICT_URL = `${VOCAB_RESOURCE_BASE}/考研英语红宝书词汇27新版【超纲词】qy自制.json`;\n\nconst IELTS_DICT_URL = './public-resources/ielts-vocabulary/ielts-vocabulary-4-level.json';\n",
              'IELTS URL'
          )

          fetch_marker = """const fetchVocabularyPack = async (url) => {
              const response = await fetch(url);
              if (!response.ok) throw new Error(`Failed to fetch vocabulary pack: ${response.status}`);
              return parseVocabularyPack(await response.json());
          };
          """
          fetch_ielts = fetch_marker + """
          const parseIELTSVocabularyPack = (items) => {
              const dict = {};
              if (!items || typeof items !== 'object' || Array.isArray(items)) return dict;
              Object.entries(items).forEach(([rawWord, item]) => {
                  const key = String(rawWord || '').trim().toLowerCase();
                  if (!key || !item) return;
                  dict[key] = {
                      translation: String(item.translation || '').trim(),
                      ieltsLevel: String(item.ieltsLevel || 'extended').trim(),
                      learningAdvice: String(item.learningAdvice || '').trim(),
                      ieltsReason: String(item.ieltsReason || '').trim(),
                      overlapTags: Array.isArray(item.overlapTags) ? item.overlapTags : [],
                      redbookCategories: Array.isArray(item.redbookCategories) ? item.redbookCategories : [],
                      qualityStatus: String(item.qualityStatus || 'review').trim()
                  };
              });
              return dict;
          };

          const fetchIELTSVocabularyPack = async (url) => {
              const response = await fetch(url);
              if (!response.ok) throw new Error(`Failed to fetch IELTS vocabulary pack: ${response.status}`);
              return parseIELTSVocabularyPack(await response.json());
          };
          """
          replace_once(vocab, fetch_marker, fetch_ielts, 'IELTS parser')

          replace_once(
              vocab,
              """                note: entry.memo || '',
                          type,
                          word
          """,
              """                note: entry.memo || '',
                          type: entry.ieltsLevel || type,
                          learningAdvice: entry.learningAdvice || '',
                          ieltsReason: entry.ieltsReason || '',
                          overlapTags: Array.isArray(entry.overlapTags) ? entry.overlapTags : [],
                          redbookCategories: Array.isArray(entry.redbookCategories) ? entry.redbookCategories : [],
                          qualityStatus: entry.qualityStatus || '',
                          word
          """,
              'lemma metadata'
          )

          replace_once(
              vocab,
              """  EXTRA_DICT_URL,
            REAL_EXAM_CORPUS,
            parseDictText,
            fetchVocabularyPack,
          """,
              """  EXTRA_DICT_URL,
            IELTS_DICT_URL,
            REAL_EXAM_CORPUS,
            parseDictText,
            fetchVocabularyPack,
            fetchIELTSVocabularyPack,
          """,
              'vocabulary exports'
          )

          replace_once(
              app,
              """  EXTRA_DICT_URL,
            parseDictText,
            fetchVocabularyPack,
          """,
              """  EXTRA_DICT_URL,
            IELTS_DICT_URL,
            parseDictText,
            fetchVocabularyPack,
            fetchIELTSVocabularyPack,
          """,
              'App vocabulary imports'
          )
          replace_once(app, "const [highlightMode, setHighlightMode] = useState('exam');", "const [highlightMode, setHighlightMode] = useState('daily');", 'default IELTS filter')
          replace_once(
              app,
              """    const [basicDict, setBasicDict] = useState({});
              const [requiredDict, setRequiredDict] = useState({});
              const [extraDict, setExtraDict] = useState({});
          """,
              """    const [basicDict, setBasicDict] = useState({});
              const [requiredDict, setRequiredDict] = useState({});
              const [extraDict, setExtraDict] = useState({});
              const [ieltsDict, setIeltsDict] = useState({});
          """,
              'IELTS state'
          )
          replace_once(
              app,
              """    const activeDicts = useMemo(() => [
                  { data: extraDict, type: 'extra' },
                  { data: requiredDict, type: 'required' },
                  { data: basicDict, type: 'basic' },
                  { data: customDict, type: 'custom' }
              ], [extraDict, requiredDict, basicDict, customDict]);
          """,
              """    const activeDicts = useMemo(() => [
                  { data: ieltsDict, type: 'extended' },
                  { data: customDict, type: 'custom' }
              ], [ieltsDict, customDict]);
          """,
              'active IELTS dictionaries'
          )
          replace_once(
              app,
              """        Promise.all([
                      fetchVocabularyPack(BASIC_DICT_URL),
                      fetchVocabularyPack(REQUIRED_DICT_URL),
                      fetchVocabularyPack(EXTRA_DICT_URL)
                  ]).then(([basic, required, extra]) => {
                      setBasicDict(basic);
                      setRequiredDict(required);
                      setExtraDict(extra);
                  }).catch(error => {
                      console.error('Error loading classified vocabulary packs:', error);
                      window.showToast('分级词库加载失败，请刷新后重试', 'error');
                  });
          """,
              """        Promise.all([
                      fetchVocabularyPack(BASIC_DICT_URL),
                      fetchVocabularyPack(REQUIRED_DICT_URL),
                      fetchVocabularyPack(EXTRA_DICT_URL),
                      fetchIELTSVocabularyPack(IELTS_DICT_URL)
                  ]).then(([basic, required, extra, ielts]) => {
                      setBasicDict(basic);
                      setRequiredDict(required);
                      setExtraDict(extra);
                      setIeltsDict(ielts);
                  }).catch(error => {
                      console.error('Error loading IELTS vocabulary packs:', error);
                      window.showToast('雅思分层词库加载失败，请刷新后重试', 'error');
                  });
          """,
              'IELTS loading'
          )
          replace_once(
              app,
              """                                    <select value={highlightMode} onChange={(event) => setHighlightMode(event.target.value)} aria-label=\"词汇高亮范围\" title=\"词汇高亮范围\" className=\"h-9 w-[112px] px-2 rounded-sm text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer\">
                                              <option value=\"exam\">必考＋超纲</option>
                                              <option value=\"all\">全部词汇</option>
                                              <option value=\"basic\">基础词</option>
                                              <option value=\"required\">必考词</option>
                                              <option value=\"extra\">超纲词</option>
                                              <option value=\"none\">关闭标注</option>
                                          </select>
          """,
              """                                    <select value={highlightMode} onChange={(event) => setHighlightMode(event.target.value)} aria-label=\"词汇高亮范围\" title=\"词汇高亮范围\" className=\"h-9 w-[124px] px-2 rounded-sm text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer\">
                                              <option value=\"daily\">核心＋场景</option>
                                              <option value=\"all\">全部雅思词</option>
                                              <option value=\"core\">雅思核心词</option>
                                              <option value=\"scenario\">雅思场景词</option>
                                              <option value=\"overlap\">基础重合词</option>
                                              <option value=\"extended\">雅思扩展词</option>
                                              <option value=\"none\">关闭标注</option>
                                          </select>
          """,
              'IELTS selector'
          )

          old_meta = """const VOCAB_TYPE_META = {
              basic: {
                  label: '基础词',
                  underline: 'decoration-green-600 dark:decoration-green-400',
                  badge: 'bg-green-600 dark:bg-green-700',
                  text: 'text-green-700 dark:text-green-400'
              },
              required: {
                  label: '必考词',
                  underline: 'decoration-sky-600 dark:decoration-sky-400',
                  badge: 'bg-sky-600 dark:bg-sky-700',
                  text: 'text-sky-700 dark:text-sky-300'
              },
              extra: {
                  label: '超纲词',
                  underline: 'decoration-red-600 dark:decoration-red-400',
                  badge: 'bg-red-600 dark:bg-red-700',
                  text: 'text-red-700 dark:text-red-400'
              },
              custom: {
                  label: '个人词库',
                  underline: 'decoration-amber-500 dark:decoration-amber-400 decoration-dotted',
                  badge: 'bg-amber-600 dark:bg-amber-700',
                  text: 'text-amber-700 dark:text-amber-400'
              },
              phrase: {
                  label: '语法与佳句',
                  underline: 'decoration-violet-500 dark:decoration-violet-400 decoration-dashed',
                  badge: 'bg-violet-600 dark:bg-violet-700',
                  text: 'text-violet-700 dark:text-violet-300'
              }
          };

          const shouldShowVocabType = (type, highlightMode) => {
              if (highlightMode === 'none') return false;
              if (highlightMode === 'all') return true;
              if (highlightMode === 'exam') return type === 'required' || type === 'extra';
              return highlightMode === type;
          };
          """
          new_meta = """const VOCAB_TYPE_META = {
              core: {
                  label: '雅思核心词', advice: '优先学习',
                  underline: 'decoration-sky-600 dark:decoration-sky-400',
                  badge: 'bg-sky-600 dark:bg-sky-700', text: 'text-sky-700 dark:text-sky-300'
              },
              scenario: {
                  label: '雅思场景词', advice: '正常学习',
                  underline: 'decoration-emerald-600 dark:decoration-emerald-400',
                  badge: 'bg-emerald-600 dark:bg-emerald-700', text: 'text-emerald-700 dark:text-emerald-300'
              },
              overlap: {
                  label: '雅思基础重合词', advice: '可选择跳过',
                  underline: 'decoration-amber-500 dark:decoration-amber-400',
                  badge: 'bg-amber-500 dark:bg-amber-600', text: 'text-amber-700 dark:text-amber-300'
              },
              extended: {
                  label: '雅思扩展词', advice: '后期学习',
                  underline: 'decoration-violet-500 dark:decoration-violet-400 decoration-dotted',
                  badge: 'bg-violet-600 dark:bg-violet-700', text: 'text-violet-700 dark:text-violet-300'
              },
              custom: {
                  label: '个人词库', advice: '个人标记',
                  underline: 'decoration-rose-500 dark:decoration-rose-400 decoration-dotted',
                  badge: 'bg-rose-600 dark:bg-rose-700', text: 'text-rose-700 dark:text-rose-300'
              },
              phrase: {
                  label: '语法与佳句', advice: '结合语境学习',
                  underline: 'decoration-indigo-500 dark:decoration-indigo-400 decoration-dashed',
                  badge: 'bg-indigo-600 dark:bg-indigo-700', text: 'text-indigo-700 dark:text-indigo-300'
              }
          };

          const shouldShowVocabType = (type, highlightMode) => {
              if (highlightMode === 'none') return false;
              if (highlightMode === 'all') return true;
              if (highlightMode === 'daily') return type === 'core' || type === 'scenario';
              return highlightMode === type;
          };
          """
          replace_once(paragraph, old_meta, new_meta, 'IELTS visual metadata')

          replace_once(paragraph, "const { translation, type, word: lemma, category, memo } = match;", "const { translation, type, word: lemma, category, memo, learningAdvice, ieltsReason, overlapTags, redbookCategories, qualityStatus } = match;", 'word metadata destructuring')
          replace_count(
              paragraph,
              "onWordClick({ word: part, lemma, translation, type, category, memo, note: memo }, event.currentTarget)",
              "onWordClick({ word: part, lemma, translation, type, category, memo, note: memo, learningAdvice, ieltsReason, overlapTags, redbookCategories, qualityStatus }, event.currentTarget)",
              2,
              'word click payloads'
          )
          replace_once(
              paragraph,
              """                            trans: entry.translation || entry.zh || '',
                                      note: entry.memo || '',
                                      category: entry.category || '',
                                      type: dict.type
          """,
              """                            trans: entry.translation || entry.zh || '',
                                      note: entry.memo || '',
                                      category: entry.category || '',
                                      type: entry.ieltsLevel || dict.type,
                                      learningAdvice: entry.learningAdvice || '',
                                      ieltsReason: entry.ieltsReason || '',
                                      overlapTags: Array.isArray(entry.overlapTags) ? entry.overlapTags : [],
                                      redbookCategories: Array.isArray(entry.redbookCategories) ? entry.redbookCategories : [],
                                      qualityStatus: entry.qualityStatus || ''
          """,
              'phrase metadata lookup'
          )
          replace_count(
              paragraph,
              """                            note: phraseData.note,
                                      category: phraseData.category,
                                      type: phraseType
          """,
              """                            note: phraseData.note,
                                      category: phraseData.category,
                                      type: phraseType,
                                      learningAdvice: phraseData.learningAdvice,
                                      ieltsReason: phraseData.ieltsReason,
                                      overlapTags: phraseData.overlapTags,
                                      redbookCategories: phraseData.redbookCategories,
                                      qualityStatus: phraseData.qualityStatus
          """,
              2,
              'phrase click metadata'
          )
          replace_once(
              paragraph,
              """                    {activeNote.category && <div className=\"mb-2 text-[11px] text-gray-500 dark:text-gray-400\">{activeNote.category}</div>}
                          {activeNote.note && <div className=\"text-[13.5px] text-gray-700 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-900 p-3 rounded-lg border border-gray-100 dark:border-gray-700\">{activeNote.note}</div>}
          """,
              """                    {activeNote.category && <div className=\"mb-2 text-[11px] text-gray-500 dark:text-gray-400\">{activeNote.category}</div>}
                          {(activeNote.learningAdvice || (VOCAB_TYPE_META[activeNote.type] || {}).advice) && (
                              <div className=\"mb-2 flex items-center gap-2 text-[11px]\">
                                  <span className=\"font-semibold text-gray-500 dark:text-gray-400\">学习建议</span>
                                  <span className=\"px-2 py-0.5 rounded-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200\">{activeNote.learningAdvice || (VOCAB_TYPE_META[activeNote.type] || {}).advice}</span>
                              </div>
                          )}
                          {activeNote.ieltsReason && <div className=\"mb-2 text-[12px] leading-relaxed text-gray-600 dark:text-gray-300\">{activeNote.ieltsReason}</div>}
                          {Array.isArray(activeNote.overlapTags) && activeNote.overlapTags.length > 0 && (
                              <div className=\"mb-2 flex flex-wrap items-center gap-1.5\">
                                  <span className=\"text-[10px] text-gray-400 dark:text-gray-500 mr-1\">重合标签</span>
                                  {activeNote.overlapTags.map(tag => <span key={tag} className=\"px-1.5 py-0.5 text-[10px] rounded-sm border border-gray-200 dark:border-gray-600 text-gray-500 dark:text-gray-300 bg-gray-50 dark:bg-gray-900\">{tag}</span>)}
                              </div>
                          )}
                          {activeNote.qualityStatus === 'review' && <div className=\"mb-2 text-[10px] text-amber-700 dark:text-amber-300\">该词来自 OCR 或程序补充释义，建议结合语境复核。</div>}
                          {activeNote.note && <div className=\"text-[13.5px] text-gray-700 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-900 p-3 rounded-lg border border-gray-100 dark:border-gray-700\">{activeNote.note}</div>}
          """,
              'IELTS word card'
          )
          PY

      - name: Validate vocabulary data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('public-resources/ielts-vocabulary/ielts-vocabulary-4-level.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert len(data) == 1992, len(data)
          counts = {}
          for item in data.values():
              counts[item['ieltsLevel']] = counts.get(item['ieltsLevel'], 0) + 1
          assert counts == {'extended': 554, 'core': 374, 'overlap': 739, 'scenario': 325}, counts
          PY
          grep -q "registerPwa" src/main.jsx
          grep -q "IELTS_DICT_URL" src/core/vocabulary.js
          grep -q "核心＋场景" src/App.jsx
          grep -q "雅思基础重合词" src/components/Paragraph.jsx
          git diff --check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production app
        run: npm run build

      - name: Commit integration to main
        run: |
          rm -f .github/workflows/integrate-ielts-pwa-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate IELTS vocabulary layers with PWA app'
          git push origin HEAD:main
