name: Apply reader annotations to feature branch

on:
  pull_request:
    branches:
      - feat/reader-layout-context-typography
    paths:
      - scripts/apply_reader_annotations.py
      - .github/workflows/apply-reader-annotations.yml
      - TASK_LOGS/2026-07-27-reader-annotations.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-feature-branch:
    if: github.head_ref == 'feat/reader-annotations-v2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply annotation patch and capture diagnostics
        id: apply_patch
        shell: bash
        run: |
          set +e
          python scripts/apply_reader_annotations.py > annotation-patch.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "Annotation patch failed:"
            cat annotation-patch.log
          else
            cat annotation-patch.log
          fi
          exit 0

      - name: Persist patch failure report
        if: steps.apply_patch.outputs.status != '0'
        shell: bash
        run: |
          mkdir -p TASK_LOGS
          cp annotation-patch.log TASK_LOGS/annotation-patch-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TASK_LOGS/annotation-patch-error.txt
          git commit -m 'chore: capture annotation patch failure'
          git push origin HEAD:feat/reader-annotations-v2
          exit 1

      - name: Validate source
        if: steps.apply_patch.outputs.status == '0'
        shell: bash
        run: |
          git diff --check
          grep -q 'reader-annotation-mark' index.html
          grep -q '批注仅保存在当前设备' index.html
          grep -q 'Ctrl/⌘ + Alt + M' index.html
          grep -q '全文笔记' index.html

      - name: Commit feature branch
        if: steps.apply_patch.outputs.status == '0'
        shell: bash
        run: |
          rm -f annotation-patch.log
          rm -f TASK_LOGS/annotation-patch-error.txt
          rm -f scripts/apply_reader_annotations.py
          rm -f .github/workflows/apply-reader-annotations.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add anchored reader annotations and notes'
          git push origin HEAD:feat/reader-annotations-v2
