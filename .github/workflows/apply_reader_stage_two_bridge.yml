name: Apply reader stage two bridge

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  apply-stage-two:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Execute embedded stage-two patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply_reader_stage_two.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise SystemExit('Stage-two Python start marker not found')
          embedded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines())
          Path('/tmp/apply_stage_two.py').write_text(script + '\n', encoding='utf-8')
          PY
          python /tmp/apply_stage_two.py

      - name: Validate stage-two result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'book-imports',
              'segmentImportedText',
              '识别结果：{importReview.sourceName}',
              '编辑结构',
              'saveMapDraft',
              'editable={isMapEditing}',
              '[[ARTICLE_BREAK]]'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing stage-two markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          print('Stage-two marker validation passed')
          PY
          git diff --check

      - name: Commit stage two
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No stage-two changes to commit"
            exit 0
          fi
          git commit -m "feat: add editable outline and book import review"
          git push origin HEAD:feat/reader-annotations-v2
