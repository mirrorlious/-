name: Apply mobile inline results and annotation bubbles

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ci/mobile-inline-results'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch mobile paragraph interactions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          paragraph = Path('src/components/Paragraph.jsx')

          app_text = app.read_text(encoding='utf-8')

          focus_pattern = re.compile(
              r"    const focusAnnotation = \(annotationId\) => \{\n"
              r"        setActiveAnnotationId\(annotationId\);\n"
              r"        setNotesView\('annotations'\);\n"
              r"        setRightPanelTab\('notes'\);\n"
              r"        setLayoutMode\('split'\);\n"
              r"        setRightPanelOpen\(true\);\n"
              r"        window\.requestAnimationFrame\(\(\) => \{\n"
              r"            document\.querySelector\(`\[data-annotation-id=\"\$\{annotationId\}\"\]`\)\?\.scrollIntoView\(\{ behavior: 'smooth', block: 'center' \}\);\n"
              r"        \}\);\n"
              r"        window\.setTimeout\(\(\) => setActiveAnnotationId\(current => current === annotationId \? null : current\), 1800\);\n"
              r"    \};"
          )
          focus_replacement = """    const focusAnnotation = (annotationId) => {
              setActiveAnnotationId(annotationId);
              setNotesView('annotations');
              if (isLearningPanelWide) {
                  setRightPanelTab('notes');
                  setLayoutMode('split');
                  setRightPanelOpen(true);
              }
              window.requestAnimationFrame(() => {
                  document.querySelector(`[data-annotation-id=\"${annotationId}\"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
              });
              window.setTimeout(() => setActiveAnnotationId(current => current === annotationId ? null : current), 1800);
          };"""
          app_text, count = focus_pattern.subn(focus_replacement, app_text, count=1)
          if count != 1:
              raise SystemExit(f'focusAnnotation patch expected 1 match, found {count}')

          old_prop = "                                        compactActionsEnabled={!isLearningPanelWide}\n"
          new_prop = "                                        mobileAnnotationBubbleEnabled={!isLearningPanelWide}\n"
          if app_text.count(old_prop) != 1:
              raise SystemExit(f'mobile paragraph prop expected 1 match, found {app_text.count(old_prop)}')
          app_text = app_text.replace(old_prop, new_prop, 1)
          app.write_text(app_text, encoding='utf-8')

          text = paragraph.read_text(encoding='utf-8')

          old_signature = "inlineResultsEnabled = true, compactActionsEnabled = false, onPersistParagraphResult"
          new_signature = "inlineResultsEnabled = true, mobileAnnotationBubbleEnabled = false, onPersistParagraphResult"
          if text.count(old_signature) != 1:
              raise SystemExit(f'Paragraph signature expected 1 match, found {text.count(old_signature)}')
          text = text.replace(old_signature, new_signature, 1)

          state_anchor = "    const [showTranslation, setShowTranslation] = useState(false);\n"
          state_block = state_anchor + "    const [mobileAnnotationId, setMobileAnnotationId] = useState(null);\n"
          if text.count(state_anchor) != 1:
              raise SystemExit(f'mobile annotation state anchor expected 1 match, found {text.count(state_anchor)}')
          text = text.replace(state_anchor, state_block, 1)

          toggle_anchor = """    const handleToggleTrans = async (e) => {
              e.stopPropagation();
          """
          toggle_replacement = """    const handleToggleTrans = async (e) => {
              e.stopPropagation();
              if (e.detail > 1) return;
          """
          if text.count(toggle_anchor) != 1:
              raise SystemExit(f'translation toggle guard expected 1 match, found {text.count(toggle_anchor)}')
          text = text.replace(toggle_anchor, toggle_replacement, 1)

          analysis_anchor = """    const handleToggleAnalysis = async (e) => {
              e.stopPropagation();
          """
          analysis_replacement = """    const handleToggleAnalysis = async (e) => {
              e.stopPropagation();
              if (e.detail > 1) return;
          """
          if text.count(analysis_anchor) != 1:
              raise SystemExit(f'analysis toggle guard expected 1 match, found {text.count(analysis_anchor)}')
          text = text.replace(analysis_anchor, analysis_replacement, 1)

          helper_anchor = """    const runParagraphAction = (handler) => (event) => {
              handler(event);
              setIsInteracting(false);
          };
          """
          helper_block = helper_anchor + """

          const handleAnnotationOpen = (annotationId, event) => {
              event?.stopPropagation();
              if (event?.type === 'keydown') event.preventDefault();
              if (mobileAnnotationBubbleEnabled) {
                  setMobileAnnotationId(previous => previous === annotationId ? null : annotationId);
                  return;
              }
              onFocusAnnotation?.(annotationId);
          };

          useEffect(() => {
              if (!mobileAnnotationBubbleEnabled || !activeAnnotationId) return;
              if (annotations.some(annotation => annotation.id === activeAnnotationId)) {
                  setMobileAnnotationId(activeAnnotationId);
              }
          }, [mobileAnnotationBubbleEnabled, activeAnnotationId, annotations]);
          """
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'annotation helper anchor expected 1 match, found {text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper_block, 1)

          old_click = "onClick={(event) => { event.stopPropagation(); onFocusAnnotation?.(primaryAnnotationId); }}"
          new_click = "onClick={(event) => handleAnnotationOpen(primaryAnnotationId, event)}"
          if text.count(old_click) != 1:
              raise SystemExit(f'annotation mark click expected 1 match, found {text.count(old_click)}')
          text = text.replace(old_click, new_click, 1)

          old_key = "onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); onFocusAnnotation?.(primaryAnnotationId); } }}"
          new_key = "onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') handleAnnotationOpen(primaryAnnotationId, event); }}"
          if text.count(old_key) != 1:
              raise SystemExit(f'annotation mark keyboard expected 1 match, found {text.count(old_key)}')
          text = text.replace(old_key, new_key, 1)

          quick_pattern = re.compile(
              r"\n\s*\{compactActionsEnabled && \(\n"
              r"\s*<div className=\"mt-2 mb-3 flex items-center gap-2\" data-reader-mobile-actions=\"true\">.*?"
              r"\n\s*</div>\n\s*\)\}\n",
              re.S,
          )
          text, count = quick_pattern.subn("\n", text, count=1)
          if count != 1:
              raise SystemExit(f'mobile blue button removal expected 1 match, found {count}')

          flag_click = "onClick={(event) => { event.stopPropagation(); onFocusAnnotation?.(annotations[0].id); }}"
          flag_replacement = "onClick={(event) => handleAnnotationOpen(annotations[0].id, event)}"
          if text.count(flag_click) != 1:
              raise SystemExit(f'annotation flag click expected 1 match, found {text.count(flag_click)}')
          text = text.replace(flag_click, flag_replacement, 1)

          final_translation_anchor = "    const finalTranslationToShow = translationText || localTranslation;\n"
          final_translation_block = final_translation_anchor + "    const activeMobileAnnotation = annotations.find(annotation => annotation.id === mobileAnnotationId) || null;\n"
          if text.count(final_translation_anchor) != 1:
              raise SystemExit(f'active mobile annotation anchor expected 1 match, found {text.count(final_translation_anchor)}')
          text = text.replace(final_translation_anchor, final_translation_block, 1)

          bubble_anchor = """            {selectedText && (
                  <div role=\"toolbar\" aria-label=\"文字选区操作\""""
          bubble_block = """            {mobileAnnotationBubbleEnabled && activeMobileAnnotation && (
                  <>
                      <button
                          type=\"button\"
                          className=\"fixed inset-0 z-[70] bg-black/10 backdrop-blur-[1px]\"
                          aria-label=\"关闭批注气泡\"
                          onClick={() => setMobileAnnotationId(null)}
                      />
                      <aside
                          role=\"dialog\"
                          aria-modal=\"true\"
                          aria-label=\"本段批注\"
                          data-reader-annotation-bubble=\"true\"
                          className=\"fixed left-3 right-3 bottom-[max(14px,env(safe-area-inset-bottom))] z-[71] max-h-[46vh] overflow-y-auto rounded-2xl border border-amber-200 dark:border-amber-800 bg-white/98 dark:bg-gray-900/98 shadow-2xl p-4 animate-fade-in-down\"
                          onClick={(event) => event.stopPropagation()}
                      >
                          <div className=\"flex items-start justify-between gap-3\">
                              <div className=\"min-w-0\">
                                  <div className=\"text-[10px] font-semibold tracking-wider text-amber-700 dark:text-amber-400\">本段批注</div>
                                  <div className=\"mt-1 text-[12px] leading-relaxed text-amber-800 dark:text-amber-300 line-clamp-3\">“{activeMobileAnnotation.anchor?.exact || '已标注文字'}”</div>
                              </div>
                              <button type=\"button\" onClick={() => setMobileAnnotationId(null)} className=\"shrink-0 w-8 h-8 grid place-items-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-300\" aria-label=\"关闭批注\">×</button>
                          </div>
                          <div className=\"mt-3 whitespace-pre-wrap text-[14px] leading-7 text-gray-800 dark:text-gray-200\">{activeMobileAnnotation.note || '这条批注暂时没有正文。'}</div>
                          <div className=\"mt-3 text-[10px] text-gray-400\">{new Date(activeMobileAnnotation.updatedAt || activeMobileAnnotation.createdAt || Date.now()).toLocaleString('zh-CN')}</div>
                      </aside>
                  </>
              )}

              {selectedText && (
                  <div role=\"toolbar\" aria-label=\"文字选区操作\""" 
          if text.count(bubble_anchor) != 1:
              raise SystemExit(f'annotation bubble insertion expected 1 match, found {text.count(bubble_anchor)}')
          text = text.replace(bubble_anchor, bubble_block, 1)

          paragraph.write_text(text, encoding='utf-8')
          PY

      - name: Validate mobile behavior
        run: |
          grep -q "mobileAnnotationBubbleEnabled={!isLearningPanelWide}" src/App.jsx
          grep -q "if (isLearningPanelWide)" src/App.jsx
          grep -q "inlineResultsEnabled={!isLearningPanelDocked}" src/App.jsx
          ! grep -q "compactActionsEnabled" src/App.jsx
          ! grep -q "data-reader-mobile-actions" src/components/Paragraph.jsx
          grep -q "data-reader-annotation-bubble" src/components/Paragraph.jsx
          grep -q "activeMobileAnnotation.note" src/components/Paragraph.jsx
          grep -q "if (e.detail > 1) return" src/components/Paragraph.jsx
          grep -q "inlineResultsEnabled && showTranslation" src/components/Paragraph.jsx
          grep -q "inlineResultsEnabled && showAnalysis" src/components/Paragraph.jsx
          git diff --check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production app
        run: npm run build

      - name: Commit and push to main
        run: |
          rm -f .github/workflows/apply-mobile-inline-results.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore mobile inline results and annotation bubbles'
          git push origin HEAD:main
