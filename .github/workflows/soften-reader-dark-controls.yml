name: Soften remaining dark reader controls

on:
  pull_request:
    branches:
      - feat/reader-annotations-v2
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  soften:
    if: github.head_ref == 'feat/reader-polish-book-import'
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --single-branch --branch feat/reader-polish-book-import "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Replace remaining light-mode charcoal controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          insertion_point = '        .reader-theme-root:not(.dark) .bg-slate-900 {'
          addition = '''        .reader-theme-root:not(.dark) .bg-gray-800 {
              background-color: #527895 !important;
          }

          .reader-theme-root:not(.dark) .border-gray-800 {
              border-color: #91a9bb !important;
          }

          '''
          if '.reader-theme-root:not(.dark) .bg-gray-800 {' not in text:
              if insertion_point not in text:
                  raise SystemExit('Light theme insertion point not found')
              text = text.replace(insertion_point, addition + insertion_point, 1)
              path.write_text(text, encoding='utf-8')
              print('Softened remaining charcoal controls')
          else:
              print('Charcoal controls already softened')
          PY
          git diff --check

      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'reader-improvement-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'style: remove remaining charcoal controls in light mode [skip ci]'
          git push origin HEAD:feat/reader-polish-book-import
