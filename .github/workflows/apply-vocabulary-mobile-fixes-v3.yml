name: Apply vocabulary and mobile reader fixes v3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ci/vocabulary-source-submenu'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run simplified patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-vocabulary-mobile-fixes.yml')
          text = workflow.read_text(encoding='utf-8')
          step_start = text.index('      - name: Patch vocabulary menus and mobile reader')
          run_marker = text.index('        run: |', step_start)
          body_start = text.index('\n', run_marker) + 1
          body_end = text.index('\n      - name: Validate fixes', body_start)
          lines = text[body_start:body_end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          block_start = script.index('prop_old = """')
          block_end = script.index('\n\ntext = paragraph.read_text', block_start)
          replacement = dedent('''
          prop_line = "                                        inlineResultsEnabled={!isLearningPanelDocked}\\n"
          if text.count(prop_line) != 1:
              raise SystemExit(f'compact action prop line: expected 1 match, found {text.count(prop_line)}')
          text = text.replace(
              prop_line,
              prop_line + "                                        compactActionsEnabled={!isLearningPanelWide}\\n",
              1,
          )
          app.write_text(text, encoding='utf-8')
          ''').strip()
          script = script[:block_start] + replacement + script[block_end:]
          Path('/tmp/apply-vocabulary-mobile-fixes.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-vocabulary-mobile-fixes.sh

      - name: Validate fixes
        run: |
          grep -q "vocabularySource, setVocabularySource.*'all'" src/App.jsx
          grep -q "value=\"ielts\"" src/App.jsx
          grep -q "value=\"kaoyan\"" src/App.jsx
          grep -q "全部雅思词" src/App.jsx
          grep -q "全部考研词" src/App.jsx
          grep -q "手机端不支持分栏布局" src/App.jsx
          grep -q "手机端固定为文章单栏" src/App.jsx
          grep -q "手机端不启用学习侧栏" src/App.jsx
          grep -q "compactActionsEnabled={!isLearningPanelWide}" src/App.jsx
          grep -q "data-reader-mobile-actions" src/components/Paragraph.jsx
          grep -q "翻译本段" src/components/Paragraph.jsx
          grep -q "考研基础词" src/components/Paragraph.jsx
          grep -q "highlightMode === 'exam'" src/components/Paragraph.jsx
          grep -q "registerPwa" src/main.jsx
          git diff --check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production app
        run: npm run build

      - name: Commit and push to main
        run: |
          rm -f .github/workflows/apply-vocabulary-source-submenu.yml
          rm -f .github/workflows/apply-vocabulary-mobile-fixes.yml
          rm -f .github/workflows/apply-vocabulary-mobile-fixes-v2.yml
          rm -f .github/workflows/apply-vocabulary-mobile-fixes-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add vocabulary source menus and mobile paragraph actions'
          git push origin HEAD:main
