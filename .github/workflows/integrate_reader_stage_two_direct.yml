name: Integrate reader stage two directly

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  integrate-stage-two:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Fetch audited implementation branch
        shell: bash
        run: git fetch origin feat/reader-polish-book-import:refs/remotes/origin/feat/reader-polish-book-import

      - name: Validate audited candidate before integration
        shell: bash
        run: |
          git show origin/feat/reader-polish-book-import:index.html > /tmp/reader-stage-two.html
          grep -q 'reader-annotation-mark' /tmp/reader-stage-two.html
          grep -q 'ANNOTATION_COLOR_OPTIONS' /tmp/reader-stage-two.html
          grep -q 'segmentBookPages' /tmp/reader-stage-two.html
          grep -q 'prepareBookImport' /tmp/reader-stage-two.html
          grep -q "book-imports" /tmp/reader-stage-two.html
          grep -q "book-articles" /tmp/reader-stage-two.html
          grep -q 'mapEditDraft' /tmp/reader-stage-two.html
          grep -q 'isMapEditing' /tmp/reader-stage-two.html
          grep -q '保存选中' /tmp/reader-stage-two.html

      - name: Integrate candidate and improve OCR structure prompt
        shell: bash
        run: |
          cp /tmp/reader-stage-two.html index.html
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'const prompt = "Extract English text accurately. CRITICAL: Fix physical line breaks mid-sentence so paragraphs are continuous. Separate different paragraphs with double newlines strictly. Output ONLY the English text.";'
          new = 'const prompt = "Extract English text accurately. Preserve article titles and real paragraph boundaries. Ignore decorative cover text, table-of-contents entries, running headers, page numbers, image-only captions and copyright boilerplate. Fix physical line breaks inside sentences, but keep true paragraph breaks and place two blank lines before a clearly new article title. Output ONLY the cleaned English text.";'
          if old not in text:
              raise SystemExit('OCR prompt anchor missing in audited candidate')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate integrated source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'reader-annotation-mark',
              'ANNOTATION_COLOR_OPTIONS',
              'segmentBookPages',
              'prepareBookImport',
              "book-imports",
              "book-articles",
              'mapEditDraft',
              'isMapEditing',
              'openLatestBookImport',
              'saveSelectedBookArticles',
              'Preserve article titles and real paragraph boundaries'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing integrated markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          if 'window.apiKey = "";' not in text:
              raise SystemExit('Expected empty API key placeholder missing')
          print('Static marker validation passed')
          PY
          git diff --check

      - name: Parse JSX with Babel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader-stage-two.jsx').write_text(text[start:end], encoding='utf-8')
          PY
          npx --yes --package=@babel/core --package=@babel/preset-react node - <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader-stage-two.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE

      - name: Finalize task log and remove temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('TASK_LOGS/2026-07-27-0400-reader-stage-two-direct-integration.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('- 状态：开发中', '- 状态：部分完成', 1)
          text = text.replace('## 8. 实际修改\n\n开发中。', '''## 8. 实际修改

- 将已审计的完整 `index.html` 整合到当前批注分支。
- 加入全屏结构树编辑、节点增删、标题修改及当前文章本地保存。
- 加入 PDF 文本层优先、低文本页 OCR、逐页断点保存。
- 加入整本书文章切分、噪音过滤、文章预览、勾选、单篇精读和批量保存。
- 新增 IndexedDB `book-imports` 与 `book-articles`，保留 `pdf-tasks`、AI 缓存和批注数据。
- OCR 提示词改为保留标题与真实段落，并过滤封面、目录、页码、页眉和版权噪音。
- 保留批注颜色、Notes、BYOK 路由、分栏和排版功能。
- 删除失效的第二阶段临时工作流。''')
          text = text.replace('预计 IndexedDB 版本升级并新增 `book-imports`、`book-articles`；不得删除既有缓存和批注。', 'IndexedDB 版本升级为 2，新增 `book-imports`、`book-articles`；既有 `ai-cache`、`tts-cache`、`pdf-tasks` 与本地批注不删除。')
          text = text.replace('### 自动测试\n\n待执行。', '''### 自动测试

- 候选功能标记检查：通过
- `git diff --check`：通过
- HTML script 标签数量检查：通过
- API Key 空占位与敏感信息边界检查：通过
- Babel JSX 解析：通过''')
          text = text.replace('## 12. 未完成项\n\n开发中。', '''## 12. 未完成项

- 需要用户本地手工验收真实 PDF、扫描图片、目录页和多篇文章识别结果。
- 复杂杂志版式的文章边界可能需要用户修改标题或取消选择。
- 本次未合并到 `main`。''')
          text = text.replace('## 14. 最终结论\n\n当前状态：开发中。', '''## 14. 最终结论

当前状态：部分完成。代码已直接写入 `feat/reader-annotations-v2` 并完成自动语法与标记验证，等待用户本地手工验收；未合并 `main`。''')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/apply_reader_stage_two.yml
          rm -f .github/workflows/apply_reader_stage_two_bridge.yml
          rm -f .github/workflows/integrate_reader_stage_two_direct.yml

      - name: Commit integrated stage two
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html TASK_LOGS/2026-07-27-0400-reader-stage-two-direct-integration.md .github/workflows
          git commit -m "feat: integrate editable outline and book import review"
          git push origin HEAD:feat/reader-annotations-v2
