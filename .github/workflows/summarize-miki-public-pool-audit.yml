name: Summarize Miki public pool audit

on:
  push:
    branches:
      - chore/remove-miki-public-pool
    paths:
      - .summarize-miki-public-pool-audit-trigger

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/summarize_miki_public_pool_audit.py
      - name: Commit compact audit summary
        run: |
          set -euo pipefail
          rm -f .summarize-miki-public-pool-audit-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASK_LOGS/2026-08-03-0210-miki-public-pool-cleanup-audit-summary.md .summarize-miki-public-pool-audit-trigger
          git commit -m "docs: summarize Miki public pool ownership audit"
          git push origin HEAD:chore/remove-miki-public-pool
