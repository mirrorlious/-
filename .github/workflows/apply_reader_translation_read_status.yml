name: Apply translation alignment and reading status

on:
  push:
    branches:
      - feat/reader-annotations-v2
    paths:
      - TASK_LOGS/.trigger-translation-read-status

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Restore patch script
        shell: bash
        run: |
          cat > /tmp/reader_patch.b64 <<'B64'
          
          B64
          base64 -d /tmp/reader_patch.b64 | gzip -d > /tmp/patch_reader.py
          python -m py_compile /tmp/patch_reader.py

      - name: Apply reader patch
        run: python /tmp/patch_reader.py

      - name: Validate source markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Translation protocol v2',
              'generateStructuredFullTranslation',
              'reader-translation-link-active',
              'data-reader-full-translation-index',
              'setRecordCompleted',
              'clearDataConfirmStage',
              '确认清空所选数据',
              '✓ 已读完'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          forbidden = [
              "translatedChunks.filter(Boolean).join('\\n\\n')",
              "translated.filter(Boolean).join('\\n\\n').split"
          ]
          present = [marker for marker in forbidden if marker in text]
          if present:
              raise SystemExit(f'Fragile translation code remains: {present}')
          print('Marker validation passed')
          PY
          git diff --check

      - name: Parse JSX with Babel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="text/babel" data-type="module">([\s\S]*?)</script>', source)
          if not match:
              raise SystemExit('Reader Babel script not found')
          Path('/tmp/reader.jsx').write_text(match.group(1), encoding='utf-8')
          PY
          npx --yes --package @babel/core --package @babel/cli --package @babel/preset-react babel /tmp/reader.jsx --presets @babel/preset-react --out-file /tmp/reader.js

      - name: Write task log and commit
        shell: bash
        run: |
          cat > TASK_LOGS/2026-07-28-translation-alignment-reading-status.md <<'LOG'
          # 全文翻译对齐、选区联动与阅读完成状态

          ## 本轮完成

          - 全文翻译改用固定段落 ID 与句子 ID 的 JSON 协议，不再依靠空行数量对齐。
          - 正常情况下保持原批量请求方式，仅在模型漏回编号时补译对应段落。
          - 英文选区可定位对应中文句子；新协议结果按句高亮，旧缓存降级为整段高亮。
          - 阅读工具栏加入“完成阅读”图标，阅读库支持标记、取消标记与“已读完”徽章。
          - 清理阅读数据改为两阶段确认，可分别清理已读标记、阅读记录、翻译与解析、AI/TTS/PDF/书籍/批量任务缓存。
          - Markdown 数据包保留阅读完成状态，旧字符串译文继续兼容。

          ## 验证

          - `git diff --check`
          - Babel JSX 解析
          - 结构化翻译、联动高亮、阅读状态和二次清理窗口源码标记检查
          LOG
          rm -f .github/workflows/apply_reader_translation_read_status.yml TASK_LOGS/.trigger-translation-read-status
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html TASK_LOGS/2026-07-28-translation-alignment-reading-status.md .github/workflows/apply_reader_translation_read_status.yml TASK_LOGS/.trigger-translation-read-status
          git commit -m "feat: align translations and track reading completion"
          git push origin HEAD:feat/reader-annotations-v2
