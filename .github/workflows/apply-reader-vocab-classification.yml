name: Apply reader vocabulary classification

on:
  push:
    branches:
      - feat/reader-annotations-v2
    paths:
      - .github/workflows/apply-reader-vocab-classification.yml

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Copy vocabulary packs from main
        shell: bash
        run: |
          git fetch origin main
          target='public-resources/kaoyan-english-2027-vocabulary'
          mkdir -p "$target"
          git show 'origin/main:public-resources/kaoyan-english-2027-vocabulary/考研英语红宝书词汇27新版【基础词】qy自制.json' > "$target/考研英语红宝书词汇27新版【基础词】qy自制.json"
          git show 'origin/main:public-resources/kaoyan-english-2027-vocabulary/考研英语红宝书词汇27新版【必考词】qy自制.json' > "$target/考研英语红宝书词汇27新版【必考词】qy自制.json"
          git show 'origin/main:public-resources/kaoyan-english-2027-vocabulary/考研英语红宝书词汇27新版【超纲词】qy自制.json' > "$target/考研英语红宝书词汇27新版【超纲词】qy自制.json"

      - name: Patch reader vocabulary logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          old_urls = '''        const PRESET_DICT_URL = "https://gist.githubusercontent.com/mirrorlious97/e39459d2885f9eb78257d4524e18df6f/raw/560c12500d61289af3a6f22d7e41e421fed4cdf3/console=v.%2520%25E5%25AE%2589%25E6%2585%25B0%2520n.%2520%25E6%258E%25A7%25E5%2588%25B6%25E5%258F%25B0.txt";
          const HARD_DICT_URL = "https://gist.githubusercontent.com/mirrorlious97/9e36522b809b300f316fc5899bbb448f/raw/d685d0efe96e29603df00657ddd71b404f1baac4/%25E7%2594%259F%25E8%25AF%258D";
          '''
          new_urls = '''        const VOCAB_RESOURCE_BASE = "./public-resources/kaoyan-english-2027-vocabulary";
          const BASIC_DICT_URL = `${VOCAB_RESOURCE_BASE}/考研英语红宝书词汇27新版【基础词】qy自制.json`;
          const REQUIRED_DICT_URL = `${VOCAB_RESOURCE_BASE}/考研英语红宝书词汇27新版【必考词】qy自制.json`;
          const EXTRA_DICT_URL = `${VOCAB_RESOURCE_BASE}/考研英语红宝书词汇27新版【超纲词】qy自制.json`;

          // 历史词库仅保留来源记录，不再参与“基础词 / 必考词 / 超纲词”分级。
          const LEGACY_PRESET_DICT_GIST_URL = "https://gist.github.com/mirrorlious97/e39459d2885f9eb78257d4524e18df6f";
          const LEGACY_HARD_DICT_GIST_URL = "https://gist.github.com/mirrorlious97/9e36522b809b300f316fc5899bbb448f";
          '''
          text = replace_once(text, old_urls, new_urls, 'vocabulary URL block')

          parser_marker = '''        const fetchAndParseCorpus = async (setCorpusCount) => {'''
          pack_parser = '''        const parseVocabularyPack = (items) => {
              const dict = {};
              if (!Array.isArray(items)) return dict;

              items.forEach(item => {
                  const words = Array.isArray(item?.en) ? item.en : [];
                  words.forEach(rawWord => {
                      const key = String(rawWord || '').trim().toLowerCase();
                      if (!key) return;
                      dict[key] = {
                          translation: String(item?.zh || '').trim(),
                          category: String(item?.category || '').trim(),
                          memo: String(item?.memo || '').trim()
                      };
                  });
              });
              return dict;
          };

          const fetchVocabularyPack = async (url) => {
              const response = await fetch(url);
              if (!response.ok) throw new Error(`Failed to fetch vocabulary pack: ${response.status}`);
              return parseVocabularyPack(await response.json());
          };

          '''
          if pack_parser.strip() not in text:
              text = replace_once(text, parser_marker, pack_parser + parser_marker, 'vocabulary pack parser insertion')

          old_check = '''                const check = (word) => data[word] ? { translation: data[word], type, word } : null;'''
          new_check = '''                const check = (word) => {
                    const entry = data[word];
                    if (!entry) return null;
                    if (typeof entry === 'string') return { translation: entry, type, word };
                    return {
                        translation: entry.translation || entry.zh || '',
                        category: entry.category || '',
                        memo: entry.memo || '',
                        note: entry.memo || '',
                        type,
                        word
                    };
                };'''
          text = replace_once(text, old_check, new_check, 'lemma dictionary entry parser')

          highlighter_start = text.index('        const WordHighlighter = ({ text, activeDicts, highlightMode, onWordClick }) => {')
          highlighter_end = text.index('        const SingleQuizPractice = ({ quizData }) => {', highlighter_start)
          helpers_and_highlighter = '''        const VOCAB_TYPE_META = {
              basic: {
                  label: '基础词',
                  underline: 'decoration-green-600 dark:decoration-green-400',
                  badge: 'bg-green-600 dark:bg-green-700',
                  text: 'text-green-700 dark:text-green-400'
              },
              required: {
                  label: '必考词',
                  underline: 'decoration-sky-600 dark:decoration-sky-400',
                  badge: 'bg-sky-600 dark:bg-sky-700',
                  text: 'text-sky-700 dark:text-sky-300'
              },
              extra: {
                  label: '超纲词',
                  underline: 'decoration-red-600 dark:decoration-red-400',
                  badge: 'bg-red-600 dark:bg-red-700',
                  text: 'text-red-700 dark:text-red-400'
              },
              custom: {
                  label: '个人词库',
                  underline: 'decoration-amber-500 dark:decoration-amber-400 decoration-dotted',
                  badge: 'bg-amber-600 dark:bg-amber-700',
                  text: 'text-amber-700 dark:text-amber-400'
              },
              phrase: {
                  label: '语法与佳句',
                  underline: 'decoration-violet-500 dark:decoration-violet-400 decoration-dashed',
                  badge: 'bg-violet-600 dark:bg-violet-700',
                  text: 'text-violet-700 dark:text-violet-300'
              }
          };

          const shouldShowVocabType = (type, highlightMode) => {
              if (highlightMode === 'none') return false;
              if (highlightMode === 'all') return true;
              if (highlightMode === 'exam') return type === 'required' || type === 'extra';
              return highlightMode === type;
          };

          const WordHighlighter = ({ text, activeDicts, highlightMode, onWordClick }) => {
              const parts = text.split(/([a-zA-Z]+-?[a-zA-Z]*)/g);
              return (
                  <Fragment>
                      {parts.map((part, index) => {
                          const match = getLemmaMatches(part, activeDicts);
                          if (match && part.trim().length > 0 && shouldShowVocabType(match.type, highlightMode)) {
                              const { translation, type, word: lemma, category, memo } = match;
                              const meta = VOCAB_TYPE_META[type] || VOCAB_TYPE_META.custom;
                              return (
                                  <span
                                      key={index}
                                      onClick={(event) => {
                                          event.stopPropagation();
                                          onWordClick({ word: part, lemma, translation, type, category, memo, note: memo });
                                      }}
                                      className={`mx-[1px] cursor-pointer underline decoration-2 underline-offset-[3px] decoration-skip-ink-auto transition-[text-decoration-thickness,opacity] hover:decoration-[3px] hover:opacity-80 ${meta.underline}`}
                                  >
                                      {part}
                                  </span>
                              );
                          }
                          return <span key={index} className="transition-all">{part}</span>;
                      })}
                  </Fragment>
              );
          };

          '''
          text = text[:highlighter_start] + helpers_and_highlighter + text[highlighter_end:]

          old_phrase_lookup = '''                        for (const dict of activeDicts) {
                              if (dict.data && dict.data[lowerChunk]) {
                                  phraseData = { trans: dict.data[lowerChunk], type: dict.type };
                                  break;
                              }
                          }'''
          new_phrase_lookup = '''                        for (const dict of activeDicts) {
                              const entry = dict.data?.[lowerChunk];
                              if (entry) {
                                  phraseData = typeof entry === 'string'
                                      ? { trans: entry, type: dict.type }
                                      : {
                                          trans: entry.translation || entry.zh || '',
                                          note: entry.memo || '',
                                          category: entry.category || '',
                                          type: dict.type
                                      };
                                  break;
                              }
                          }'''
          text = replace_once(text, old_phrase_lookup, new_phrase_lookup, 'phrase dictionary lookup')

          phrase_pattern = re.compile(r'''                    if \(phraseData && lowerChunk\.includes\(' '\) && highlightMode !== 'none'\) \{.*?                    \}\n                    return <WordHighlighter''', re.S)
          phrase_replacement = '''                    if (phraseData && lowerChunk.includes(' ')) {
                          const phraseType = phraseData.type || 'phrase';
                          if (!shouldShowVocabType(phraseType, highlightMode)) return <span key={index}>{chunk}</span>;

                          const isActive = activeNote && activeNote.word === chunk && activeNote.isPhrase;
                          const meta = VOCAB_TYPE_META[phraseType] || VOCAB_TYPE_META.phrase;
                          return (
                              <span
                                  key={index}
                                  onClick={(event) => {
                                      event.stopPropagation();
                                      setActiveNote({
                                          word: chunk,
                                          isPhrase: true,
                                          trans: phraseData.trans || phraseData.translation,
                                          note: phraseData.note,
                                          category: phraseData.category,
                                          type: phraseType
                                      });
                                  }}
                                  className={`cursor-pointer mx-0.5 underline decoration-2 underline-offset-[3px] decoration-skip-ink-auto transition-[text-decoration-thickness,opacity] hover:decoration-[3px] hover:opacity-80 ${meta.underline} ${isActive ? 'decoration-[3px]' : ''}`}
                              >
                                  {chunk}
                              </span>
                          );
                      }
                      return <WordHighlighter'''
          text, phrase_count = phrase_pattern.subn(phrase_replacement, text, count=1)
          if phrase_count != 1:
              raise SystemExit(f'phrase highlighter block: expected one match, found {phrase_count}')

          old_note_badges = '''                                <span className={`text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm tracking-wider ${activeNote.type === 'hard' ? 'bg-red-600 dark:bg-red-700' : 'bg-sky-600 dark:bg-sky-700'}`}>{activeNote.isPhrase ? "语法与佳句" : (activeNote.type === 'hard' ? "考研生词" : "词库匹配")}</span>
                                  <span className={`font-serif font-bold text-[15px] ${activeNote.type === 'hard' ? 'text-red-800 dark:text-red-400' : 'text-[#004b87] dark:text-sky-300'}`}>{activeNote.word}</span>'''
          new_note_badges = '''                                <span className={`text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm tracking-wider ${(VOCAB_TYPE_META[activeNote.type] || VOCAB_TYPE_META.custom).badge}`}>{activeNote.isPhrase ? "语法与佳句" : (VOCAB_TYPE_META[activeNote.type] || VOCAB_TYPE_META.custom).label}</span>
                                  <span className={`font-serif font-bold text-[15px] ${(VOCAB_TYPE_META[activeNote.type] || VOCAB_TYPE_META.custom).text}`}>{activeNote.word}</span>'''
          text = replace_once(text, old_note_badges, new_note_badges, 'active word card labels')

          translation_line = '''                            <div className="text-[13px] font-semibold text-gray-800 dark:text-gray-200 mb-2 whitespace-pre-wrap">{activeNote.translation || activeNote.trans}</div>'''
          translation_with_category = translation_line + '''
                              {activeNote.category && <div className="mb-2 text-[11px] text-gray-500 dark:text-gray-400">{activeNote.category}</div>}'''
          text = replace_once(text, translation_line, translation_with_category, 'active word category')

          text = replace_once(
              text,
              "            const [highlightMode, setHighlightMode] = useState('red');",
              "            const [highlightMode, setHighlightMode] = useState('exam');",
              'default highlight mode'
          )

          old_dict_states = '''            const [presetDict, setPresetDict] = useState({});
              const [hardDict, setHardDict] = useState({});'''
          new_dict_states = '''            const [basicDict, setBasicDict] = useState({});
              const [requiredDict, setRequiredDict] = useState({});
              const [extraDict, setExtraDict] = useState({});'''
          text = replace_once(text, old_dict_states, new_dict_states, 'dictionary state block')

          old_active_dicts = '''            const activeDicts = useMemo(() => [
                  { data: hardDict, type: 'hard' },
                  { data: customDict, type: 'custom' },
                  { data: presetDict, type: 'preset' },
                  { data: VOCAB_DB.kaoyan, type: 'default' },
                  { data: VOCAB_DB.cet6, type: 'default' }
              ], [hardDict, customDict, presetDict]);'''
          new_active_dicts = '''            const activeDicts = useMemo(() => [
                  { data: extraDict, type: 'extra' },
                  { data: requiredDict, type: 'required' },
                  { data: basicDict, type: 'basic' },
                  { data: customDict, type: 'custom' }
              ], [extraDict, requiredDict, basicDict, customDict]);'''
          text = replace_once(text, old_active_dicts, new_active_dicts, 'active dictionary priority')

          old_loader = '''            useEffect(() => {
                  fetchAndParseCorpus(setCorpusCount);
                  fetch(PRESET_DICT_URL).then(r=>r.text()).then(t=>setPresetDict(parseDictText(t))).catch(console.error);
                  fetch(HARD_DICT_URL).then(r=>r.text()).then(t=>setHardDict(parseDictText(t))).catch(console.error);
              }, []);'''
          new_loader = '''            useEffect(() => {
                  fetchAndParseCorpus(setCorpusCount);
                  Promise.all([
                      fetchVocabularyPack(BASIC_DICT_URL),
                      fetchVocabularyPack(REQUIRED_DICT_URL),
                      fetchVocabularyPack(EXTRA_DICT_URL)
                  ]).then(([basic, required, extra]) => {
                      setBasicDict(basic);
                      setRequiredDict(required);
                      setExtraDict(extra);
                  }).catch(error => {
                      console.error('Error loading classified vocabulary packs:', error);
                      window.showToast('分级词库加载失败，请刷新后重试', 'error');
                  });
              }, []);'''
          text = replace_once(text, old_loader, new_loader, 'classified vocabulary loader')

          old_options = '''                                                <option value="red">考研生词</option>
                                                  <option value="both">全部词汇</option>
                                                  <option value="blue">基础词汇</option>
                                                  <option value="none">关闭高亮</option>'''
          new_options = '''                                                <option value="exam">必考＋超纲</option>
                                                  <option value="all">全部词汇</option>
                                                  <option value="basic">基础词</option>
                                                  <option value="required">必考词</option>
                                                  <option value="extra">超纲词</option>
                                                  <option value="none">关闭标注</option>'''
          text = replace_once(text, old_options, new_options, 'highlight filter options')

          if 'bg-red-100/80 dark:bg-red-900/40' in text or 'bg-sky-100/80 dark:bg-sky-900/40' in text:
              raise SystemExit('legacy vocabulary background classes still remain')
          if "type === 'hard'" in text or "type: 'hard'" in text:
              raise SystemExit('legacy hard vocabulary type still remains')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate updated reader
        shell: bash
        run: |
          python -m json.tool 'public-resources/kaoyan-english-2027-vocabulary/考研英语红宝书词汇27新版【基础词】qy自制.json' > /dev/null
          python -m json.tool 'public-resources/kaoyan-english-2027-vocabulary/考研英语红宝书词汇27新版【必考词】qy自制.json' > /dev/null
          python -m json.tool 'public-resources/kaoyan-english-2027-vocabulary/考研英语红宝书词汇27新版【超纲词】qy自制.json' > /dev/null
          grep -q "const BASIC_DICT_URL" index.html
          grep -q "const REQUIRED_DICT_URL" index.html
          grep -q "const EXTRA_DICT_URL" index.html
          grep -q "decoration-green-600" index.html
          grep -q "decoration-sky-600" index.html
          grep -q "decoration-red-600" index.html
          grep -q '<option value="exam">必考＋超纲</option>' index.html
          grep -q 'LEGACY_PRESET_DICT_GIST_URL' index.html
          grep -q 'LEGACY_HARD_DICT_GIST_URL' index.html
          test "$(grep -o "bg-red-100/80" index.html | wc -l)" -eq 0
          test "$(grep -o "bg-sky-100/80" index.html | wc -l)" -eq 0
          git diff --check

      - name: Commit feature branch
        shell: bash
        run: |
          rm -f .github/workflows/apply-reader-vocab-classification.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: classify vocabulary with underline-only markers'
          git push origin HEAD:feat/reader-annotations-v2
