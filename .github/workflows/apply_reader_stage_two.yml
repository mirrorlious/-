name: Apply reader stage two

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  patch-reader-stage-two:
    if: contains(github.event.head_commit.message, '[run-stage-two]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply editable mind-map and book import review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise RuntimeError(f'Anchor not found: {label}')
              text = text.replace(old, new, 1)

          # IndexedDB: add a durable store for large OCR/book review drafts.
          replace_once(
              "const READER_DB_VERSION = 1;",
              "const READER_DB_VERSION = 2;",
              "reader db version"
          )
          replace_once(
              "if (!db.objectStoreNames.contains('pdf-tasks')) db.createObjectStore('pdf-tasks', { keyPath: 'key' });",
              "if (!db.objectStoreNames.contains('pdf-tasks')) db.createObjectStore('pdf-tasks', { keyPath: 'key' });\n                if (!db.objectStoreNames.contains('book-imports')) db.createObjectStore('book-imports', { keyPath: 'key' });",
              "book imports object store"
          )

          # Ask OCR to preserve article boundaries and ignore obvious front matter/noise.
          replace_once(
              'const prompt = "Extract English text accurately. CRITICAL: Fix physical line breaks mid-sentence so paragraphs are continuous. Separate different paragraphs with double newlines strictly. Output ONLY the English text.";',
              'const prompt = "Extract English text accurately. Preserve article titles and paragraph boundaries. Ignore decorative cover text, running headers, page numbers, image-only captions, copyright boilerplate and table-of-contents lines. When a clearly new article begins, output [[ARTICLE_BREAK]] on its own line, followed by [[TITLE: detected title]] on its own line. Fix physical line breaks inside sentences, but keep true paragraph breaks. Output ONLY the cleaned English text and markers.";',
              "ocr structured prompt"
          )
          replace_once(
              "return text.replace(/(?<!\\n)\\n(?!\\n)/g, ' ');",
              "return text.replace(/\\r/g, '').replace(/\\n{3,}/g, '\\n\\n').trim();",
              "openai ocr line preservation"
          )
          replace_once(
              "return getCandidateText(result).replace(/(?<!\\n)\\n(?!\\n)/g, ' ');",
              "return getCandidateText(result).replace(/\\r/g, '').replace(/\\n{3,}/g, '\\n\\n').trim();",
              "gemini ocr line preservation"
          )

          helper_anchor = """        const splitTextIntoChunks = (text, maxChars = 12000) => {
              const normalized = String(text || '').trim();
              if (!normalized) return [];
              const chunks = [];
              let remaining = normalized;
              while (remaining.length > maxChars) {
                  const boundary = Math.max(remaining.lastIndexOf('\\n\\n', maxChars), remaining.lastIndexOf('. ', maxChars));
                  const cutAt = boundary > maxChars * 0.55 ? boundary + (remaining[boundary] === '.' ? 1 : 0) : remaining.lastIndexOf(' ', maxChars);
                  const safeCut = cutAt > 0 ? cutAt : maxChars;
                  chunks.push(remaining.slice(0, safeCut).trim());
                  remaining = remaining.slice(safeCut).trim();
              }
              if (remaining) chunks.push(remaining);
              return chunks;
          };
"""
          helper_insert = helper_anchor + r'''

        const cloneJson = (value) => JSON.parse(JSON.stringify(value));

        const getMindMapPathIndexes = (nodePath = 'root') => String(nodePath)
            .split('.')
            .slice(1)
            .map(value => Number(value))
            .filter(Number.isInteger);

        const updateMindMapNodeAtPath = (root, nodePath, updater) => {
            if (!root) return root;
            const indexes = getMindMapPathIndexes(nodePath);
            const nextRoot = cloneJson(root);
            let cursor = nextRoot;
            for (const index of indexes) {
                if (!Array.isArray(cursor.children) || !cursor.children[index]) return nextRoot;
                cursor = cursor.children[index];
            }
            const replacement = typeof updater === 'function' ? updater(cursor) : updater;
            Object.keys(cursor).forEach(key => delete cursor[key]);
            Object.assign(cursor, replacement);
            return nextRoot;
        };

        const addMindMapChildAtPath = (root, nodePath) => updateMindMapNodeAtPath(root, nodePath, node => ({
            ...node,
            children: [
                ...(Array.isArray(node.children) ? node.children : []),
                { nameEn: 'New branch', nameZh: '新分支', children: [] }
            ]
        }));

        const deleteMindMapNodeAtPath = (root, nodePath) => {
            const indexes = getMindMapPathIndexes(nodePath);
            if (!root || indexes.length === 0) return root;
            const nextRoot = cloneJson(root);
            const targetIndex = indexes.pop();
            let parent = nextRoot;
            for (const index of indexes) {
                if (!Array.isArray(parent.children) || !parent.children[index]) return nextRoot;
                parent = parent.children[index];
            }
            if (Array.isArray(parent.children)) parent.children.splice(targetIndex, 1);
            return nextRoot;
        };

        const normalizeImportParagraph = value => String(value || '')
            .replace(/\s+/g, ' ')
            .replace(/\s+([,.;:!?])/g, '$1')
            .trim();

        const isLikelyImportNoise = paragraph => {
            const value = normalizeImportParagraph(paragraph);
            if (!value) return true;
            if (/^(?:contents|table of contents|copyright|all rights reserved|isbn|issn|cover|advertisement|advertising|image|photo|illustration)\b/i.test(value)) return true;
            if (/\.{3,}\s*\d{1,4}$/.test(value)) return true;
            if (/^(?:page\s*)?\d{1,4}$/i.test(value)) return true;
            if (/^(?:www\.|https?:\/\/|©)/i.test(value) && value.split(/\s+/).length < 12) return true;
            return false;
        };

        const isLikelyArticleTitle = paragraph => {
            const value = normalizeImportParagraph(paragraph);
            const words = value.split(/\s+/).filter(Boolean);
            if (words.length < 2 || words.length > 18 || value.length > 150) return false;
            if (/[.!?;:]$/.test(value)) return false;
            const capitalized = words.filter(word => /^[A-Z“"']/.test(word)).length;
            const letters = value.replace(/[^A-Za-z]/g, '');
            const allCaps = letters.length > 3 && letters === letters.toUpperCase();
            return allCaps || capitalized >= Math.max(2, Math.ceil(words.length * 0.45));
        };

        const buildImportArticle = (title, paragraphs, index, sourceName) => {
            const body = paragraphs.map(normalizeImportParagraph).filter(Boolean).join('\n\n').trim();
            const fallback = normalizeImportParagraph(paragraphs[0] || '').split(/\s+/).slice(0, 10).join(' ');
            return {
                id: `import-article-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 7)}`,
                title: normalizeImportParagraph(title) || fallback || `Article ${index + 1}`,
                text: body,
                sourceName,
                selected: true,
                wordCount: body ? body.split(/\s+/).filter(Boolean).length : 0
            };
        };

        const segmentImportedText = (rawText, sourceName = 'Imported document') => {
            const normalized = String(rawText || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();
            const ignored = [];
            const articles = [];

            const markerSections = normalized.split(/\[\[ARTICLE_BREAK\]\]/i).map(section => section.trim()).filter(Boolean);
            if (markerSections.length > 1 || /\[\[TITLE:/i.test(normalized)) {
                markerSections.forEach((section, index) => {
                    const titleMatch = section.match(/\[\[TITLE:\s*([^\]]+)\]\]/i);
                    const title = titleMatch?.[1]?.trim() || '';
                    const cleaned = section.replace(/\[\[TITLE:\s*[^\]]+\]\]/ig, '').trim();
                    const paragraphs = cleaned.split(/\n{2,}/).map(normalizeImportParagraph).filter(Boolean).filter(paragraph => {
                        const noise = isLikelyImportNoise(paragraph);
                        if (noise) ignored.push(paragraph);
                        return !noise;
                    });
                    const article = buildImportArticle(title, paragraphs, index, sourceName);
                    if (article.wordCount >= 40) articles.push(article);
                });
            }

            if (articles.length === 0) {
                const paragraphs = normalized
                    .replace(/\[\[(?:ARTICLE_BREAK|TITLE:[^\]]+)\]\]/ig, '\n\n')
                    .split(/\n{2,}/)
                    .map(normalizeImportParagraph)
                    .filter(Boolean)
                    .filter(paragraph => {
                        const noise = isLikelyImportNoise(paragraph);
                        if (noise) ignored.push(paragraph);
                        return !noise;
                    });

                let title = '';
                let body = [];
                let bodyWords = 0;
                const flush = () => {
                    if (!body.length) return;
                    const article = buildImportArticle(title, body, articles.length, sourceName);
                    if (article.wordCount >= 40) articles.push(article);
                    body = [];
                    bodyWords = 0;
                    title = '';
                };

                paragraphs.forEach((paragraph, index) => {
                    const next = paragraphs[index + 1] || '';
                    const nextWords = next.split(/\s+/).filter(Boolean).length;
                    if (isLikelyArticleTitle(paragraph) && nextWords >= 20 && bodyWords >= 120) flush();
                    if (!body.length && isLikelyArticleTitle(paragraph) && nextWords >= 20) {
                        title = paragraph;
                        return;
                    }
                    body.push(paragraph);
                    bodyWords += paragraph.split(/\s+/).filter(Boolean).length;
                    if (bodyWords >= 2200) flush();
                });
                flush();
            }

            if (articles.length === 0 && normalized) {
                const chunks = splitTextIntoChunks(normalized, 11000);
                chunks.forEach((chunk, index) => {
                    const article = buildImportArticle('', [chunk], index, sourceName);
                    if (article.wordCount >= 20) articles.push(article);
                });
            }

            return {
                id: `book-import-${Date.now()}`,
                sourceName,
                createdAt: Date.now(),
                ignoredCount: ignored.length,
                articles,
                selectedCount: articles.filter(article => article.selected).length
            };
        };
'''
          replace_once(helper_anchor, helper_insert, "stage two helper functions")

          # Editable tree component.
          replace_once(
              "const LogicTreeNode = ({ node, isRoot = false, displayMode, nodePath = 'root', collapsedNodes, onToggle }) => {",
              "const LogicTreeNode = ({ node, isRoot = false, displayMode, nodePath = 'root', collapsedNodes, onToggle, editable = false, onUpdateNode, onAddChild, onDeleteNode }) => {",
              "logic tree editable signature"
          )
          replace_once(
              """                const renderText = () => {
                  const mainColor = isRoot ? 'text-white' : 'text-gray-800 dark:text-gray-100';
                  const subColor = isRoot ? 'text-gray-300' : 'text-gray-500 dark:text-gray-400';
                  if (displayMode === 'en') return <span className={`font-serif text-[14px] leading-snug ${mainColor}`}>{node.nameEn}</span>;
                  if (displayMode === 'zh') return <span className={`text-[13.5px] leading-snug ${mainColor}`}>{node.nameZh}</span>;
                  return (
                      <div className="min-w-0">
                          <div className={`font-serif font-semibold text-[13.5px] leading-snug break-words ${mainColor}`}>{node.nameEn}</div>
                          <div className={`mt-1 text-[11.5px] leading-snug break-words ${subColor}`}>{node.nameZh}</div>
                      </div>
                  );
              };
""",
              """                const renderText = () => {
                  const mainColor = isRoot ? 'text-white' : 'text-gray-800 dark:text-gray-100';
                  const subColor = isRoot ? 'text-gray-300' : 'text-gray-500 dark:text-gray-400';
                  if (editable) {
                      return (
                          <div className="grid gap-2">
                              <input value={node.nameEn || ''} onChange={(event) => onUpdateNode?.(nodePath, { nameEn: event.target.value })} onClick={(event) => event.stopPropagation()} className="w-full px-2 py-1.5 text-[13px] bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 border border-blue-200 dark:border-blue-800 outline-none focus:border-blue-500" placeholder="English title" />
                              <input value={node.nameZh || ''} onChange={(event) => onUpdateNode?.(nodePath, { nameZh: event.target.value })} onClick={(event) => event.stopPropagation()} className="w-full px-2 py-1.5 text-[12px] bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 outline-none focus:border-blue-500" placeholder="中文标题" />
                          </div>
                      );
                  }
                  if (displayMode === 'en') return <span className={`font-serif text-[14px] leading-snug ${mainColor}`}>{node.nameEn}</span>;
                  if (displayMode === 'zh') return <span className={`text-[13.5px] leading-snug ${mainColor}`}>{node.nameZh}</span>;
                  return (
                      <div className="min-w-0">
                          <div className={`font-serif font-semibold text-[13.5px] leading-snug break-words ${mainColor}`}>{node.nameEn}</div>
                          <div className={`mt-1 text-[11.5px] leading-snug break-words ${subColor}`}>{node.nameZh}</div>
                      </div>
                  );
              };
""",
              "logic tree editable fields"
          )
          replace_once(
              """                        {hasChildren && (
                            <div className={`shrink-0 self-center mr-3 px-1.5 py-0.5 text-[10px] font-medium border ${isRoot ? 'border-gray-700 text-gray-300' : 'border-gray-200 dark:border-gray-600 text-gray-400'}`}>
                                {node.children.length}
                            </div>
                        )}
""",
              """                        {editable && (
                            <div className="shrink-0 self-center mr-2 flex flex-col sm:flex-row gap-1">
                                <button type="button" onClick={(event) => { event.stopPropagation(); onAddChild?.(nodePath); }} className="min-h-[30px] px-2 text-[11px] text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 hover:bg-blue-100 dark:hover:bg-blue-900/40">+ 子节点</button>
                                {!isRoot && <button type="button" onClick={(event) => { event.stopPropagation(); if (window.confirm('删除该节点及其子节点？')) onDeleteNode?.(nodePath); }} className="min-h-[30px] px-2 text-[11px] text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/15 border border-red-200 dark:border-red-900 hover:bg-red-100 dark:hover:bg-red-900/30">删除</button>}
                            </div>
                        )}
                        {hasChildren && !editable && (
                            <div className={`shrink-0 self-center mr-3 px-1.5 py-0.5 text-[10px] font-medium border ${isRoot ? 'border-gray-700 text-gray-300' : 'border-gray-200 dark:border-gray-600 text-gray-400'}`}>
                                {node.children.length}
                            </div>
                        )}
""",
              "logic tree edit controls"
          )
          replace_once(
              """                                        collapsedNodes={collapsedNodes}
                                        onToggle={onToggle}
                                    />
""",
              """                                        collapsedNodes={collapsedNodes}
                                        onToggle={onToggle}
                                        editable={editable}
                                        onUpdateNode={onUpdateNode}
                                        onAddChild={onAddChild}
                                        onDeleteNode={onDeleteNode}
                                    />
""",
              "logic tree recursive editable props"
          )

          # App state for mind-map editor and import review.
          replace_once(
              """            const [isMapModalOpen, setIsMapModalOpen] = useState(false);
            const [mapScale, setMapScale] = useState(1);
            const [collapsedMapNodes, setCollapsedMapNodes] = useState(() => new Set());
""",
              """            const [isMapModalOpen, setIsMapModalOpen] = useState(false);
            const [mapScale, setMapScale] = useState(1);
            const [collapsedMapNodes, setCollapsedMapNodes] = useState(() => new Set());
            const [isMapEditing, setIsMapEditing] = useState(false);
            const [mapDraftData, setMapDraftData] = useState(null);
""",
              "map editing state"
          )
          replace_once(
              """            const [isPdfChoiceOpen, setIsPdfChoiceOpen] = useState(false);
            const [pdfExtractionProgress, setPdfExtractionProgress] = useState({ current: 0, total: 0 });
""",
              """            const [isPdfChoiceOpen, setIsPdfChoiceOpen] = useState(false);
            const [pdfExtractionProgress, setPdfExtractionProgress] = useState({ current: 0, total: 0 });
            const [importReview, setImportReview] = useState(null);
""",
              "import review state"
          )

          # Restore the latest large import draft from IndexedDB.
          replace_once(
              """            useEffect(() => {
                const handleFullscreenChange = () => setIsBrowserFullscreen(Boolean(document.fullscreenElement));
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);
""",
              """            useEffect(() => {
                const handleFullscreenChange = () => setIsBrowserFullscreen(Boolean(document.fullscreenElement));
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            useEffect(() => {
                let cancelled = false;
                readReaderStore('book-imports', 'latest').then(record => {
                    if (!cancelled && record?.review?.articles?.length) setImportReview(record.review);
                });
                return () => { cancelled = true; };
            }, []);
""",
              "restore import review"
          )

          # Import-review and editable-map actions.
          action_anchor = """            const defaultText = `France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women. Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways. The parliament also agreed to ban websites that \"incite excessive thinness\" by promoting extreme dieting.`;
"""
          action_insert = r'''            const persistImportReview = async review => {
                setImportReview(review);
                await writeReaderStore('book-imports', { key: 'latest', review, updatedAt: Date.now() });
            };

            const prepareImportReview = async (text, sourceName) => {
                const review = segmentImportedText(text, sourceName);
                if (!review.articles.length) throw new Error('未识别出可阅读的文章，请检查原文件或改用手动粘贴。');
                await persistImportReview(review);
                setInputText('');
                setIsReadingMode(false);
                window.showToast(`已识别 ${review.articles.length} 篇文章，忽略 ${review.ignoredCount} 条目录或页面噪音`, 'success');
                window.requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
            };

            const updateImportReviewArticle = (articleId, patch) => {
                if (!importReview) return;
                const next = {
                    ...importReview,
                    articles: importReview.articles.map(article => article.id === articleId ? { ...article, ...patch } : article)
                };
                next.selectedCount = next.articles.filter(article => article.selected).length;
                persistImportReview(next);
            };

            const selectAllImportArticles = selected => {
                if (!importReview) return;
                const next = { ...importReview, articles: importReview.articles.map(article => ({ ...article, selected })) };
                next.selectedCount = selected ? next.articles.length : 0;
                persistImportReview(next);
            };

            const clearImportReview = async () => {
                setImportReview(null);
                await writeReaderStore('book-imports', { key: 'latest', review: null, updatedAt: Date.now() });
            };

            const openImportedArticle = article => {
                const finalContent = String(article?.text || '').trim();
                if (!finalContent) return;
                const newId = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
                const record = {
                    id: newId,
                    title: article.title,
                    sourceName: article.sourceName,
                    timestamp: new Date().toLocaleString('zh-CN'),
                    text: finalContent,
                    fullMapData: null,
                    fullTranslations: [],
                    createdAt: Date.now()
                };
                setInputText(finalContent);
                setCurrentHistoryId(newId);
                setIsReadingMode(true);
                setFullMapData(null);
                setCollapsedMapNodes(new Set());
                setFullTranslations([]);
                saveHistoryToCloud(record);
                window.requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'auto' }));
            };

            const saveSelectedImportArticles = () => {
                if (!importReview) return;
                const selected = importReview.articles.filter(article => article.selected && article.text.trim());
                if (!selected.length) {
                    window.showToast('请至少选择一篇文章', 'warning');
                    return;
                }
                selected.forEach((article, index) => {
                    const createdAt = Date.now() + index;
                    saveHistoryToCloud({
                        id: `imported-${createdAt}-${Math.random().toString(36).slice(2, 7)}`,
                        title: article.title,
                        sourceName: importReview.sourceName,
                        timestamp: new Date(createdAt).toLocaleString('zh-CN'),
                        text: article.text,
                        fullMapData: null,
                        fullTranslations: [],
                        createdAt
                    });
                });
                window.showToast(`已将 ${selected.length} 篇文章保存到阅读库`, 'success');
            };

            const startMapEditing = () => {
                if (!fullMapData?.mindmap) return;
                setMapDraftData(cloneJson(fullMapData));
                setIsMapEditing(true);
                expandAllMapNodes();
            };

            const updateMapDraftNode = (nodePath, patch) => {
                setMapDraftData(previous => previous ? {
                    ...previous,
                    mindmap: updateMindMapNodeAtPath(previous.mindmap, nodePath, node => ({ ...node, ...patch }))
                } : previous);
            };

            const addMapDraftChild = nodePath => {
                setMapDraftData(previous => previous ? { ...previous, mindmap: addMindMapChildAtPath(previous.mindmap, nodePath) } : previous);
                setCollapsedMapNodes(previous => {
                    const next = new Set(previous);
                    next.delete(nodePath);
                    return next;
                });
            };

            const deleteMapDraftNode = nodePath => {
                setMapDraftData(previous => previous ? { ...previous, mindmap: deleteMindMapNodeAtPath(previous.mindmap, nodePath) } : previous);
            };

            const saveMapDraft = () => {
                if (!mapDraftData?.mindmap) return;
                const nextData = cloneJson(mapDraftData);
                setFullMapData(nextData);
                setIsMapEditing(false);
                setMapDraftData(null);
                if (currentHistoryId) {
                    const recordToUpdate = history.find(item => item.id === currentHistoryId) || {
                        id: currentHistoryId,
                        timestamp: new Date().toLocaleString('zh-CN'),
                        text: inputText || defaultText,
                        fullTranslations,
                        createdAt: Date.now()
                    };
                    saveHistoryToCloud({ ...recordToUpdate, fullMapData: nextData });
                }
                window.showToast('结构树修改已保存', 'success');
            };

            const cancelMapDraft = () => {
                setIsMapEditing(false);
                setMapDraftData(null);
            };

''' + action_anchor
          replace_once(action_anchor, action_insert, "stage two app actions")

          # Route extracted books/images into the review stage instead of dumping everything into the textarea.
          replace_once(
              """                    setInputText(previous => previous ? `${previous}\n\n${extractedText}` : extractedText);
                    setPendingPdfFile(null);
""",
              """                    await prepareImportReview(extractedText, file.name);
                    setPendingPdfFile(null);
""",
              "pdf import review"
          )
          replace_once(
              """                    setInputText(prev => prev + (prev ? '\n\n' : '') + combinedText);
                    window.showToast("文件提取成功！请点击进入精读以保存记录", "success");
""",
              """                    const sourceName = files.length === 1 ? files[0].name : `${files.length} 个图片文件`;
                    await prepareImportReview(combinedText, sourceName);
""",
              "image ocr import review"
          )

          # Replace the home textarea with a structured review when a book import exists.
          home_old = """                                    <textarea className="w-full h-[48vh] min-h-[320px] p-4 bg-gray-50/60 dark:bg-gray-950/30 border border-gray-200 dark:border-gray-800 rounded-sm outline-none resize-none font-serif text-[15.5px] leading-relaxed text-gray-700 dark:text-gray-300 placeholder-gray-400 dark:placeholder-gray-600 focus:border-gray-500 dark:focus:border-gray-600" placeholder="粘贴英文文章..." value={inputText} onChange={(e) => setInputText(e.target.value)} />
                                    <div className="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3">
                                        <span className="text-[12px] text-gray-400 dark:text-gray-500">{inputText.trim() ? `${inputText.trim().split(/\\s+/).length} 词` : "尚未添加内容"}</span>
                                        <button onClick={handleStartReading} disabled={isExtracting || !inputText.trim()} className="w-full sm:w-auto min-h-[46px] bg-gray-900 dark:bg-blue-600 text-white px-8 rounded-sm font-medium text-[14px] hover:bg-gray-800 dark:hover:bg-blue-700 active:scale-[0.98] transition-transform disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100">进入精读</button>
                                    </div>
"""
          home_new = r'''                                    {importReview ? (
                                        <section className="border border-blue-100 dark:border-blue-900/50 bg-blue-50/25 dark:bg-blue-950/10 p-4 sm:p-5 space-y-4">
                                            <div className="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-3">
                                                <div>
                                                    <div className="text-[15px] font-semibold text-gray-900 dark:text-gray-100">识别结果：{importReview.sourceName}</div>
                                                    <div className="mt-1 text-[12px] text-gray-500 dark:text-gray-400">识别 {importReview.articles.length} 篇 · 已选 {importReview.selectedCount || 0} 篇 · 忽略 {importReview.ignoredCount || 0} 条目录、页码或封面噪音</div>
                                                    <div className="mt-1 text-[11px] text-blue-600 dark:text-blue-400">结果与选择状态自动暂存在当前浏览器，不会再次消耗 OCR Token。</div>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    <button onClick={() => selectAllImportArticles(true)} className="min-h-[36px] px-3 text-[12px] border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 bg-white dark:bg-gray-900 hover:bg-blue-50 dark:hover:bg-blue-900/20">全选</button>
                                                    <button onClick={() => selectAllImportArticles(false)} className="min-h-[36px] px-3 text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-900 hover:bg-gray-50 dark:hover:bg-gray-800">取消全选</button>
                                                    <button onClick={() => { if (window.confirm('清除当前识别结果？')) clearImportReview(); }} className="min-h-[36px] px-3 text-[12px] border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 bg-white dark:bg-gray-900 hover:bg-red-50 dark:hover:bg-red-900/20">清除结果</button>
                                                </div>
                                            </div>

                                            <div className="max-h-[56vh] overflow-y-auto custom-scrollbar space-y-3 pr-1">
                                                {importReview.articles.map((article, index) => (
                                                    <article key={article.id} className={`p-4 border bg-white dark:bg-gray-900 transition-colors ${article.selected ? 'border-blue-300 dark:border-blue-700' : 'border-gray-200 dark:border-gray-800 opacity-75'}`}>
                                                        <div className="flex items-start gap-3">
                                                            <input type="checkbox" checked={Boolean(article.selected)} onChange={event => updateImportReviewArticle(article.id, { selected: event.target.checked })} className="mt-2 w-4 h-4 accent-blue-600" aria-label={`选择第 ${index + 1} 篇文章`} />
                                                            <div className="min-w-0 flex-1">
                                                                <div className="flex flex-col sm:flex-row sm:items-center gap-2">
                                                                    <span className="text-[11px] text-gray-400 shrink-0">第 {index + 1} 篇</span>
                                                                    <input value={article.title} onChange={event => updateImportReviewArticle(article.id, { title: event.target.value })} className="min-w-0 flex-1 px-2 py-1.5 text-[14px] font-semibold bg-gray-50 dark:bg-gray-950/40 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-gray-100 outline-none focus:border-blue-400" />
                                                                    <span className="text-[11px] text-gray-400 shrink-0">{article.wordCount} 词</span>
                                                                </div>
                                                                <p className="mt-3 text-[13px] leading-relaxed text-gray-600 dark:text-gray-300 line-clamp-3">{article.text.slice(0, 420)}{article.text.length > 420 ? '…' : ''}</p>
                                                                <details className="mt-3">
                                                                    <summary className="cursor-pointer text-[12px] text-blue-600 dark:text-blue-400">展开全文预览</summary>
                                                                    <div className="mt-2 max-h-72 overflow-y-auto whitespace-pre-wrap bg-gray-50 dark:bg-gray-950/40 border border-gray-100 dark:border-gray-800 p-3 text-[12px] leading-relaxed text-gray-600 dark:text-gray-300 custom-scrollbar">{article.text}</div>
                                                                </details>
                                                                <div className="mt-3 flex justify-end">
                                                                    <button onClick={() => openImportedArticle(article)} className="min-h-[36px] px-4 text-[12px] font-medium text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 hover:bg-blue-100 dark:hover:bg-blue-900/40">精读本篇</button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </article>
                                                ))}
                                            </div>

                                            <div className="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3 pt-2 border-t border-blue-100 dark:border-blue-900/40">
                                                <span className="text-[11px] text-gray-400">可先保存到阅读库，稍后逐篇打开；不会把整本书一次性送入模型。</span>
                                                <button onClick={saveSelectedImportArticles} disabled={!importReview.selectedCount} className="min-h-[42px] px-5 text-[13px] font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed">保存选中到阅读库</button>
                                            </div>
                                        </section>
                                    ) : (
                                        <>
                                            <textarea className="w-full h-[48vh] min-h-[320px] p-4 bg-gray-50/60 dark:bg-gray-950/30 border border-gray-200 dark:border-gray-800 rounded-sm outline-none resize-none font-serif text-[15.5px] leading-relaxed text-gray-700 dark:text-gray-300 placeholder-gray-400 dark:placeholder-gray-600 focus:border-gray-500 dark:focus:border-gray-600" placeholder="粘贴英文文章..." value={inputText} onChange={(e) => setInputText(e.target.value)} />
                                            <div className="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3">
                                                <span className="text-[12px] text-gray-400 dark:text-gray-500">{inputText.trim() ? `${inputText.trim().split(/\s+/).length} 词` : "尚未添加内容"}</span>
                                                <button onClick={handleStartReading} disabled={isExtracting || !inputText.trim()} className="w-full sm:w-auto min-h-[46px] bg-blue-600 text-white px-8 rounded-sm font-medium text-[14px] hover:bg-blue-700 active:scale-[0.98] transition-transform disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100">进入精读</button>
                                            </div>
                                        </>
                                    )}
'''
          replace_once(home_old, home_new, "book import review ui")

          # Fullscreen editable tree toolbar and renderer.
          replace_once(
              """                                    <div className="ml-auto text-[12px] text-gray-400 hidden md:block">点击分支箭头单独展开或收起</div>
                                    <button onClick={() => setIsMapModalOpen(false)} className="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-sm text-[13px] font-medium hover:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform">退出全屏</button>
""",
              """                                    <div className="ml-auto text-[12px] text-gray-400 hidden md:block">{isMapEditing ? '可编辑中英文标题，并新增或删除节点' : '点击分支箭头单独展开或收起'}</div>
                                    {!isMapEditing ? (
                                        <button onClick={startMapEditing} className="px-4 py-2 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 rounded-sm text-[13px] font-medium hover:bg-blue-100 dark:hover:bg-blue-900/40">编辑结构</button>
                                    ) : (
                                        <div className="flex gap-2">
                                            <button onClick={cancelMapDraft} className="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 rounded-sm text-[13px] hover:bg-gray-50 dark:hover:bg-gray-700">取消</button>
                                            <button onClick={saveMapDraft} className="px-4 py-2 bg-blue-600 border border-blue-600 text-white rounded-sm text-[13px] font-medium hover:bg-blue-700">保存修改</button>
                                        </div>
                                    )}
                                    <button onClick={() => { if (isMapEditing && !window.confirm('尚未保存结构修改，仍要退出吗？')) return; cancelMapDraft(); setIsMapModalOpen(false); }} className="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-sm text-[13px] font-medium hover:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform">退出全屏</button>
""",
              "mind map edit toolbar"
          )
          replace_once(
              """                                            <LogicTreeNode node={fullMapData.mindmap} isRoot={true} displayMode={mapMode} collapsedNodes={collapsedMapNodes} onToggle={toggleMapNode} />
""",
              """                                            <LogicTreeNode
                                                node={(isMapEditing ? mapDraftData : fullMapData)?.mindmap}
                                                isRoot={true}
                                                displayMode={mapMode}
                                                collapsedNodes={collapsedMapNodes}
                                                onToggle={toggleMapNode}
                                                editable={isMapEditing}
                                                onUpdateNode={updateMapDraftNode}
                                                onAddChild={addMapDraftChild}
                                                onDeleteNode={deleteMapDraftNode}
                                            />
""",
              "mind map editable render"
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source markers and syntax shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "book-imports",
              "segmentImportedText",
              "识别结果：{importReview.sourceName}",
              "编辑结构",
              "saveMapDraft",
              "editable={isMapEditing}",
              "[[ARTICLE_BREAK]]"
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing stage-two markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          print('Stage-two marker validation passed')
          PY
          git diff --check

      - name: Commit stage two
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No stage-two changes to commit"
            exit 0
          fi
          git commit -m "feat: add editable outline and book import review"
          git push origin HEAD:feat/reader-annotations-v2
