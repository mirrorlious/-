name: Compare Miki public pool cleanup with main

on:
  push:
    branches:
      - chore/remove-miki-public-pool
    paths:
      - .compare-miki-public-pool-cleanup-trigger

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-miki-public-pool
          path: cleanup
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install baseline dependencies
        working-directory: baseline
        run: npm ci --include=dev

      - name: Install cleanup dependencies
        working-directory: cleanup
        run: npm ci --include=dev

      - name: Install Playwright Edge
        working-directory: cleanup
        run: npx playwright install --with-deps msedge

      - name: Run baseline checks
        shell: bash
        run: |
          set +e
          (cd baseline && npm run lint:a11y) > baseline-lint.log 2>&1
          echo $? > baseline-lint.code
          (cd baseline && npm run build) > baseline-build.log 2>&1
          echo $? > baseline-build.code
          (cd baseline && npm run test:e2e) > baseline-e2e.log 2>&1
          echo $? > baseline-e2e.code
          exit 0

      - name: Run cleanup checks
        shell: bash
        run: |
          set +e
          (cd cleanup && npm run lint:a11y) > cleanup-lint.log 2>&1
          echo $? > cleanup-lint.code
          (cd cleanup && npm run build) > cleanup-build.log 2>&1
          echo $? > cleanup-build.code
          (cd cleanup && npm run test:e2e) > cleanup-e2e.log 2>&1
          echo $? > cleanup-e2e.code
          exit 0

      - name: Record comparison
        shell: bash
        run: |
          set -euo pipefail
          python cleanup/.github/scripts/compare_cleanup_verification.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/cleanup"
          cd cleanup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: compare cleanup against reader main"
          git push origin HEAD:chore/remove-miki-public-pool
