name: Add portable article bundles and batch analysis once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply and validate with diagnostics
        shell: bash
        run: |
          set +e
          python scripts/one_shot_portable_bundles_batch_analysis.py > /tmp/patch.log 2>&1
          patch_code=$?
          git diff --check > /tmp/diff.log 2>&1
          diff_code=$?
          python - <<'PY' > /tmp/static.log 2>&1
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '--reader-sticky-top: 64px', '.reader-page-shell.reader-immersive', 'reader-sticky-toolbar',
              'const READER_DB_VERSION = 3;', 'article-bundles', 'batch-analysis-jobs',
              'ARTICLE_BUNDLE_SCHEMA_VERSION = 1', 'articleBundleToMarkdown', 'parseYangReaderMarkdown',
              'downloadCurrentArticleMarkdown', 'importMarkdownFiles', 'librarySelectionMode',
              'runBatchAnalysis', 'downloadSelectedArticlesMarkdown', 'onPersistParagraphResult',
              'savedResults={paragraphResults[String(idx)] || null}', 'data-reader-mindmap-panel="true"'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          print('Static checks passed')
          PY
          static_code=$?
          npm init -y > /tmp/npm.log 2>&1
          npm install --no-save @babel/core @babel/preset-react >> /tmp/npm.log 2>&1
          npm_code=$?
          node - <<'NODE' > /tmp/babel.log 2>&1
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx', sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE
          babel_code=$?
          set -e
          {
            echo "patch_code=$patch_code"
            echo "diff_code=$diff_code"
            echo "static_code=$static_code"
            echo "npm_code=$npm_code"
            echo "babel_code=$babel_code"
            echo "---- patch ----"; cat /tmp/patch.log
            echo "---- diff ----"; cat /tmp/diff.log
            echo "---- static ----"; cat /tmp/static.log
            echo "---- npm ----"; tail -n 20 /tmp/npm.log
            echo "---- babel ----"; cat /tmp/babel.log
          } > /tmp/diagnostics.txt
          cat /tmp/diagnostics.txt
          if [ "$patch_code" -eq 0 ] && [ "$diff_code" -eq 0 ] && [ "$static_code" -eq 0 ] && [ "$npm_code" -eq 0 ] && [ "$babel_code" -eq 0 ]; then
            echo success > /tmp/result
          else
            echo failure > /tmp/result
            git checkout -- index.html TASK_LOGS/2026-07-27-2300-portable-article-bundles-batch-analysis.md scripts/one_shot_portable_bundles_batch_analysis.py .github/workflows/portable_bundles_batch_analysis_once.yml
            cp /tmp/diagnostics.txt TASK_LOGS/portable-bundle-patch-diagnostics.txt
          fi

      - name: Commit feature or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$(cat /tmp/result)" = "success" ]; then
            git commit -m "feat: add portable article bundles and batch analysis"
          else
            git commit -m "chore: record portable bundle patch diagnostics"
          fi
          git push origin HEAD:feat/reader-annotations-v2
