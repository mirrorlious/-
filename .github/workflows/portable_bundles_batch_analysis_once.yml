name: Add portable article bundles and batch analysis once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply scoped patch
        shell: bash
        run: python scripts/one_shot_portable_bundles_batch_analysis.py

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '--reader-sticky-top: 64px',
              '.reader-page-shell.reader-immersive',
              'reader-sticky-toolbar',
              'const READER_DB_VERSION = 3;',
              'article-bundles',
              'batch-analysis-jobs',
              'ARTICLE_BUNDLE_SCHEMA_VERSION = 1',
              'articleBundleToMarkdown',
              'parseYangReaderMarkdown',
              'downloadCurrentArticleMarkdown',
              'importMarkdownFiles',
              'librarySelectionMode',
              'runBatchAnalysis',
              'downloadSelectedArticlesMarkdown',
              'onPersistParagraphResult',
              'savedResults={paragraphResults[String(idx)] || null}',
              'data-reader-mindmap-panel="true"'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing markers: {missing}')
          if text.count('<script') != text.count('</script>'):
              raise SystemExit('Script tag count mismatch')
          if 'API_KEY_LOCAL_STORAGE_KEY' not in text or 'ARTICLE_BUNDLE_BLOCK_LANGUAGE' not in text:
              raise SystemExit('Security or bundle marker missing')
          print('Static checks passed')
          PY
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="text/babel" data-type="module">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/reader.jsx').write_text(text[start:end], encoding='utf-8')
          PY
          npm init -y >/tmp/npm.log 2>&1
          npm install --no-save @babel/core @babel/preset-react >>/tmp/npm.log 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const babel = require('@babel/core');
          const source = fs.readFileSync('/tmp/reader.jsx', 'utf8');
          babel.transformSync(source, {
            filename: 'index.jsx',
            sourceType: 'module',
            presets: [['@babel/preset-react', { runtime: 'classic' }]]
          });
          console.log('Babel JSX parse passed');
          NODE

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add portable article bundles and batch analysis"
          git push origin HEAD:feat/reader-annotations-v2
