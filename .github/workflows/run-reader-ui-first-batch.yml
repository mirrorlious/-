name: Run one-shot reader UI first batch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-to-annotation-branch:
    if: contains(github.event.head_commit.message, '[run-ui-first-batch-main]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Extract and run the one-shot patch
        shell: bash
        run: |
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-reader-ui-first-batch.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Could not locate embedded patch script')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(textwrap.dedent(script), {'__name__': '__main__'})
          EXTRACT

      - name: Validate and push target branch
        shell: bash
        run: |
          git diff --check
          grep -q 'ANNOTATION_COLOR_OPTIONS' index.html
          grep -q 'data-annotation-color' index.html
          grep -q 'reader-annotation-card' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: refine reader UI and annotation colors"
          git push origin HEAD:feat/reader-annotations-v2
