name: Validate reader annotations

on:
  pull_request:
    branches:
      - feat/reader-layout-context-typography
    paths:
      - index.html
      - TASK_LOGS/2026-07-27-reader-annotations.md

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'feat/reader-annotations-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2

      - name: Extract Babel application source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script type="text/babel"[^>]*>(.*?)</script>', html, flags=re.S)
          if len(matches) != 1:
              raise SystemExit(f'Expected one Babel script, found {len(matches)}')
          Path('/tmp/reader-app.jsx').write_text(matches[0], encoding='utf-8')
          PY

      - name: Parse JSX with Babel
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @babel/core @babel/cli @babel/preset-react >/dev/null
          npx babel /tmp/reader-app.jsx --presets @babel/preset-react --out-file /tmp/reader-app.js

      - name: Static annotation checks
        run: |
          git diff --check origin/feat/reader-layout-context-typography...HEAD
          grep -q 'reader-annotation-mark' index.html
          grep -q 'handleRequestAnnotation' index.html
          grep -q 'readingNotes' index.html
          grep -q '批注仅保存在当前设备' index.html
          grep -q '全文笔记' index.html
