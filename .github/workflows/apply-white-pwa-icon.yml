name: Apply white PWA icon

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ci/white-pwa-icon'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate white-background PWA icons
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          cat > /tmp/reader-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" fill="#ffffff"/>
            <defs>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
                <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#172838" flood-opacity="0.13"/>
              </filter>
            </defs>
            <g filter="url(#shadow)">
              <path d="M170 330 L493 378 L512 756 C424 735 326 724 170 684 Z" fill="#172838"/>
              <path d="M854 330 L531 378 L512 756 C600 735 698 724 854 684 Z" fill="#172838"/>
              <path d="M202 306 C315 314 407 329 500 377 L500 716 C407 698 314 692 202 654 Z" fill="#f7f8fa"/>
              <path d="M822 306 C709 314 617 329 524 377 L524 716 C617 698 710 692 822 654 Z" fill="#fbfbfc"/>
              <rect x="501" y="365" width="22" height="354" rx="11" fill="#dca12d"/>
              <path d="M663 310 H727 V558 L695 530 L663 558 Z" fill="#be3130"/>
            </g>
          </svg>
          SVG

          mkdir -p public/icons
          convert -background white /tmp/reader-icon.svg -resize 512x512 public/icons/icon-white-512.png
          convert -background white /tmp/reader-icon.svg -resize 192x192 public/icons/icon-white-192.png
          convert -background white /tmp/reader-icon.svg -resize 180x180 public/icons/apple-touch-icon-white.png
          convert -background white /tmp/reader-icon.svg -resize 512x512 public/icons/icon-white-maskable-512.png

      - name: Update manifest and document metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('public/manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['background_color'] = '#ffffff'
          manifest['theme_color'] = '#ffffff'
          manifest['icons'] = [
              {'src': '/icons/icon-white-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
              {'src': '/icons/icon-white-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
              {'src': '/icons/icon-white-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('content="#f7f3ea" media="(prefers-color-scheme: light)"', 'content="#ffffff" media="(prefers-color-scheme: light)"')
          index = index.replace('href="/icons/icon-192.png"', 'href="/icons/icon-white-192.png"')
          index = index.replace('href="/icons/apple-touch-icon.png"', 'href="/icons/apple-touch-icon-white.png"')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate icon assets
        run: |
          identify public/icons/icon-white-192.png | grep -q '192x192'
          identify public/icons/icon-white-512.png | grep -q '512x512'
          identify public/icons/apple-touch-icon-white.png | grep -q '180x180'
          identify public/icons/icon-white-maskable-512.png | grep -q '512x512'
          grep -q 'icon-white-192.png' public/manifest.webmanifest
          grep -q 'icon-white-512.png' public/manifest.webmanifest
          grep -q 'apple-touch-icon-white.png' index.html
          grep -q 'content="#ffffff" media="(prefers-color-scheme: light)"' index.html
          git diff --check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production app
        run: npm run build

      - name: Commit and push to main
        run: |
          rm -f .github/workflows/apply-white-pwa-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: refresh PWA icon with white background'
          git push origin HEAD:main
