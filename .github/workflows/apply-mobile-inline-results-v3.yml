name: Apply mobile inline results and annotation bubbles v3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ci/mobile-inline-results'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run hardened corrected patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-mobile-inline-results-v2.yml')
          text = workflow.read_text(encoding='utf-8')
          step_start = text.index('      - name: Apply corrected mobile patch')
          run_marker = text.index('        run: |', step_start)
          body_start = text.index('\n', run_marker) + 1
          body_end = text.index('\n      - name: Validate corrected mobile behavior', body_start)
          lines = text[body_start:body_end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          helper_start = script.index("helper_anchor = '''")
          helper_end = script.index('\n\nold_click =', helper_start)
          helper_replacement = """helper_pattern = re.compile(
    r\"    const runParagraphAction = \\(handler\\) => \\(event\\) => \\{\\n\"
    r\"        handler\\(event\\);\\n\"
    r\"        setIsInteracting\\(false\\);\\n\"
    r\"    \\};\"
)
helper_extra = dedent('''

const handleAnnotationOpen = (annotationId, event) => {
    event?.stopPropagation();
    if (event?.type === 'keydown') event.preventDefault();
    if (mobileAnnotationBubbleEnabled) {
        setMobileAnnotationId(previous => previous === annotationId ? null : annotationId);
        return;
    }
    onFocusAnnotation?.(annotationId);
};

useEffect(() => {
    if (!mobileAnnotationBubbleEnabled || !activeAnnotationId) return;
    if (annotations.some(annotation => annotation.id === activeAnnotationId)) {
        setMobileAnnotationId(activeAnnotationId);
    }
}, [mobileAnnotationBubbleEnabled, activeAnnotationId, annotations]);
''')
text, count = helper_pattern.subn(lambda match: match.group(0) + helper_extra, text, count=1)
if count != 1:
    raise SystemExit(f'helper insertion regex expected 1 match, found {count}')"""
          script = script[:helper_start] + helper_replacement + script[helper_end:]
          Path('/tmp/apply-mobile-inline-results.py').write_text(script.split("python - <<'PY'\n", 1)[-1].rsplit('\nPY', 1)[0] if "python - <<'PY'" in script else script, encoding='utf-8')
          PY
          python /tmp/apply-mobile-inline-results.py

      - name: Validate hardened mobile behavior
        run: |
          grep -q "mobileAnnotationBubbleEnabled={!isLearningPanelWide}" src/App.jsx
          grep -q "if (isLearningPanelWide)" src/App.jsx
          grep -q "inlineResultsEnabled={!isLearningPanelDocked}" src/App.jsx
          ! grep -q "compactActionsEnabled" src/App.jsx
          ! grep -q "data-reader-mobile-actions" src/components/Paragraph.jsx
          grep -q "data-reader-annotation-bubble" src/components/Paragraph.jsx
          grep -q "activeMobileAnnotation.note" src/components/Paragraph.jsx
          test "$(grep -c "if (e.detail > 1) return" src/components/Paragraph.jsx)" -eq 2
          grep -q "inlineResultsEnabled && showTranslation" src/components/Paragraph.jsx
          grep -q "inlineResultsEnabled && showAnalysis" src/components/Paragraph.jsx
          git diff --check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production app
        run: npm run build

      - name: Commit and push to main
        run: |
          rm -f .github/workflows/apply-mobile-inline-results.yml
          rm -f .github/workflows/apply-mobile-inline-results-v2.yml
          rm -f .github/workflows/apply-mobile-inline-results-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore mobile inline results and annotation bubbles'
          git push origin HEAD:main
