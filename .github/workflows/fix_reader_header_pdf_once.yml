name: Fix reader header and PDF extraction once

on:
  push:
    branches:
      - feat/reader-annotations-v2

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/reader-annotations-v2
          fetch-depth: 0

      - name: Apply repair and capture result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/one_shot_fix_header_pdf.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"extractionMethod: \'text-raw\'"', '"extractionMethod = \'text-raw\'"')
          path.write_text(text, encoding='utf-8')
          PY
          set +e
          python scripts/one_shot_fix_header_pdf.py > /tmp/reader-repair.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "commit=${GITHUB_SHA}"
            echo "---- output ----"
            cat /tmp/reader-repair.log
          } > TASK_LOGS/reader-repair-run-output.txt

      - name: Commit repair or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if grep -q '^exit_code=0$' TASK_LOGS/reader-repair-run-output.txt; then
            git commit -m "fix: align header and harden PDF extraction"
          else
            git commit -m "chore: record reader repair failure"
          fi
          git push origin HEAD:feat/reader-annotations-v2
