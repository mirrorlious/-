    <style>

<body class="bg-gray-50 text-gray-900 font-sans dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // 核心注入：API密钥
        window.apiKey = "";

        const { useState, useMemo, useRef, useEffect, Fragment } = React;

        // ==========================================
        // 全局安全工具函数绑定
        // ==========================================
        window.getExcerpt = (text) => {
            if (!text) return "";
            const cleanText = text.replace(/\n/g, ' ');
            return cleanText.length > 60 ? cleanText.substring(0, 60) + '...' : cleanText;
        };

        window.showToast = (message, type = 'success') => {
            const modal = document.createElement('div');
            const bgColor = type === 'error' ? '#EF4444' : (type === 'warning' ? '#F59E0B' : '#10B981');
            modal.innerHTML = `
                <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:${bgColor};color:white;padding:12px 24px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:9999;font-weight:500;font-size:14px;max-width:90vw;word-wrap:break-word;">
                    ${message}
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                modal.style.opacity = '0';
                modal.style.transition = 'opacity 0.3s ease';
                setTimeout(() => document.body.removeChild(modal), 300);
            }, 4500); 
        };

        // 终极安全 JSON 解析器：剥离可能带有 markdown 格式的外壳
        window.safeParseJSON = (text) => {
            if (typeof text !== 'string') return text;
            try {
                return JSON.parse(text);
            } catch (e) {
                try {
                    const markdownRegex = new RegExp('`{3}(?:json)?\\s*([\\s\\S]*?)\\s*`{3}', 'i');
                    const match = text.match(markdownRegex);
                    if (match) return JSON.parse(match[1].trim());
                    
                    const objMatch = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
                    if (objMatch) return JSON.parse(objMatch[1].trim());
                } catch(err) {}
                throw new Error("JSON 解析彻底失败，数据格式不合规");
            }
        };

        // ==========================================
        // 1. 外部动态数据源配置 (URLs)
        // ==========================================
        const CORPUS_URL = "https://gist.githubusercontent.com/mirrorlious97/1f649feb13d7da16cbdc3817841c16cc/raw/a90daca68e24f5892f68edc38793f858ceca5f05/12345.txt"; 
        const PRESET_DICT_URL = "https://gist.githubusercontent.com/mirrorlious97/e39459d2885f9eb78257d4524e18df6f/raw/560c12500d61289af3a6f22d7e41e421fed4cdf3/console=v.%2520%25E5%25AE%2589%25E6%2585%25B0%2520n.%2520%25E6%258E%25A7%25E5%2588%25B6%25E5%258F%25B0.txt";
        const HARD_DICT_URL = "https://gist.githubusercontent.com/mirrorlious97/9e36522b809b300f316fc5899bbb448f/raw/d685d0efe96e29603df00657ddd71b404f1baac4/%25E7%2594%259F%25E8%25AF%258D";

        let REAL_EXAM_CORPUS = [];

        const parseDictText = (text) => {
            const dict = {};
            text.split('\n').forEach(line => {
                const sepMatch = line.match(/([=：:]|\s{2,})/);
                if (sepMatch) {
                    const sepIndex = line.indexOf(sepMatch[0]);
                    let key = line.substring(0, sepIndex).trim().toLowerCase();
                    let meaning = line.substring(sepIndex + sepMatch[0].length).trim();
                    meaning = meaning.replace(/\b(?:v|n|adj|adv|prep|conj|pron|art|num|vi|vt)\./gi, '').replace(/\s+/g, ' ').trim();
                    if (key) dict[key] = meaning;
                }
            });
            return dict;
        };

        const fetchAndParseCorpus = async (setCorpusCount) => {
            if (!CORPUS_URL) return;
            try {
                const response = await fetch(CORPUS_URL);
                if (!response.ok) throw new Error("Failed to fetch corpus");
                const rawText = await response.text();
                
                REAL_EXAM_CORPUS = rawText.trim().split('\n').map(line => {
                    const match = line.match(/^\[(.*?)\]\s*(.*)$/);
                    if (match) return { source: match[1].trim(), sentence: match[2].trim() };
                    return null;
                }).filter(Boolean);
                
                if (setCorpusCount) setCorpusCount(REAL_EXAM_CORPUS.length);
            } catch (error) { console.error("Error loading external corpus:", error); }
        };

        const getRelevantCorpus = (targetText, corpus, topN = 40) => {
            if (!corpus || corpus.length === 0) return [];
            const targetWords = new Set(targetText.toLowerCase().match(/[a-z]+/g) || []);
            const structureWords = new Set([
                'which', 'that', 'who', 'whom', 'where', 'when', 'whose',
                'although', 'though', 'because', 'if', 'unless', 'since', 'as', 'while',
                'to', 'with', 'by', 'for', 'about', 'without', 'despite', 'doing', 'done'
            ]);

            const scoredCorpus = corpus.map(item => {
                const itemWords = item.sentence.toLowerCase().match(/[a-z]+/g) || [];
                let score = 0;
                itemWords.forEach(w => {
                    if (targetWords.has(w)) score += structureWords.has(w) ? 3 : 1; 
                });
                score -= (Math.abs(itemWords.length - targetWords.size) * 0.1);
                return { ...item, score };
            });

            return scoredCorpus.sort((a, b) => b.score - a.score).slice(0, topN).map(item => ({
                source: item.source,
                sentence: item.sentence
            }));
        };

        const getLemmaMatches = (rawWord, dicts) => {
            const w = rawWord.toLowerCase().replace(/[^a-z]/g, '');
            if (!w) return null;
            
            for (const dictObj of dicts) {
                const { data, type } = dictObj;
                if (!data) continue;

                const check = (word) => data[word] ? { translation: data[word], type, word } : null;

                let match = check(w);
                if (match) return match;

                if (w.endsWith('s')) {
                    match = check(w.slice(0, -1)); if (match) return match;
                    if (w.endsWith('es')) { match = check(w.slice(0, -2)); if (match) return match; }
                    if (w.endsWith('ies')) { match = check(w.slice(0, -3) + 'y'); if (match) return match; }
                }
                
                if (w.endsWith('ed')) {
                    match = check(w.slice(0, -1)); if (match) return match;
                    match = check(w.slice(0, -2)); if (match) return match;
                    if (w.endsWith('ied')) { match = check(w.slice(0, -3) + 'y'); if (match) return match; }
                    if (w.length > 3 && w[w.length-3] === w[w.length-4]) {
                        match = check(w.slice(0, -3)); if (match) return match;
                    }
                }
                
                if (w.endsWith('ing')) {
                    match = check(w.slice(0, -3)); if (match) return match;
                    match = check(w.slice(0, -3) + 'e'); if (match) return match;
                    if (w.length > 4 && w[w.length-4] === w[w.length-5]) {
                        match = check(w.slice(0, -4)); if (match) return match;
                    }
                }
                
                if (w.endsWith('ly')) {
                    match = check(w.slice(0, -2)); if (match) return match; 
                    if (w.endsWith('ily')) { match = check(w.slice(0, -3) + 'y'); if (match) return match; }
                }
            }
            return null;
        };

        const VOCAB_DB = {
            cet6: {
                resolution: "决议", initiate: "发起", authorization: "授权", commits: "投入",
                dismissing: "驳回", exclusive: "排他的", regulate: "规范", designates: "指定"
            },
            kaoyan: {
                unilateral: "单边的", vowed: "发誓", halt: "停止", imminent: "迫在眉睫的",
                assertion: "断言", verge: "边缘", preemptive: "先发制人的", echoed: "附和"
            }
        };

        const PHRASE_DB = {
            "war of choice": { trans: "选择性战争", note: "【政经/法律背景】区别于“自卫反击(war of necessity)”，指非被迫、主动发起的战争。" },
            "state of the union": { trans: "国情咨文", note: "【常识/专有名词】美国总统每年在国会发表的年度报告。" },
            "dimming the prospects": { trans: "使前景黯淡", note: "【高级动宾搭配】dim 作及物动词用（使变暗）+ prospect（前景/可能性）。" }
        };

        // ==========================================
        // 2. 超强抗并发多协议 API 引擎
        // ==========================================
        const CURRENT_GEMINI_TEXT_MODEL = "gemini-3.5-flash";
        const CURRENT_GEMINI_TTS_MODEL = "gemini-3.1-flash-tts-preview";
        const RETIRED_GEMINI_MODELS = new Set([
            "gemini-2.0-flash",
            "gemini-2.0-flash-001",
            "gemini-2.0-flash-lite",
            "gemini-2.0-flash-lite-001"
        ]);

        const normalizeApiConfig = (config = {}) => {
            const normalized = { ...config };
            if ((normalized.apiType || "gemini") === "gemini" && RETIRED_GEMINI_MODELS.has((normalized.model || "").trim().toLowerCase())) {
                normalized.model = CURRENT_GEMINI_TEXT_MODEL;
            }
            return normalized;
        };

        const buildGeminiEndpoint = (config, model) => {
            const key = config?.key || window.apiKey || "";
            const apiVersion = config?.apiVersion || "v1beta";
            let baseUrl = (config?.baseUrl || "https://generativelanguage.googleapis.com").trim().replace(/\/+$/, "");
            let endpoint;

            if (/:generateContent(?:\?.*)?$/i.test(baseUrl)) {
                endpoint = baseUrl.replace(/(\/models\/)[^/:?]+(:generateContent)/i, `$1${model}$2`);
            } else if (/\/models\/[^/]+$/i.test(baseUrl)) {
                endpoint = `${baseUrl}:generateContent`;
            } else if (/\/models$/i.test(baseUrl)) {
                endpoint = `${baseUrl}/${model}:generateContent`;
            } else if (/\/v1(?:beta|alpha)?$/i.test(baseUrl)) {
                endpoint = `${baseUrl}/models/${model}:generateContent`;
            } else {
                endpoint = `${baseUrl}/${apiVersion}/models/${model}:generateContent`;
            }

            if (key && !/[?&]key=/i.test(endpoint)) {
                endpoint += `${endpoint.includes("?") ? "&" : "?"}key=${encodeURIComponent(key)}`;
            }
            return endpoint;
        };

        const buildOpenAIEndpoint = (baseUrl) => {
            const normalized = (baseUrl || "https://dashscope.aliyuncs.com/compatible-mode/v1").trim().replace(/\/+$/, "");
            return /\/chat\/completions$/i.test(normalized) ? normalized : `${normalized}/chat/completions`;
        };

        const getEndpoint = (config, isTTS = false) => {
            const normalized = normalizeApiConfig(config);
            const rawModel = isTTS ? CURRENT_GEMINI_TTS_MODEL : (normalized.model || CURRENT_GEMINI_TEXT_MODEL);
            const cleanModel = rawModel.trim().toLowerCase().replace(/\s+/g, '-');
            return buildGeminiEndpoint(normalized, cleanModel);
        };

        const fetchWithRetry = async (url, options, retries = 5) => {
            const delays = [2000, 4000, 8000, 15000, 20000]; 
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errorText = await response.text();
                        let errorMsg = errorText;
                        try {
                            const errObj = JSON.parse(errorText);
                            errorMsg = errObj.error?.message || errObj.message || errorText;
                        } catch(e) {}
                        errorMsg = String(errorMsg || "未知请求错误").replace(/\s+/g, " ").trim().slice(0, 240);
                        if (response.status === 404) {
                            throw new Error(`模型不存在 (HTTP 404)。请确保模型名称填写正确`);
                        }
                        if (response.status === 401 || response.status === 403) {
                            throw new Error(`API 密钥无效或未授权 (HTTP ${response.status})。`);
                        }
                        if (response.status === 400) {
                            throw new Error(`请求被拒绝 (HTTP 400)：${errorMsg}`);
                        }
                        const err = new Error(`HTTP ${response.status}: ${errorMsg}`);
                        err.status = response.status;
                        throw err;
                    }
                    return await response.json();
                } catch (error) {
                    console.warn(`API 尝试 ${i + 1} 失败，准备重试:`, error.message);
                    if (error.message.includes('API 密钥') || error.message.includes('模型不存在') || error.message.includes('请求被拒绝') || (error.status && error.status >= 400 && error.status < 500 && error.status !== 429)) {
                        throw error;
                    }
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        const getCandidateText = (result) => {
            if (!result || !result.candidates || result.candidates.length === 0) {
                throw new Error("API 未返回有效内容或被限流过滤");
            }
            return result.candidates[0].content.parts[0].text;
        };

        const callLLM = async (prompt, apiConfig, isJson = false, task = 'analysis') => {
            const normalizedConfig = resolveTaskApiConfig(apiConfig, task);
            const type = normalizedConfig?.apiType || 'gemini';
            const key = normalizedConfig?.key || window.apiKey;
            const cacheKey = await buildCacheKey('llm', prompt, normalizedConfig, { task, isJson });
            const cached = await readReaderStore('ai-cache', cacheKey);
            if (cached) return cached.value;
            let value;
            
            if (type === 'openai') {
                const endpoint = buildOpenAIEndpoint(normalizedConfig?.baseUrl);
                const payload = {
                    model: normalizedConfig?.model || "qwen-plus",
                    messages: [{ role: "user", content: prompt }]
                };
                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify(payload)
                });
                if (!result.choices || result.choices.length === 0) throw new Error("OpenAI API 未返回有效内容");
                let text = result.choices[0].message.content;
                value = isJson ? window.safeParseJSON(text) : text.trim();
            } else {
                const endpoint = getEndpoint(normalizedConfig);
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let text = getCandidateText(result);
                value = isJson ? window.safeParseJSON(text) : text.trim();
            }
            await writeReaderStore('ai-cache', { key: cacheKey, value, createdAt: Date.now(), task });
            return value;
        };

        const callGeminiFullTranslation = async (fullText, apiConfig) => {
            const prompt = `你是一名深谙政经语境的高级翻译官。请将以下英文文章逐段精翻成中文。
要求：
1. 必须符合中文新闻语感，精准翻译政经/法律术语。
2. 绝对保持与原文完全一致的段落数量。段落与段落之间使用双换行符严格分隔，绝不能合并段落！
3. 仅输出纯中文译文，绝不附加任何开场白、解析或多余的标点。
原文：\n"${fullText}"`;
            return await callLLM(prompt, apiConfig, false);
        };

        const callGeminiTranslation = async (text, apiConfig) => {
            const prompt = `你是一名深谙政经语境的高级翻译官。请精翻以下段落：\n要求：符合中文新闻语感，精准翻译政经/法律术语。仅输出纯中文译文，绝不附加任何解析。\n原文：\n"${text}"`;
            return await callLLM(prompt, apiConfig, false);
        };

        const callGeminiWordDisambiguation = async (word, context, rawMeaning, apiConfig) => {
            const prompt = `词汇 "${word}" 在字典中的基础释义有：【${rawMeaning}】。
请结合以下原句语境，分析该词在句中的词性，并指出它在此处**最准确的一个中文意思**。请简明扼要陈述理由（50字以内）。
原句："${context}"`;
            return await callLLM(prompt, apiConfig, false);
        };

        const callGeminiIntensiveAnalysis = async (text, apiConfig) => {
            const miniCorpus = getRelevantCorpus(text, REAL_EXAM_CORPUS, 40);
            const prompt = `你是一位考研英语名师。请提取以下段落中所有具有考研语法拆解价值的长难句。
对每一个提取出的长难句：
1. 必须一字不差地摘录原文中的这句长难句作为 originalSentence（不得增删任何标点和空格，必须是原文的完整原句）。
2. 将该句按语法群切片(chunks)。注意：切片内容拼接起来必须与 originalSentence 完全一致！【核心警告】：标注属性(type)严格且只能从以下5个词中选择："主干", "非谓语动词", "介词短语", "从句", "其他"。绝对不允许创造新词！
3. 提供该句型的考研作文实战应用指南(writingTip)。保留你最擅长的模板化写作技巧和句型框架。
4. 核心语法点分析（双轨对比）：
   - 必须基于该句的核心语法点，生成一个【🤖 AI 模拟例句】(aiExample)。
   - 【绝对指令 - 真题原句追踪】(realExamMatch)：你必须扫描下方的《真题语料库》，挑选出一个语法结构最相似的原句作为匹配项。

《真题语料库》：
${JSON.stringify(miniCorpus, null, 2)}

待解析段落：\n"${text}"

务必以纯正的 JSON 格式输出，包含以下结构：
{
  "hasComplexSentence": true,
  "complexSentences": [
    {
      "originalSentence": "...",
      "chunks": [{"text": "...", "type": "主干/非谓语动词/介词短语/从句/其他"}],
      "sentenceTranslation": "...",
      "writingTip": "...",
      "aiExample": {"sentence": "...", "translation": "..."},
      "realExamMatch": {"sentence": "...", "translation": "...", "source": "..."}
    }
  ]
}
只输出 JSON 字符串，不要有多余的标记。`;
            return await callLLM(prompt, apiConfig, true);
        };

        const callGeminiReadingAnalysis = async (text, apiConfig) => {
            const prompt = `你是一名“考研英语阅读命题专家”。请对以下全文文本进行全局分析：
1. 指代分析：明确贯穿全文的核心指代词。
2. 逻辑结构拆解：给这篇文章打上“逻辑标签”并说明论述展开过程。

            const cacheKey = await buildCacheKey('tts', text, normalizedConfig, { voice: 'Aoede' });
            const cached = await readReaderStore('tts-cache', cacheKey);
            if (cached?.blob) return URL.createObjectURL(cached.blob);
            const endpoint = getEndpoint(normalizedConfig, true);
            const payload = {
                contents: [{ parts: [{ text: `Please read clearly: ${text}` }] }],
                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } },
            };
            const result = await fetchWithRetry(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const base64PCM = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (!base64PCM) throw new Error("API 未返回有效音频数据");
            const audioUrl = createWavFileFromPCM(base64PCM, 24000);
            try {
                const response = await fetch(audioUrl);
                const blob = await response.blob();
                await writeReaderStore('tts-cache', { key: cacheKey, blob, createdAt: Date.now() });
            } catch (error) {
                console.warn('TTS cache save failed');
            }
            const stored = await readReaderStore('tts-cache', cacheKey);
            if (stored?.blob) {
                URL.revokeObjectURL(audioUrl);
                return URL.createObjectURL(stored.blob);
            }
            return audioUrl;

        const createWavFileFromPCM = (base64PCM, sampleRate = 24000) => {
            const binaryString = window.atob(base64PCM);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = bytes.buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + buffer.byteLength, true); writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data'); view.setUint32(40, buffer.byteLength, true);
            const blob = new Blob([wavHeader, buffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        };

                    setShowQuiz(true);

                    window.showToast(`出题系统异常: ${e.message}`, "error");
                } finally {
                    setIsQuizLoading(false);
                }
            };

            const handleWordClick = (wordInfo) => setActiveNote({ ...wordInfo, isPhrase: false, contextSentence: text });

            const handleDisambiguate = async (noteInfo) => {
                setActiveNote(prev => ({ ...prev, isDisambiguating: true }));
                try {
                    const aiResult = await callGeminiWordDisambiguation(noteInfo.lemma || noteInfo.word, noteInfo.contextSentence, noteInfo.translation, apiConfig);
                    setActiveNote(prev => ({ ...prev, aiContextMeaning: aiResult }));
                } catch (e) {
                    window.showToast(`精准释义超时`, "error");
                } finally {
                    setActiveNote(prev => ({ ...prev, isDisambiguating: false }));
                }
            };

            if (!text.trim()) return null;

            if (readingMode === 'pure') {
                return (
                    <div className="mb-8">
                        <div className="text-gray-900 dark:text-gray-200 text-justify break-words" style={{ fontFamily: typographyConfig.fontFamily, fontSize: `${typographyConfig.fontSize}px`, lineHeight: typographyConfig.lineHeight }}>
                            {text}
                        </div>
                    </div>
                );
            }

            let textSegments = [{ text: text, isTarget: false }];
            if (showAnalysis && analysisData?.complexSentences?.length > 0) {
                analysisData.complexSentences.forEach(compObj => {
                    let target = compObj.originalSentence?.trim();
                    if (!target) return;
                    let newSegments = [];
                    textSegments.forEach(seg => {
                        if (seg.isTarget) {
                            newSegments.push(seg);
                        } else {
                            let idx = seg.text.indexOf(target);
                            let matchedText = target;

                            if (idx === -1) {
                                const escaped = escapeRegExp(target);
                                const flexStr = escaped.replace(/\s+/g, '\\s+').replace(/['’`]/g, "['’`]");
                                try {
                                    const flexRegex = new RegExp(flexStr, 'i');
                                    const match = seg.text.match(flexRegex);
                                    if (match) {
                                        idx = match.index;
                                        matchedText = match[0];
                                    }
                                } catch(e){}
                            }
                            
                            if (idx === -1 && compObj.chunks && compObj.chunks.length > 0) {
                                const firstChunk = compObj.chunks[0].text.trim();
                                const lastChunk = compObj.chunks[compObj.chunks.length - 1].text.trim();
                                if (firstChunk && lastChunk) {
                                    try {
                                        const flexFirst = new RegExp(escapeRegExp(firstChunk).replace(/\s+/g, '\\s+').replace(/['’`]/g, "['’`]"), 'i');
                                        const flexLast = new RegExp(escapeRegExp(lastChunk).replace(/\s+/g, '\\s+').replace(/['’`]/g, "['’`]"), 'i');
                                        
                                        const matchFirst = seg.text.match(flexFirst);
                                        if (matchFirst) {
                                            const startIdx = matchFirst.index;
                                            const remainingText = seg.text.substring(startIdx);
                                            const matchLast = remainingText.match(flexLast);
                                            if (matchLast) {
                                                const endIdx = startIdx + matchLast.index + matchLast[0].length;
                                                matchedText = seg.text.substring(startIdx, endIdx);
                                                idx = startIdx;
                                            }
                                        }
                                    } catch(e){}
                                }
                            }
                            
                            if (idx !== -1) {
                                newSegments.push({ text: seg.text.substring(0, idx), isTarget: false });
                                newSegments.push({ text: seg.text.substring(idx, idx + matchedText.length), isTarget: true });
                                newSegments.push({ text: seg.text.substring(idx + matchedText.length), isTarget: false });
                            } else {
                                newSegments.push(seg);
                            }
                        }
                    });
                    textSegments = newSegments;
                });
            }

            const renderProcessedText = (segmentText, isTarget) => {
                let chunks = phraseRegex ? segmentText.split(phraseRegex) : [segmentText];

                const content = chunks.map((chunk, index) => {
                    const lowerChunk = chunk.toLowerCase();
                    let phraseData = PHRASE_DB[lowerChunk];
                    
                    if (!phraseData) {
                        for (const dict of activeDicts) {
                            if (dict.data && dict.data[lowerChunk]) {
                                phraseData = { trans: dict.data[lowerChunk], type: dict.type };
                                break;
                            }
                        }
                    }

                    if (phraseData && lowerChunk.includes(' ') && highlightMode !== 'none') {
                        const isRed = phraseData.type === 'hard';
                        if (highlightMode === 'red' && !isRed) return <span key={index}>{chunk}</span>;
                        if (highlightMode === 'blue' && isRed) return <span key={index}>{chunk}</span>;

                        const isActive = activeNote && activeNote.word === chunk && activeNote.isPhrase;
                        return (
                            <span key={index} onClick={(e) => { e.stopPropagation(); setActiveNote({ word: chunk, isPhrase: true, trans: phraseData.trans || phraseData.translation, note: phraseData.note, type: phraseData.type }); }} className={`cursor-pointer mx-0.5 border-b-[2px] border-dashed transition-all duration-200 ${isActive ? 'border-sky-400 bg-sky-100/60 text-[#004b87] rounded-sm px-0.5 dark:bg-sky-900/50 dark:border-sky-500 dark:text-sky-200' : 'border-sky-300 hover:border-sky-400 hover:bg-sky-50 text-gray-900 dark:text-gray-200 dark:border-sky-700 dark:hover:bg-sky-900/30'}`}>{chunk}</span>
                        );
                    }
                    return <WordHighlighter key={index} text={chunk} activeDicts={activeDicts} highlightMode={highlightMode} onWordClick={handleWordClick} />;
                });
                return isTarget ? <span className="bg-amber-200/50 dark:bg-amber-900/40 border-b-[2px] border-amber-300/80 dark:border-amber-700 px-[2px] rounded-sm transition-all duration-500 shadow-[0_0_10px_rgba(253,230,138,0.4)] dark:shadow-none">{content}</span> : content;
            };

            const finalTranslationToShow = translationText || localTranslation;

            return (
                <div 
                    data-reader-paragraph="true"
                    className="mb-14 relative group"
                    onMouseEnter={() => setIsInteracting(true)}
                    onMouseLeave={() => setIsInteracting(false)}
                >
                    <div 
                        className="text-gray-900 dark:text-gray-200 text-justify break-words relative z-10 transition-all cursor-pointer md:cursor-auto"
                        style={{ fontFamily: typographyConfig.fontFamily, fontSize: `${typographyConfig.fontSize}px`, lineHeight: typographyConfig.lineHeight }}
                        onClick={handleParagraphClick}
                    >
                        {textSegments.map((seg, i) => <Fragment key={i}>{renderProcessedText(seg.text, seg.isTarget)}</Fragment>)}
                    </div>

                    {!showActions && (
                        <button
                            onClick={(e) => { e.stopPropagation(); setIsInteracting(true); }}
                            aria-expanded={showActions}
                            className="mt-2 inline-flex items-center gap-1.5 min-h-[36px] px-2 text-[12px] font-medium text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors md:opacity-0 md:group-hover:opacity-100 focus:opacity-100"
                            aria-label="展开本段阅读工具"
                        >
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v12m6-6H6"></path></svg>
                            <span>分析本段</span>
                        </button>
                    )}

                    {activeNote && (
                        <div className="mt-4 p-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl animate-fade-in-down relative shadow-lg z-20">
                            <button onClick={() => setActiveNote(null)} className="absolute top-3 right-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 rounded-full p-1 transition-colors"><svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                            <div className="flex items-center space-x-2 mb-2">
                                <span className={`text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm tracking-wider ${activeNote.type === 'hard' ? 'bg-red-600 dark:bg-red-700' : 'bg-sky-600 dark:bg-sky-700'}`}>{activeNote.isPhrase ? "语法与佳句" : (activeNote.type === 'hard' ? "考研生词" : "词库匹配")}</span>
                                <span className={`font-serif font-bold text-[15px] ${activeNote.type === 'hard' ? 'text-red-800 dark:text-red-400' : 'text-[#004b87] dark:text-sky-300'}`}>{activeNote.word}</span>
                                {activeNote.lemma && activeNote.lemma !== activeNote.word.toLowerCase() && <span className="text-[12px] text-gray-400 dark:text-gray-500 font-mono">({activeNote.lemma})</span>}
                            </div>
                            <div className="text-[13px] font-semibold text-gray-800 dark:text-gray-200 mb-2 whitespace-pre-wrap">{activeNote.translation || activeNote.trans}</div>
                            {activeNote.note && <div className="text-[13.5px] text-gray-700 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-900 p-3 rounded-lg border border-gray-100 dark:border-gray-700">{activeNote.note}</div>}
                            
                            {!activeNote.isPhrase && (
                                <div className="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700">
                                    <button onClick={() => handleDisambiguate(activeNote)} disabled={activeNote.isDisambiguating} className="flex items-center text-[12px] font-medium text-purple-700 dark:text-purple-300 bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 px-3 py-1.5 rounded-lg transition-colors active:scale-95">
                                        {activeNote.isDisambiguating ? "AI 分析语境中..." : "🤖 结合语境精判该词意思"}
                                    </button>
                                    {activeNote.aiContextMeaning && <div className="mt-3 p-3 bg-purple-50/60 dark:bg-purple-900/20 border border-purple-100 dark:border-purple-900/50 rounded-lg text-[13px] text-purple-900 dark:text-purple-200 leading-relaxed animate-fade-in"><span className="font-bold mr-1">精准释义：</span>{activeNote.aiContextMeaning}</div>}
                                </div>
                            )}
                        </div>
                    )}

                    <div role="menu" aria-label="Paragraph actions" className={`flex flex-wrap items-center gap-2 transition-all duration-300 ease-in-out overflow-hidden origin-top ${showActions ? 'max-h-[150px] opacity-100 mt-4 scale-y-100' : 'max-h-0 opacity-0 mt-0 scale-y-95 pointer-events-none'}`}>
                        <button 
                            onClick={handleToggleTrans} 
                            disabled={(isTransLoading || isLocalTransLoading) && !finalTranslationToShow} 
                            className={`min-h-[40px] flex items-center gap-1.5 text-[12px] font-medium border px-3 rounded-md transition-all ${showTranslation ? 'bg-gray-800 dark:bg-gray-700 text-white border-gray-800 dark:border-gray-600' : 'bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                        >
                            <span className="font-serif italic text-[11px]">文A</span>
                            <span>{(isTransLoading || isLocalTransLoading) && !finalTranslationToShow ? "处理中..." : showTranslation ? "收起精翻" : "展开精翻"}</span>
                        </button>

                        {isConsideredParagraph && (
                            <button onClick={handleToggleAnalysis} disabled={isAnalysisLoading} className={`min-h-[40px] flex items-center gap-1.5 text-[12px] font-medium border px-3 rounded-md transition-all ${showAnalysis ? 'bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800' : 'bg-white dark:bg-gray-800 text-amber-700 dark:text-amber-500 border-amber-200 dark:border-gray-700 hover:bg-amber-50 dark:hover:bg-gray-700'}`}>
                                {isAnalysisLoading ? <svg className="animate-spin w-3 h-3 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2-1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>}
                                <span>{isAnalysisLoading ? "智能解构中..." : showAnalysis ? "收起句法" : "长难句解构"}</span>
                            </button>
                        )}
                        {!audioUrl && isConsideredParagraph && (
                             <button onClick={handleLocalSpeech} className="min-h-[40px] flex items-center gap-1.5 text-[12px] font-medium border px-3 rounded-md transition-all bg-white dark:bg-gray-800 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-gray-700 hover:bg-emerald-50 dark:hover:bg-gray-700">
                                 <span>本地朗读</span>
                             </button>
                        )}
                        {!audioUrl && isConsideredParagraph && (
                             <button onClick={handleToggleAudio} disabled={isAudioLoading} className={`min-h-[40px] flex items-center gap-1.5 text-[12px] font-medium border px-3 rounded-md transition-all bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 border-blue-200 dark:border-gray-700 hover:bg-blue-50 dark:hover:bg-gray-700`}>
                                {isAudioLoading ? <svg className="animate-spin w-3 h-3 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <span>🎙️</span> }
                                <span>{isAudioLoading ? "音频请求中..." : "外教领读"}</span>
                             </button>
                        )}
                        {isConsideredParagraph && (
                             <button onClick={handleToggleQuiz} disabled={isQuizLoading} className={`min-h-[40px] flex items-center gap-1.5 text-[12px] font-medium border px-3 rounded-md transition-all ${showQuiz ? 'bg-purple-100 dark:bg-purple-900/40 text-purple-800 dark:text-purple-300 border-purple-200 dark:border-purple-800' : 'bg-white dark:bg-gray-800 text-purple-600 dark:text-purple-400 border-purple-200 dark:border-gray-700 hover:bg-purple-50 dark:hover:bg-gray-700'}`}>
                                {isQuizLoading ? <svg className="animate-spin w-3 h-3 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <span>📝</span> }
                                <span>{isQuizLoading ? "预测中..." : showQuiz ? "收起模拟题" : "出题测试"}</span>
                             </button>
                        )}
                    </div>

                    {audioUrl && <div className="mt-3 animate-fade-in-down w-full max-w-sm"><audio src={audioUrl} controls className="h-9 w-full rounded-full" autoPlay /></div>}
                    
                    {showTranslation && finalTranslationToShow && <div className="mt-4 text-gray-800 dark:text-gray-300 font-sans animate-fade-in-down whitespace-pre-wrap border-l-[3px] border-gray-300 dark:border-gray-600 pl-4 py-1 bg-gray-50/50 dark:bg-gray-800/50 rounded-r-lg" style={{ fontSize: `${Math.max(14, typographyConfig.fontSize - 2)}px`, lineHeight: typographyConfig.lineHeight }}>{finalTranslationToShow}</div>}
                    
                    {showAnalysis && analysisData && <SyntaxBreakdowns data={analysisData} />}
                    {showQuiz && quizData && (
                        <div className="mt-4 p-5 bg-purple-50/60 dark:bg-purple-900/10 border border-purple-100 dark:border-purple-900/50 rounded-2xl animate-fade-in-down shadow-sm">
                             <div className="flex items-center space-x-2 mb-4"><span className="bg-purple-600 text-white text-[11px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Reading Comprehension</span></div>
                             <p className="text-[15px] font-serif font-bold text-gray-900 dark:text-gray-100 mb-1">{quizData.questionEn}</p>
                             <p className="text-[12.5px] text-gray-500 dark:text-gray-400 mb-5">{quizData.questionZh}</p>
                             <div className="space-y-2">
                                 {quizData.options.map((opt) => {
                                     const showStatus = selectedOption !== null;
                                     let btnClass = "border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:border-purple-300 dark:hover:border-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/20";
                                     if (showStatus) {
                                         if (opt.id === quizData.correctAnswerId) btnClass = "border-green-400 dark:border-green-600 bg-green-50 dark:bg-green-900/20 text-green-900 dark:text-green-300";
                                         else if (selectedOption === opt.id) btnClass = "border-red-300 dark:border-red-600 bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-300";
                                         else btnClass = "border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-gray-400 dark:text-gray-600";
                                     }
                                     return (
                                         <button key={opt.id} onClick={() => !showStatus && setSelectedOption(opt.id)} disabled={showStatus} className={`w-full text-left p-3 rounded-xl border transition-all duration-200 flex flex-col ${btnClass}`}>
                                             <span className="text-[14px] font-serif font-medium">{opt.id}. {opt.textEn}</span>
                                             {showStatus && <span className="text-[12px] mt-1 opacity-80">{opt.textZh}</span>}
                                         </button>
                                     );
                                 })}
                             </div>
                             {selectedOption && (
                                 <div className="mt-5 p-4 bg-white dark:bg-gray-800 rounded-xl border border-purple-100 dark:border-purple-900/50 animate-fade-in-down">
                                        <div className="flex items-center space-x-2 mb-2">
                                             {selectedOption === quizData.correctAnswerId ? <span className="text-green-600 dark:text-green-400 font-bold text-[14px]">✅ 回答正确</span> : <span className="text-red-500 dark:text-red-400 font-bold text-[14px]">❌ 回答错误 (正确答案: {quizData.correctAnswerId})</span>}
                                        </div>
                                        <div className="text-[13px] text-gray-700 dark:text-gray-300 leading-relaxed text-justify"><span className="font-bold text-purple-700 dark:text-purple-400 mr-1">名师解析：</span>{quizData.analysis}</div>
                                 </div>
                             )}
                        </div>
                    )}
                </div>
            );
        };

        const waitForPdfJs = () => {
            if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
            return new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error("PDF 组件加载超时")), 15000);
                window.addEventListener('pdfjs-ready', () => {
                    clearTimeout(timeout);
                    resolve(window.pdfjsLib);
                }, { once: true });
            });
        };

        const PdfReader = ({ file, onClose, onExtract, isExtractingText, extractionProgress }) => {
            const canvasRef = useRef(null);
            const viewerRef = useRef(null);
            const renderTaskRef = useRef(null);
            const [pdfDocument, setPdfDocument] = useState(null);
            const [pageNumber, setPageNumber] = useState(1);
            const [pageCount, setPageCount] = useState(0);
            const [scale, setScale] = useState(1.25);
            const [fitWidth, setFitWidth] = useState(true);
            const [containerWidth, setContainerWidth] = useState(0);
            const [isLoading, setIsLoading] = useState(true);
            const [isRendering, setIsRendering] = useState(false);
            const [error, setError] = useState("");
            const fileUrl = useMemo(() => URL.createObjectURL(file), [file]);

            useEffect(() => () => URL.revokeObjectURL(fileUrl), [fileUrl]);

            useEffect(() => {
                const element = viewerRef.current;
                if (!element || typeof ResizeObserver === 'undefined') return;
                const observer = new ResizeObserver(entries => {
                    const width = entries[0]?.contentRect?.width || 0;
                    if (width) setContainerWidth(width);
                });
                observer.observe(element);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                let isCancelled = false;
                let loadingTask = null;

                const loadPdf = async () => {
                    setIsLoading(true);
                    setError("");
                    try {
                        const pdfjsLib = await waitForPdfJs();
                        const data = new Uint8Array(await file.arrayBuffer());
                        loadingTask = pdfjsLib.getDocument({ data });
                        const documentProxy = await loadingTask.promise;
                        if (isCancelled) {
                            await documentProxy.destroy();
                            return;
                        }
                        setPdfDocument(documentProxy);
                        setPageCount(documentProxy.numPages);
                        setPageNumber(1);
                    } catch (loadError) {
                        if (!isCancelled) setError(loadError.message || "PDF 打开失败");
                    } finally {
                        if (!isCancelled) setIsLoading(false);
                    }
                };

                loadPdf();
                return () => {
                    isCancelled = true;
                    if (renderTaskRef.current) renderTaskRef.current.cancel();
                    if (loadingTask) loadingTask.destroy();
                };
            }, [file]);

            useEffect(() => {
                if (!pdfDocument || !canvasRef.current || !containerWidth) return;
                let isCancelled = false;

                const renderPage = async () => {
                    setIsRendering(true);
                    try {
                        if (renderTaskRef.current) renderTaskRef.current.cancel();
                        const page = await pdfDocument.getPage(pageNumber);
                        const baseViewport = page.getViewport({ scale: 1 });
                        const renderScale = fitWidth ? Math.max(0.35, Math.min(2.5, (containerWidth - 32) / baseViewport.width)) : scale;
                        const viewport = page.getViewport({ scale: renderScale });
                        const canvas = canvasRef.current;
                        const context = canvas.getContext('2d', { alpha: false });
                        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
                        canvas.width = Math.floor(viewport.width * outputScale);
                        canvas.height = Math.floor(viewport.height * outputScale);
                        canvas.style.width = `${Math.floor(viewport.width)}px`;
                        canvas.style.height = `${Math.floor(viewport.height)}px`;
                        const transform = outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0];
                        const renderTask = page.render({ canvasContext: context, viewport, transform });
                        renderTaskRef.current = renderTask;
                        await renderTask.promise;
                    } catch (renderError) {
                        if (renderError?.name !== 'RenderingCancelledException' && !isCancelled) setError(renderError.message || "页面渲染失败");
                    } finally {
                        if (!isCancelled) setIsRendering(false);
                    }
                };

                renderPage();
                return () => {
                    isCancelled = true;
                    if (renderTaskRef.current) renderTaskRef.current.cancel();
                };
            }, [pdfDocument, pageNumber, scale, fitWidth, containerWidth]);

            const goToPage = (nextPage) => {
                const safePage = Math.min(pageCount || 1, Math.max(1, Number(nextPage) || 1));
                setPageNumber(safePage);
                if (viewerRef.current) viewerRef.current.scrollTop = 0;
            };

            const changeScale = (delta) => {
                setFitWidth(false);
                setScale(current => Math.min(3, Math.max(0.5, Number((current + delta).toFixed(2)))));
            };

            return (
                <section className="min-h-[calc(100vh-4rem)] bg-gray-200 dark:bg-gray-950">
                    <div className="sticky top-16 z-30 min-h-[58px] px-2 sm:px-4 py-2 bg-white/95 dark:bg-gray-900/95 backdrop-blur border-b border-gray-200 dark:border-gray-800 flex flex-wrap items-center gap-2">
                        <button onClick={onClose} className="w-10 h-10 grid place-items-center rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="关闭 PDF">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <div className="min-w-0 flex-1 sm:flex-none sm:w-56">
                            <div className="truncate text-[13px] font-semibold text-gray-800 dark:text-gray-100" title={file.name}>{file.name}</div>
                            <div className="text-[11px] text-gray-400">PDF 原样阅读 · 仅本地打开</div>
                        </div>
                        <div className="order-3 sm:order-none w-full sm:w-auto flex items-center justify-center gap-1">
                            <button onClick={() => goToPage(pageNumber - 1)} disabled={pageNumber <= 1} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-30" aria-label="上一页"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg></button>

                                <span>/ {pageCount || '-'}</span>
                            </label>
                            <button onClick={() => goToPage(pageNumber + 1)} disabled={pageNumber >= pageCount} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-30" aria-label="下一页"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg></button>
                            <span className="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-1"></span>
                            <button onClick={() => changeScale(-0.15)} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="缩小"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 12h12"></path></svg></button>
                            <button onClick={() => setFitWidth(true)} className={`h-10 px-3 rounded-sm text-[12px] font-medium ${fitWidth ? 'bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900' : 'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300'}`}>适宽</button>
                            <button onClick={() => changeScale(0.15)} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="放大"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v12m6-6H6"></path></svg></button>
                        </div>
                        <div className="ml-auto flex items-center gap-1">
                            <button onClick={onExtract} disabled={isExtractingText} className="hidden md:inline-flex h-10 px-3 items-center rounded-md text-[12px] font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-50" title="在浏览器本地逐页提取文字">
                                {isExtractingText ? `本地提取 ${extractionProgress.current}/${extractionProgress.total || '-'}` : "转为精读文本"}
                            </button>
                            <a href={fileUrl} download={file.name} className="w-10 h-10 grid place-items-center rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="下载 PDF" title="下载 PDF"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"></path></svg></a>
                        </div>
                    </div>
                    <div ref={viewerRef} className="relative min-h-[calc(100vh-7.65rem)] overflow-auto px-4 py-6 sm:p-8">
                        {(isLoading || isRendering) && <div className="fixed right-4 bottom-4 z-20 px-3 py-2 rounded-sm bg-gray-900 text-white text-[12px] shadow-lg">{isLoading ? "正在打开 PDF..." : "正在渲染页面..."}</div>}
                        {error ? (
                            <div className="max-w-lg mx-auto mt-16 p-5 bg-white dark:bg-gray-900 border border-red-200 dark:border-red-900 rounded-lg text-center"><div className="font-semibold text-red-600 dark:text-red-400">PDF 无法打开</div><div className="mt-2 text-[13px] text-gray-500 dark:text-gray-400">{error}</div></div>
                        ) : (
                            <canvas ref={canvasRef} className="block mx-auto bg-white shadow-lg" aria-label={`PDF 第 ${pageNumber} 页`}></canvas>
                        )}
                    </div>
                </section>
            );
        };

        const DEFAULT_API_CONFIG = {
            apiType: 'gemini', key: '', model: CURRENT_GEMINI_TEXT_MODEL,
            baseUrl: 'https://generativelanguage.googleapis.com', apiVersion: 'v1beta',
            rememberKey: false,
            taskRoutes: {
                analysis: { model: CURRENT_GEMINI_TEXT_MODEL },
                ocr: { model: CURRENT_GEMINI_TEXT_MODEL },
                tts: { model: CURRENT_GEMINI_TTS_MODEL }
            }
        };
        const DEFAULT_TYPOGRAPHY_CONFIG = { fontFamily: '"Noto Serif SC", STSong, "Times New Roman", serif', fontSize: 17, lineHeight: 1.9, paddingX: 6, theme: 'light' };
        const LOCAL_STORAGE_KEY = 'yang-reader-state-v1';
        const API_KEY_SESSION_STORAGE_KEY = 'yang-reader-api-key-v1';
        const API_KEY_LOCAL_STORAGE_KEY = 'yang-reader-api-key-v1';
        const READER_DB_NAME = 'yang-reader-local-v1';
        const READER_DB_VERSION = 1;
        const CACHE_PROMPT_VERSION = '2026-07-26-v1';

        const openReaderDb = () => new Promise((resolve) => {
            if (!window.indexedDB) { resolve(null); return; }
            const request = window.indexedDB.open(READER_DB_NAME, READER_DB_VERSION);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('ai-cache')) db.createObjectStore('ai-cache', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('tts-cache')) db.createObjectStore('tts-cache', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('pdf-tasks')) db.createObjectStore('pdf-tasks', { keyPath: 'key' });
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve(null);
        });

        const readReaderStore = async (storeName, key) => {
            const db = await openReaderDb();
            if (!db) return null;
            return new Promise(resolve => {
                const request = db.transaction(storeName, 'readonly').objectStore(storeName).get(key);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => resolve(null);
            });
        };

        const writeReaderStore = async (storeName, value) => {
            const db = await openReaderDb();
            if (!db) return false;
            return new Promise(resolve => {
                const request = db.transaction(storeName, 'readwrite').objectStore(storeName).put(value);
                request.onsuccess = () => resolve(true);
                request.onerror = () => resolve(false);
            });
        };

        const hashText = async (value) => {
            const bytes = new TextEncoder().encode(value);
            if (window.crypto?.subtle) {
                const digest = await window.crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
            }
            return btoa(unescape(encodeURIComponent(value))).slice(0, 64);
        };

        const hashBytes = async (bytes) => {
            if (window.crypto?.subtle) {
                const digest = await window.crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
            }
            return hashText(String(bytes.byteLength));
        };

        const buildCacheKey = async (kind, input, config = {}, options = {}) => {
            const identity = JSON.stringify({ kind, input, model: config.model || '', apiType: config.apiType || '', baseUrl: config.baseUrl || '', promptVersion: CACHE_PROMPT_VERSION, options });
            return `${kind}:${await hashText(identity)}`;
        };

        const getStoredApiKey = (legacyKey = '') => {
            try {
                const sessionKey = window.sessionStorage.getItem(API_KEY_SESSION_STORAGE_KEY);
                if (sessionKey) return sessionKey;
                const rememberedKey = window.localStorage.getItem(API_KEY_LOCAL_STORAGE_KEY);
                if (rememberedKey) return rememberedKey;
                if (legacyKey) {
                    window.sessionStorage.setItem(API_KEY_SESSION_STORAGE_KEY, legacyKey);
                    try {
                        const state = JSON.parse(window.localStorage.getItem(LOCAL_STORAGE_KEY) || '{}') || {};
                        if (state.apiConfig?.key) {
                            const { key, ...safeApiConfig } = state.apiConfig;
                            state.apiConfig = safeApiConfig;
                            window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
                        }
                    } catch (error) { console.warn('Legacy API Key cleanup failed'); }
                    return legacyKey;
                }
            } catch (error) { console.warn('API Key restore failed'); }
            return '';
        };

        const sanitizeApiConfig = (config = {}) => {
            const { key, ...safeConfig } = config;
            return { ...safeConfig, key: '' };
        };

        const persistApiKey = (config = {}) => {
            try {
                const key = String(config.key || '').trim();
                if (key) window.sessionStorage.setItem(API_KEY_SESSION_STORAGE_KEY, key);
                else window.sessionStorage.removeItem(API_KEY_SESSION_STORAGE_KEY);
                if (config.rememberKey && key) window.localStorage.setItem(API_KEY_LOCAL_STORAGE_KEY, key);
                else window.localStorage.removeItem(API_KEY_LOCAL_STORAGE_KEY);
            } catch (error) { console.warn('API Key save failed'); }
        };

        const resolveTaskApiConfig = (config = {}, task = 'analysis') => {
            const route = config.taskRoutes?.[task] || {};
            return normalizeApiConfig({ ...config, ...route, key: getStoredApiKey(config.key) });
        };
        const formatFileSize = (bytes) => {
            if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        };

        const median = (values) => {
            const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
            if (sorted.length === 0) return 0;
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
        };

        const cleanPdfText = (text) => text
            .replace(/\s+/g, " ")
            .replace(/\s+([,.;:!?%)\]}])/g, "$1")
            .replace(/([([{])\s+/g, "$1")
            .replace(/([A-Za-z])([’'])\s+([A-Za-z]{1,2})\b/g, "$1$2$3")
            .trim();

        const pdfItemsToLines = (items, pageWidth) => {
            const lines = [];
            let currentLine = null;

            const flushLine = () => {
                if (currentLine?.text?.trim()) {
                    const text = cleanPdfText(currentLine.text);
                    if (text) lines.push({ ...currentLine, text, width: Math.max(0, currentLine.right - currentLine.x) });
                }
                currentLine = null;
            };

            items.forEach(item => {
                const rawText = typeof item.str === "string" ? item.str.trim() : "";
                const x = Number(item.transform?.[4]) || 0;
                const y = Number(item.transform?.[5]) || 0;
                const fontSize = Math.max(1, Math.abs(Number(item.transform?.[3])) || Number(item.height) || 10);
                const itemWidth = Math.max(0, Number(item.width) || 0);

                if (currentLine) {
                    const baselineChanged = Math.abs(y - currentLine.y) > Math.max(2, Math.min(fontSize, currentLine.fontSize) * 0.45);
                    const separatedColumn = !baselineChanged && x - currentLine.right > Math.max(18, pageWidth * 0.035);
                    if (baselineChanged || separatedColumn) flushLine();
                }

                if (rawText) {
                    if (!currentLine) {
                        currentLine = { text: "", x, y, right: x, fontSize };
                    }
                    const needsSpace = currentLine.text &&
                        !/[\s-]$/.test(currentLine.text) &&
                        !/^[,.;:!?%)\]}]/.test(rawText);
                    currentLine.text += `${needsSpace ? " " : ""}${rawText}`;
                    currentLine.x = Math.min(currentLine.x, x);
                    currentLine.right = Math.max(currentLine.right, x + itemWidth);
                    currentLine.fontSize = Math.max(currentLine.fontSize, fontSize);
                }

                if (item.hasEOL) flushLine();
            });
            flushLine();
            return lines;
        };

        const joinPdfLines = (lines) => cleanPdfText(lines.reduce((text, line) => {
            if (!text) return line.text;
            if (/[A-Za-z]-$/.test(text) && /^[a-z]/.test(line.text)) {
                return `${text.slice(0, -1)}${line.text}`;
            }
            return `${text} ${line.text}`;
        }, ""));

        const pdfLinesToParagraphs = (lines, pageWidth) => {
            if (lines.length === 0) return [];
            const bodyLines = lines.filter(line => line.text.split(/\s+/).length >= 5);
            const typicalFont = median((bodyLines.length ? bodyLines : lines).map(line => line.fontSize)) || 10;
            const typicalWidth = median((bodyLines.length ? bodyLines : lines).map(line => line.width)) || pageWidth * 0.28;
            const paragraphs = [];
            let current = [];

            const flushParagraph = () => {
                const paragraph = joinPdfLines(current);
                if (paragraph) paragraphs.push(paragraph);
                current = [];
            };

            lines.forEach((line, index) => {
                const previous = lines[index - 1];
                const next = lines[index + 1];
                const wordCount = line.text.split(/\s+/).filter(Boolean).length;
                const isHeading = line.fontSize > typicalFont * 1.18 ||
                    (wordCount <= 12 && line.fontSize > typicalFont * 1.08 && line.width < typicalWidth * 0.82 && !/[.!?;:]\s*[”"')\]]?$/.test(line.text));
                const previousIsHeading = previous && (previous.fontSize > typicalFont * 1.2);
                const columnReset = previous && line.y > previous.y + typicalFont * 1.35;
                const sideBySideColumn = previous && Math.abs(line.y - previous.y) < typicalFont * 0.8 && Math.abs(line.x - previous.x) > pageWidth * 0.16;
                const verticalGap = previous && previous.y > line.y && previous.y - line.y > typicalFont * 1.65;
                const startsIndented = next && line.y > next.y && Math.abs(line.x - next.x) < pageWidth * 0.08 && line.x - next.x > typicalFont * 1.2;
                const previousEndsParagraph = previous && previous.width < typicalWidth * 0.76 && /[.!?][”"')\]]?$/.test(previous.text);
                const startsListItem = /^(?:[•▪●]|\d{1,2}[.)]|[A-Z][.)])\s+/.test(line.text);
                const startsNewParagraph = current.length > 0 && (
                    isHeading || previousIsHeading || columnReset || sideBySideColumn || verticalGap || startsIndented || previousEndsParagraph || startsListItem
                );

                if (startsNewParagraph) flushParagraph();
                current.push(line);
                if (isHeading) flushParagraph();
            });
            flushParagraph();
            return paragraphs;
        };

        const getModelSafeText = (text, maxChars, actionLabel) => {
            const normalized = text.trim();
            if (normalized.length <= maxChars) return normalized;
            const candidates = [
                normalized.lastIndexOf(". ", maxChars),
                normalized.lastIndexOf("? ", maxChars),
                normalized.lastIndexOf("! ", maxChars)
            ];
            const sentenceCut = Math.max(...candidates);
            const cutAt = sentenceCut > maxChars * 0.6 ? sentenceCut + 1 : normalized.lastIndexOf(" ", maxChars);
            window.showToast(`${actionLabel}仅使用当前段落前 ${Math.round(maxChars / 1000)}k 字符，避免请求过长`, "warning");
            return normalized.slice(0, Math.max(1, cutAt)).trim();
        };

        const splitTextIntoChunks = (text, maxChars = 12000) => {
            const normalized = String(text || '').trim();
            if (!normalized) return [];
            const chunks = [];
            let remaining = normalized;
            while (remaining.length > maxChars) {
                const boundary = Math.max(remaining.lastIndexOf('\n\n', maxChars), remaining.lastIndexOf('. ', maxChars));
                const cutAt = boundary > maxChars * 0.55 ? boundary + (remaining[boundary] === '.' ? 1 : 0) : remaining.lastIndexOf(' ', maxChars);
                const safeCut = cutAt > 0 ? cutAt : maxChars;
                chunks.push(remaining.slice(0, safeCut).trim());
                remaining = remaining.slice(safeCut).trim();
            }
            if (remaining) chunks.push(remaining);
            return chunks;
        };

        const App = () => {
            const localState = useMemo(() => {
                try {
                    return JSON.parse(window.localStorage.getItem(LOCAL_STORAGE_KEY) || '{}') || {};
                } catch (error) {
                    console.warn('Local state restore failed:', error);
                    return {};
                }
            }, []);
            const isMindMapPreview = useMemo(() => ['localhost', '127.0.0.1'].includes(window.location.hostname) && new URLSearchParams(window.location.search).has('mindmapPreview'), []);

            const persistLocalState = (patch) => {
                try {
                    const previous = JSON.parse(window.localStorage.getItem(LOCAL_STORAGE_KEY) || '{}') || {};
                    const safePatch = patch.apiConfig ? { ...patch, apiConfig: sanitizeApiConfig(patch.apiConfig) } : patch;
                    window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({ ...previous, ...safePatch }));
                } catch (error) {
                    console.warn('Local state save failed:', error);
                }
            };

            const defaultLayoutMode = typeof window !== 'undefined' && window.innerWidth >= 1200 ? 'split' : 'standard';
            const savedLayoutState = localState.layoutState || {};
            const [layoutMode, setLayoutMode] = useState(['standard', 'split', 'focus'].includes(savedLayoutState.layoutMode) ? savedLayoutState.layoutMode : defaultLayoutMode);
            const [rightPanelTab, setRightPanelTab] = useState(['outline', 'analysis', 'notes'].includes(savedLayoutState.rightPanelTab) ? savedLayoutState.rightPanelTab : 'outline');
            const [rightPanelOpen, setRightPanelOpen] = useState(savedLayoutState.rightPanelOpen !== false);
            const [splitRatio, setSplitRatio] = useState(Number.isFinite(savedLayoutState.splitRatio) ? Math.min(70, Math.max(52, savedLayoutState.splitRatio)) : 58);
            const [isImmersive, setIsImmersive] = useState(false);
            const [isBrowserFullscreen, setIsBrowserFullscreen] = useState(false);

            useEffect(() => {
                persistLocalState({ layoutState: { layoutMode, rightPanelTab, rightPanelOpen, splitRatio } });
            }, [layoutMode, rightPanelTab, rightPanelOpen, splitRatio]);

            useEffect(() => {
                const handleFullscreenChange = () => setIsBrowserFullscreen(Boolean(document.fullscreenElement));
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            const toggleBrowserFullscreen = async () => {
                try {
                    if (document.fullscreenElement) await document.exitFullscreen();
                    else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
                    else setIsImmersive(previous => !previous);
                } catch (error) {
                    setIsImmersive(previous => !previous);
                }
            };

            const savedTypographyConfig = localState.typographyConfig || {};
            const initialTypographyConfig = {
                ...DEFAULT_TYPOGRAPHY_CONFIG,
                ...savedTypographyConfig,
                lineHeight: savedTypographyConfig.lineHeight === 2.4 ? DEFAULT_TYPOGRAPHY_CONFIG.lineHeight : (savedTypographyConfig.lineHeight ?? DEFAULT_TYPOGRAPHY_CONFIG.lineHeight)
            };

            const initialApiConfig = normalizeApiConfig({ ...DEFAULT_API_CONFIG, ...(localState.apiConfig || {}), key: getStoredApiKey(localState.apiConfig?.key) });
            const [apiConfig, setApiConfig] = useState(initialApiConfig);
            const [isApiModalOpen, setIsApiModalOpen] = useState(false);
            const [tempApiConfig, setTempApiConfig] = useState(initialApiConfig);
            const [isTestingApi, setIsTestingApi] = useState(false);

            const [typographyConfig, setTypographyConfig] = useState(initialTypographyConfig);
            const [isTypographyModalOpen, setIsTypographyModalOpen] = useState(false);
            const [tempTypographyConfig, setTempTypographyConfig] = useState(initialTypographyConfig);

            const [inputText, setInputText] = useState(isMindMapPreview ? "Mind map interaction preview." : "");
            const [isReadingMode, setIsReadingMode] = useState(isMindMapPreview);
            const [readingMode, setReadingMode] = useState('intensive'); 
            const [isHeaderMenuOpen, setIsHeaderMenuOpen] = useState(false);
            
            const [highlightMode, setHighlightMode] = useState('red');
            
            const [fullTranslations, setFullTranslations] = useState([]);
            const [isFullTransLoading, setIsFullTransLoading] = useState(false);

            const [showGlobalLogic, setShowGlobalLogic] = useState(false);
            const [globalLogicData, setGlobalLogicData] = useState(null);
            const [isGlobalLogicLoading, setIsGlobalLogicLoading] = useState(false);

            const [isAnalyzingMap, setIsAnalyzingMap] = useState(false);
            const [fullMapData, setFullMapData] = useState(isMindMapPreview ? MINDMAP_PREVIEW_DATA : null);
            const [mapMode, setMapMode] = useState('bilingual'); 
            const [isMapModalOpen, setIsMapModalOpen] = useState(false);
            const [mapScale, setMapScale] = useState(1);
            const [collapsedMapNodes, setCollapsedMapNodes] = useState(() => new Set());

            const [isExtracting, setIsExtracting] = useState(false);
            const fileInputRef = useRef(null);
            const [pdfFile, setPdfFile] = useState(null);
            const [pendingPdfFile, setPendingPdfFile] = useState(null);
            const [isPdfMode, setIsPdfMode] = useState(false);
            const [isPdfChoiceOpen, setIsPdfChoiceOpen] = useState(false);
            const [pdfExtractionProgress, setPdfExtractionProgress] = useState({ current: 0, total: 0 });

            const [isDictModalOpen, setIsDictModalOpen] = useState(false);
            const [dictInputText, setDictInputText] = useState("");
            const [customDict, setCustomDict] = useState(localState.customDict || {});
            
            const [presetDict, setPresetDict] = useState({});
            const [hardDict, setHardDict] = useState({});

            const [history, setHistory] = useState(localState.history || []);
            const [isHistoryDrawerOpen, setIsHistoryDrawerOpen] = useState(false);
            const [currentHistoryId, setCurrentHistoryId] = useState(null);
            const [user, setUser] = useState(null);

            const [dbInstance, setDbInstance] = useState(null);
            const [authInstance, setAuthInstance] = useState(null);
            const [corpusCount, setCorpusCount] = useState(0);

            const activeDicts = useMemo(() => [
                { data: hardDict, type: 'hard' },
                { data: customDict, type: 'custom' },
                { data: presetDict, type: 'preset' },
                { data: VOCAB_DB.kaoyan, type: 'default' },
                { data: VOCAB_DB.cet6, type: 'default' }
            ], [hardDict, customDict, presetDict]);
            
            useEffect(() => {
                fetchAndParseCorpus(setCorpusCount);
                fetch(PRESET_DICT_URL).then(r=>r.text()).then(t=>setPresetDict(parseDictText(t))).catch(console.error);
                fetch(HARD_DICT_URL).then(r=>r.text()).then(t=>setHardDict(parseDictText(t))).catch(console.error);
            }, []);

            useEffect(() => {
                let isMounted = true;
                const checkFirebase = setInterval(() => {
                    if (window.firebaseImports && isMounted) {
                        clearInterval(checkFirebase);
                        const { initializeApp, getAuth, getFirestore } = window.firebaseImports;
                        try {
                            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                            if (Object.keys(firebaseConfig).length > 0) {
                                const app = initializeApp(firebaseConfig);
                                setAuthInstance(getAuth(app));
                                setDbInstance(getFirestore(app));
                            }
                        } catch (e) { console.error("Firebase config error"); }
                    }
                }, 100);
                return () => { isMounted = false; clearInterval(checkFirebase); };
            }, []);

            useEffect(() => {
                if (!authInstance || !window.firebaseImports) return;
                const { signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.firebaseImports;
                const initAuth = async () => {
