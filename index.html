<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>

<body class="bg-gray-50 text-gray-900 font-sans dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // 核心注入：API密钥
        window.apiKey = "";

        const { useState, useMemo, useRef, useEffect, Fragment } = React;

        // ==========================================
        // 全局安全工具函数绑定
        // ==========================================
        window.getExcerpt = (text) => {
            if (!text) return "";
            const cleanText = text.replace(/\n/g, ' ');
            return cleanText.length > 60 ? cleanText.substring(0, 60) + '...' : cleanText;
        };

        window.showToast = (message, type = 'success') => {
            const modal = document.createElement('div');
            const bgColor = type === 'error' ? '#EF4444' : (type === 'warning' ? '#F59E0B' : '#10B981');
            modal.innerHTML = `
                <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:${bgColor};color:white;padding:12px 24px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:9999;font-weight:500;font-size:14px;max-width:90vw;word-wrap:break-word;">
                    ${message}
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                modal.style.opacity = '0';
                modal.style.transition = 'opacity 0.3s ease';
                setTimeout(() => document.body.removeChild(modal), 300);
            }, 4500); 
        };

        // 终极安全 JSON 解析器：剥离可能带有 markdown 格式的外壳
        window.safeParseJSON = (text) => {
            if (typeof text !== 'string') return text;
            try {
                return JSON.parse(text);
            } catch (e) {
                try {
                    const markdownRegex = new RegExp('`{3}(?:json)?\\s*([\\s\\S]*?)\\s*`{3}', 'i');
                    const match = text.match(markdownRegex);
                    if (match) return JSON.parse(match[1].trim());
                    
                    const objMatch = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
                    if (objMatch) return JSON.parse(objMatch[1].trim());
                } catch(err) {}
                throw new Error("JSON 解析彻底失败，数据格式不合规");
            }
        };

        // ==========================================
        // 1. 外部动态数据源配置 (URLs)
        // ==========================================
        const CORPUS_URL = "https://gist.githubusercontent.com/mirrorlious97/1f649feb13d7da16cbdc3817841c16cc/raw/a90daca68e24f5892f68edc38793f858ceca5f05/12345.txt"; 
        const PRESET_DICT_URL = "https://gist.githubusercontent.com/mirrorlious97/e39459d2885f9eb78257d4524e18df6f/raw/560c12500d61289af3a6f22d7e41e421fed4cdf3/console=v.%2520%25E5%25AE%2589%25E6%2585%25B0%2520n.%2520%25E6%258E%25A7%25E5%2588%25B6%25E5%258F%25B0.txt";
        const HARD_DICT_URL = "https://gist.githubusercontent.com/mirrorlious97/9e36522b809b300f316fc5899bbb448f/raw/d685d0efe96e29603df00657ddd71b404f1baac4/%25E7%2594%259F%25E8%25AF%258D";

        let REAL_EXAM_CORPUS = [];

        const parseDictText = (text) => {
            const dict = {};
            text.split('\n').forEach(line => {
                const sepMatch = line.match(/([=：:]|\s{2,})/);
                if (sepMatch) {
                    const sepIndex = line.indexOf(sepMatch[0]);
                    let key = line.substring(0, sepIndex).trim().toLowerCase();
                    let meaning = line.substring(sepIndex + sepMatch[0].length).trim();
                    meaning = meaning.replace(/\b(?:v|n|adj|adv|prep|conj|pron|art|num|vi|vt)\./gi, '').replace(/\s+/g, ' ').trim();
                    if (key) dict[key] = meaning;
                }
            });
            return dict;
        };

        const fetchAndParseCorpus = async (setCorpusCount) => {
            if (!CORPUS_URL) return;
            try {
                const response = await fetch(CORPUS_URL);
                if (!response.ok) throw new Error("Failed to fetch corpus");
                const rawText = await response.text();
                
                REAL_EXAM_CORPUS = rawText.trim().split('\n').map(line => {
                    const match = line.match(/^\[(.*?)\]\s*(.*)$/);
                    if (match) return { source: match[1].trim(), sentence: match[2].trim() };
                    return null;
                }).filter(Boolean);
                
                if (setCorpusCount) setCorpusCount(REAL_EXAM_CORPUS.length);
            } catch (error) { console.error("Error loading external corpus:", error); }
        };

        const getRelevantCorpus = (targetText, corpus, topN = 40) => {
            if (!corpus || corpus.length === 0) return [];
            const targetWords = new Set(targetText.toLowerCase().match(/[a-z]+/g) || []);
            const structureWords = new Set([
                'which', 'that', 'who', 'whom', 'where', 'when', 'whose',
                'although', 'though', 'because', 'if', 'unless', 'since', 'as', 'while',
                'to', 'with', 'by', 'for', 'about', 'without', 'despite', 'doing', 'done'
            ]);

            const scoredCorpus = corpus.map(item => {
                const itemWords = item.sentence.toLowerCase().match(/[a-z]+/g) || [];
                let score = 0;
                itemWords.forEach(w => {
                    if (targetWords.has(w)) score += structureWords.has(w) ? 3 : 1; 
                });
                score -= (Math.abs(itemWords.length - targetWords.size) * 0.1);
                return { ...item, score };
            });

            return scoredCorpus.sort((a, b) => b.score - a.score).slice(0, topN).map(item => ({
                source: item.source,
                sentence: item.sentence
            }));
        };

        const getLemmaMatches = (rawWord, dicts) => {
            const w = rawWord.toLowerCase().replace(/[^a-z]/g, '');
            if (!w) return null;
            
            for (const dictObj of dicts) {
                const { data, type } = dictObj;
                if (!data) continue;

                const check = (word) => data[word] ? { translation: data[word], type, word } : null;

                let match = check(w);
                if (match) return match;

                if (w.endsWith('s')) {
                    match = check(w.slice(0, -1)); if (match) return match;
                    if (w.endsWith('es')) { match = check(w.slice(0, -2)); if (match) return match; }
                    if (w.endsWith('ies')) { match = check(w.slice(0, -3) + 'y'); if (match) return match; }
                }
                
                if (w.endsWith('ed')) {
                    match = check(w.slice(0, -1)); if (match) return match;
                    match = check(w.slice(0, -2)); if (match) return match;
                    if (w.endsWith('ied')) { match = check(w.slice(0, -3) + 'y'); if (match) return match; }
                    if (w.length > 3 && w[w.length-3] === w[w.length-4]) {
                        match = check(w.slice(0, -3)); if (match) return match;
                    }
                }
                
                if (w.endsWith('ing')) {
                    match = check(w.slice(0, -3)); if (match) return match;
                    match = check(w.slice(0, -3) + 'e'); if (match) return match;
                    if (w.length > 4 && w[w.length-4] === w[w.length-5]) {
                        match = check(w.slice(0, -4)); if (match) return match;
                    }
                }
                
                if (w.endsWith('ly')) {
                    match = check(w.slice(0, -2)); if (match) return match; 
                    if (w.endsWith('ily')) { match = check(w.slice(0, -3) + 'y'); if (match) return match; }
                }
            }
            return null;
        };

        const VOCAB_DB = {
            cet6: {
                resolution: "决议", initiate: "发起", authorization: "授权", commits: "投入",
                dismissing: "驳回", exclusive: "排他的", regulate: "规范", designates: "指定"
            },
            kaoyan: {
                unilateral: "单边的", vowed: "发誓", halt: "停止", imminent: "迫在眉睫的",
                assertion: "断言", verge: "边缘", preemptive: "先发制人的", echoed: "附和"
            }
        };

        const PHRASE_DB = {
            "war of choice": { trans: "选择性战争", note: "【政经/法律背景】区别于“自卫反击(war of necessity)”，指非被迫、主动发起的战争。" },
            "state of the union": { trans: "国情咨文", note: "【常识/专有名词】美国总统每年在国会发表的年度报告。" },
            "dimming the prospects": { trans: "使前景黯淡", note: "【高级动宾搭配】dim 作及物动词用（使变暗）+ prospect（前景/可能性）。" }
        };

        // ==========================================
        // 2. 超强抗并发多协议 API 引擎
        // ==========================================
        const getEndpoint = (config, isTTS = false) => {
            const key = config?.key || window.apiKey; 
            let baseUrl = config?.baseUrl || "https://generativelanguage.googleapis.com";
            baseUrl = baseUrl.replace(/\/+$/, ""); 
            
            if (isTTS) {
                return `${baseUrl}/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${key}`;
            }

            const rawModel = config?.model || "gemini-2.5-flash-preview-09-2025";
            const cleanModel = rawModel.trim().toLowerCase().replace(/\s+/g, '-');
            const apiVersion = config?.apiVersion || "v1beta";

            return `${baseUrl}/${apiVersion}/models/${cleanModel}:generateContent?key=${key}`;
        };

        const fetchWithRetry = async (url, options, retries = 5) => {
            const delays = [2000, 4000, 8000, 15000, 20000]; 
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error(`模型不存在 (HTTP 404)。请确保模型名称填写正确`);
                        }
                        if (response.status === 401 || response.status === 403) {
                            throw new Error(`API 密钥无效或未授权 (HTTP ${response.status})。`);
                        }
                        if (response.status === 400) {
                            throw new Error(`请求被拒绝 (HTTP 400)。可能代理接口格式不兼容。`);
                        }
                        const errorText = await response.text();
                        let errorMsg = errorText;
                        try {
                            const errObj = JSON.parse(errorText);
                            if (errObj.error && errObj.error.message) errorMsg = errObj.error.message;
                        } catch(e){}
                        const err = new Error(`HTTP ${response.status}: ${errorMsg}`);
                        err.status = response.status;
                        throw err;
                    }
                    return await response.json();
                } catch (error) {
                    console.warn(`API 尝试 ${i + 1} 失败，准备重试:`, error.message);
                    if (error.message.includes('API 密钥') || error.message.includes('模型不存在') || error.message.includes('请求被拒绝') || (error.status && error.status >= 400 && error.status < 500 && error.status !== 429)) {
                        throw error;
                    }
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        const getCandidateText = (result) => {
            if (!result || !result.candidates || result.candidates.length === 0) {
                throw new Error("API 未返回有效内容或被限流过滤");
            }
            return result.candidates[0].content.parts[0].text;
        };

        const callLLM = async (prompt, apiConfig, isJson = false) => {
            const type = apiConfig?.apiType || 'gemini';
            const key = apiConfig?.key || window.apiKey;
            
            if (type === 'openai') {
                const baseUrl = (apiConfig?.baseUrl || "https://dashscope.aliyuncs.com/compatible-mode/v1").replace(/\/+$/, "");
                const endpoint = `${baseUrl}/chat/completions`;
                const payload = {
                    model: apiConfig?.model || "qwen-plus",
                    messages: [{ role: "user", content: prompt }]
                };
                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify(payload)
                });
                if (!result.choices || result.choices.length === 0) throw new Error("OpenAI API 未返回有效内容");
                let text = result.choices[0].message.content;
                if (isJson) return window.safeParseJSON(text);
                return text.trim();
            } else {
                const endpoint = getEndpoint(apiConfig);
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let text = getCandidateText(result);
                if (isJson) return window.safeParseJSON(text);
                return text.trim();
            }
        };

        const callGeminiFullTranslation = async (fullText, apiConfig) => {
            const prompt = `你是一名深谙政经语境的高级翻译官。请将以下英文文章逐段精翻成中文。
要求：
1. 必须符合中文新闻语感，精准翻译政经/法律术语。
2. 绝对保持与原文完全一致的段落数量。段落与段落之间使用双换行符严格分隔，绝不能合并段落！
3. 仅输出纯中文译文，绝不附加任何开场白、解析或多余的标点。
原文：\n"${fullText}"`;
            return await callLLM(prompt, apiConfig, false);
        };

        const callGeminiTranslation = async (text, apiConfig) => {
            const prompt = `你是一名深谙政经语境的高级翻译官。请精翻以下段落：\n要求：符合中文新闻语感，精准翻译政经/法律术语。仅输出纯中文译文，绝不附加任何解析。\n原文：\n"${text}"`;
            return await callLLM(prompt, apiConfig, false);
        };

        const callGeminiWordDisambiguation = async (word, context, rawMeaning, apiConfig) => {
            const prompt = `词汇 "${word}" 在字典中的基础释义有：【${rawMeaning}】。
请结合以下原句语境，分析该词在句中的词性，并指出它在此处**最准确的一个中文意思**。请简明扼要陈述理由（50字以内）。
原句："${context}"`;
            return await callLLM(prompt, apiConfig, false);
        };

        const callGeminiIntensiveAnalysis = async (text, apiConfig) => {
            const miniCorpus = getRelevantCorpus(text, REAL_EXAM_CORPUS, 40);
            const prompt = `你是一位考研英语名师。请提取以下段落中所有具有考研语法拆解价值的长难句。
对每一个提取出的长难句：
1. 必须一字不差地摘录原文中的这句长难句作为 originalSentence（不得增删任何标点和空格，必须是原文的完整原句）。
2. 将该句按语法群切片(chunks)。注意：切片内容拼接起来必须与 originalSentence 完全一致！【核心警告】：标注属性(type)严格且只能从以下5个词中选择："主干", "非谓语动词", "介词短语", "从句", "其他"。绝对不允许创造新词！
3. 提供该句型的考研作文实战应用指南(writingTip)。保留你最擅长的模板化写作技巧和句型框架。
4. 核心语法点分析（双轨对比）：
   - 必须基于该句的核心语法点，生成一个【🤖 AI 模拟例句】(aiExample)。
   - 【绝对指令 - 真题原句追踪】(realExamMatch)：你必须扫描下方的《真题语料库》，挑选出一个语法结构最相似的原句作为匹配项。

《真题语料库》：
${JSON.stringify(miniCorpus, null, 2)}

待解析段落：\n"${text}"

务必以纯正的 JSON 格式输出，包含以下结构：
{
  "hasComplexSentence": true,
  "complexSentences": [
    {
      "originalSentence": "...",
      "chunks": [{"text": "...", "type": "主干/非谓语动词/介词短语/从句/其他"}],
      "sentenceTranslation": "...",
      "writingTip": "...",
      "aiExample": {"sentence": "...", "translation": "..."},
      "realExamMatch": {"sentence": "...", "translation": "...", "source": "..."}
    }
  ]
}
只输出 JSON 字符串，不要有多余的标记。`;
            return await callLLM(prompt, apiConfig, true);
        };

        const callGeminiReadingAnalysis = async (text, apiConfig) => {
            const prompt = `你是一名“考研英语阅读命题专家”。请对以下全文文本进行全局分析：
1. 指代分析：明确贯穿全文的核心指代词。
2. 逻辑结构拆解：给这篇文章打上“逻辑标签”并说明论述展开过程。
3. 同义替换映射：列出原文核心关键词及考研等价替换。
4. 选项陷阱识别：预判命题人陷阱。
5. 核心主旨：一句话还原真实意思。

待解析文本：\n"${text}"

务必以纯正的 JSON 格式输出，包含以下结构：
{
  "referenceAnalysis": ["...", "..."],
  "logicalStructure": "...",
  "synonymMapping": [{"keyword": "...", "replacement": "..."}],
  "trapIdentification": "...",
  "coreMeaning": "..."
}
只输出 JSON 字符串，不要有多余的标记。`;
            return await callLLM(prompt, apiConfig, true);
        };

        const callGeminiQuiz = async (text, apiConfig) => {
            const prompt = `根据段落生成一道考研英语阅读理解单项选择题（全英文选项，带解析）：\n"${text}"

务必以纯正的 JSON 格式输出，包含以下结构：
{
  "questionEn": "...",
  "questionZh": "...",
  "options": [
    {"id": "A", "textEn": "...", "textZh": "..."},
    {"id": "B", "textEn": "...", "textZh": "..."},
    {"id": "C", "textEn": "...", "textZh": "..."},
    {"id": "D", "textEn": "...", "textZh": "..."}
  ],
  "correctAnswerId": "A",
  "analysis": "..."
}
只输出 JSON 字符串，不要有多余的标记。`;
            return await callLLM(prompt, apiConfig, true);
        };

        const callGeminiSummary = async (fullText, apiConfig) => {
            const prompt = `提取外刊文章核心主旨，构建3层深度的中英双语逻辑树。直接输出JSON：
{
  "mindmap": {
    "nameEn": "Core topic English", 
    "nameZh": "核心议题中文", 
    "children": [{"nameEn": "...", "nameZh": "...", "children": []}]
  }
}
原文：\n${fullText}`;
            return await callLLM(prompt, apiConfig, true);
        };

        const callGeminiTTS = async (text, apiConfig) => {
            const endpoint = getEndpoint(apiConfig, true);
            const payload = {
                contents: [{ parts: [{ text: `Please read clearly: ${text}` }] }],
                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } },
            };
            const result = await fetchWithRetry(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const base64PCM = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (!base64PCM) throw new Error("API 未返回有效音频数据");
            return createWavFileFromPCM(base64PCM, 24000);
        };

        const createWavFileFromPCM = (base64PCM, sampleRate = 24000) => {
            const binaryString = window.atob(base64PCM);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = bytes.buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + buffer.byteLength, true); writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data'); view.setUint32(40, buffer.byteLength, true);
            const blob = new Blob([wavHeader, buffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        };

        const extractTextFromMedia = async (base64Data, mimeType, apiConfig) => {
            const prompt = "Extract English text accurately. CRITICAL: Fix physical line breaks mid-sentence so paragraphs are continuous. Separate different paragraphs with double newlines strictly. Output ONLY the English text.";
            const type = apiConfig?.apiType || 'gemini';
            const key = apiConfig?.key || window.apiKey;
            let baseUrl = (apiConfig?.baseUrl || "https://generativelanguage.googleapis.com").replace(/\/+$/, "");
            const model = "gemini-2.5-flash"; 
            const endpoint = `${baseUrl}/v1beta/models/${model}:generateContent?key=${key}`;
            
            const result = await fetchWithRetry(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [ { text: prompt }, { inlineData: { mimeType: mimeType, data: base64Data } } ] }] })
            });
            return getCandidateText(result).replace(/(?<!\n)\n(?!\n)/g, ' ');
        };

        // ==========================================
        // 3. UI 子组件
        // ==========================================
        const LogicTreeNode = ({ node, isRoot = false, displayMode }) => {
            if (!node) return null;
            const renderText = () => {
                const mainColor = isRoot ? 'text-white' : 'text-gray-800 dark:text-gray-200'; const subColor = isRoot ? 'text-gray-300' : 'text-gray-500 dark:text-gray-400';
                if (displayMode === 'en') return <span className={`font-serif text-[14px] ${mainColor}`}>{node.nameEn}</span>;

                            {node.children.map((child, idx) => (

                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const WordHighlighter = ({ text, activeDicts, highlightMode, onWordClick }) => {
            const parts = text.split(/([a-zA-Z]+-?[a-zA-Z]*)/g);
            return (
                <Fragment>
                    {parts.map((part, index) => {
                        const match = getLemmaMatches(part, activeDicts);
                        if (match && highlightMode !== 'none' && part.trim().length > 0) {
                            const { translation, type, word: lemma } = match;
                            
                            const isRed = type === 'hard';
                            if (highlightMode === 'red' && !isRed) return <span key={index} className="transition-all">{part}</span>;
                            if (highlightMode === 'blue' && isRed) return <span key={index} className="transition-all">{part}</span>;

                            let bgColor = isRed ? 'bg-red-100/80 dark:bg-red-900/40 border-b-[2px] border-red-300 dark:border-red-700' : 'bg-sky-100/80 dark:bg-sky-900/40 border-b-[2px] border-sky-300 dark:border-sky-700'; 
                            let textColor = isRed ? 'text-red-900 dark:text-red-300' : 'text-[#004b87] dark:text-sky-300';
                            
                            return (
                                <span key={index} onClick={(e) => { e.stopPropagation(); onWordClick({ word: part, lemma, translation, type }); }} className={`mx-[1px] px-[2px] rounded-[3px] cursor-pointer transition-all hover:opacity-80 ${bgColor} ${textColor}`}>
                                    {part}
                                </span>
                            );
                        }
                        return <span key={index} className="transition-all">{part}</span>;
                    })}
                </Fragment>
            );
        };

        const SyntaxBreakdowns = ({ data }) => {
            if (!data || !data.hasComplexSentence || !data.complexSentences || data.complexSentences.length === 0) return null;
            const typeColorMap = { "主干": "bg-amber-100/70 dark:bg-amber-900/30 text-amber-900 dark:text-amber-200 border-amber-200 dark:border-amber-800", "非谓语动词": "bg-blue-100/70 dark:bg-blue-900/30 text-blue-900 dark:text-blue-200 border-blue-200 dark:border-blue-800", "介词短语": "bg-emerald-100/70 dark:bg-emerald-900/30 text-emerald-900 dark:text-emerald-200 border-emerald-200 dark:border-emerald-800", "从句": "bg-rose-100/70 dark:bg-rose-900/30 text-rose-900 dark:text-rose-200 border-rose-200 dark:border-rose-800", "其他": "bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 border-gray-200 dark:border-gray-600" };
            const dotColorMap = { "主干": "bg-amber-400", "非谓语动词": "bg-blue-400", "介词短语": "bg-emerald-400", "从句": "bg-rose-400" };

            return (
                <div className="space-y-6 mt-6">
                    {data.complexSentences.map((sentenceObj, sIdx) => {
                        const { chunks, sentenceTranslation, writingTip, aiExample, realExamMatch, originalSentence } = sentenceObj;
                        return (
                            <div key={sIdx} className="bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-2xl p-5 md:p-6 shadow-sm relative overflow-hidden animate-fade-in-down">
                                <h4 className="text-xs font-bold text-slate-400 dark:text-gray-500 uppercase tracking-widest mb-3">核心难句解构 #{sIdx + 1}</h4>
                                
                                {originalSentence && (
                                    <div className="bg-amber-50/50 dark:bg-amber-900/10 border-l-4 border-amber-400 dark:border-amber-600 pl-4 py-2 mb-5 rounded-r-lg">
                                        <p className="text-[14px] text-amber-900 dark:text-amber-200 font-serif leading-relaxed">{originalSentence}</p>
                                    </div>
                                )}

                                <div className="flex flex-wrap gap-4 mb-5 border-b border-gray-100 dark:border-gray-700 pb-3">
                                    {['主干', '非谓语动词', '介词短语', '从句'].map(type => (
                                        <div key={type} className="flex items-center space-x-1.5"><span className={`w-2 h-2 rounded-full ${dotColorMap[type]}`}></span><span className="text-[11.5px] font-medium text-gray-500 dark:text-gray-400">{type}</span></div>
                                    ))}
                                </div>
                                <div className="leading-[2.8] text-[1.05rem] font-serif text-gray-900 dark:text-gray-200 mb-5">
                                    {chunks?.map((chunk, idx) => chunk.text.trim() ? <span key={idx} className="mr-1.5 mb-2 inline-block"><span className={`px-2.5 py-1 rounded-md border ${typeColorMap[chunk.type] || typeColorMap["其他"]}`}>{chunk.text.trim()}</span></span> : null)}
                                </div>
                                <div className="text-[13.5px] text-gray-600 dark:text-gray-400 leading-relaxed mb-6 text-justify border-l-2 border-gray-300 dark:border-gray-600 pl-3">{sentenceTranslation}</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    <div className="bg-blue-50/50 dark:bg-blue-900/10 border border-blue-100 dark:border-blue-900/50 p-4 rounded-xl flex flex-col justify-between">
                                        <div><div className="flex items-center space-x-2 mb-3"><span className="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">🤖 AI 模拟例句</span></div><p className="text-[13.5px] font-serif text-blue-900 dark:text-blue-300 mb-2 leading-relaxed">"{aiExample?.sentence}"</p></div>
                                        <p className="text-[12px] text-blue-700 dark:text-blue-400 leading-relaxed border-t border-blue-100 dark:border-blue-900/50 pt-2">{aiExample?.translation}</p>
                                    </div>
                                    <div className="bg-emerald-50/50 dark:bg-emerald-900/10 border border-emerald-100 dark:border-emerald-900/50 p-4 rounded-xl flex flex-col justify-between">
                                        <div><div className="flex items-center justify-between mb-3"><span className="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">🏛️ 真题原句追踪</span>{realExamMatch?.source && <span className="text-[10px] text-emerald-800 dark:text-emerald-400 font-bold border-b border-emerald-300 dark:border-emerald-700">{realExamMatch.source}</span>}</div><p className="text-[13.5px] font-serif text-emerald-900 dark:text-emerald-300 mb-2 leading-relaxed">"{realExamMatch?.sentence}"</p></div>
                                        <p className="text-[12px] text-emerald-700 dark:text-emerald-400 leading-relaxed border-t border-emerald-100 dark:border-emerald-900/50 pt-2">{realExamMatch?.translation}</p>
                                    </div>
                                </div>
                                <div className="bg-slate-900 dark:bg-gray-900 p-4 rounded-xl shadow-inner">
                                    <div className="flex items-center space-x-2 mb-2"><svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg><span className="text-[13px] font-bold text-amber-400 tracking-wider">写作提炼法则</span></div>
                                    <div className="text-[13px] text-slate-300 dark:text-gray-300 leading-relaxed text-justify">{writingTip}</div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const escapeRegExp = (string) => {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        };

        const Paragraph = ({ text, activeDicts, readingMode, highlightMode, translationText, isTransLoading, apiConfig, typographyConfig }) => {
            const [showTranslation, setShowTranslation] = useState(false);
            const [localTranslation, setLocalTranslation] = useState("");
            const [isLocalTransLoading, setIsLocalTransLoading] = useState(false);
            
            const [showAnalysis, setShowAnalysis] = useState(false);
            const [analysisData, setAnalysisData] = useState(null);
            const [isAnalysisLoading, setIsAnalysisLoading] = useState(false);
            
            const [audioUrl, setAudioUrl] = useState(null);
            const [isAudioLoading, setIsAudioLoading] = useState(false);
            
            const [showQuiz, setShowQuiz] = useState(false);
            const [quizData, setQuizData] = useState(null);
            const [isQuizLoading, setIsQuizLoading] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            
            const [activeNote, setActiveNote] = useState(null);
            const [isInteracting, setIsInteracting] = useState(false);

            const isConsideredParagraph = text.split(/\s+/).filter(Boolean).length >= 15 && /[.,:;]/.test(text);
            const isPanelOpen = showTranslation || showAnalysis || showQuiz || !!activeNote || isTransLoading || isLocalTransLoading || isAnalysisLoading || isAudioLoading || isQuizLoading || !!audioUrl;
            const showActions = isInteracting || isPanelOpen;

            const handleParagraphClick = (e) => {
                if (window.getSelection() && window.getSelection().toString().length > 0) return;
                if (!isPanelOpen) setIsInteracting(prev => !prev);
            };

            const phraseRegex = useMemo(() => {
                const customPhrases = activeDicts
                    .flatMap(d => Object.keys(d.data || {}))
                    .filter(k => k.includes(' '));
                const allPhrases = [...Object.keys(PHRASE_DB), ...customPhrases].sort((a, b) => b.length - a.length);
                if (allPhrases.length === 0) return null;
                return new RegExp(`\\b(${allPhrases.join('|')})\\b`, 'gi');
            }, [activeDicts]);

            const handleToggleTrans = async (e) => {
                e.stopPropagation(); 
                if (showTranslation) { setShowTranslation(false); return; }
                if (translationText || localTranslation) { setShowTranslation(true); return; } 
                
                setIsLocalTransLoading(true); 
                try {
                    const trans = await callGeminiTranslation(text, apiConfig);
                    setLocalTranslation(trans);
                    setShowTranslation(true);
                } catch (e) {
                    window.showToast(`翻译异常: ${e.message}`, "error");
                } finally {
                    setIsLocalTransLoading(false); 
                }
            };

            const handleToggleAnalysis = async (e) => {
                e.stopPropagation();
                if (showAnalysis) { setShowAnalysis(false); return; }
                if (analysisData) { setShowAnalysis(true); return; }

                setIsAnalysisLoading(true); 
                try {
                    const data = await callGeminiIntensiveAnalysis(text, apiConfig);
                    setAnalysisData(data);
                    setShowAnalysis(true);
                } catch (e) {
                    window.showToast(`句法解构异常: ${e.message}`, "error");
                } finally {
                    setIsAnalysisLoading(false);
                }
            };

            const handleToggleAudio = async (e) => {
                e.stopPropagation();
                if (audioUrl) return; 
                setIsAudioLoading(true); 
                try {
                    const url = await callGeminiTTS(text, apiConfig);
                    setAudioUrl(url); 
                } catch (e) {
                    window.showToast(`语音合成异常: ${e.message}`, "error");
                } finally {
                    setIsAudioLoading(false);
                }
            };

            const handleToggleQuiz = async (e) => {
                e.stopPropagation();
                if (showQuiz) { setShowQuiz(false); return; }
                if (quizData) { setShowQuiz(true); return; }

                setIsQuizLoading(true); 
                try {
                    const data = await callGeminiQuiz(text, apiConfig);
                    setQuizData(data); 
                    setShowQuiz(true);
                } catch (e) {
                    window.showToast(`出题系统异常: ${e.message}`, "error");
                } finally {
                    setIsQuizLoading(false);
                }
            };

            const handleWordClick = (wordInfo) => setActiveNote({ ...wordInfo, isPhrase: false, contextSentence: text });

            const handleDisambiguate = async (noteInfo) => {
                setActiveNote(prev => ({ ...prev, isDisambiguating: true }));
                try {
                    const aiResult = await callGeminiWordDisambiguation(noteInfo.lemma || noteInfo.word, noteInfo.contextSentence, noteInfo.translation, apiConfig);
                    setActiveNote(prev => ({ ...prev, aiContextMeaning: aiResult }));
                } catch (e) {
                    window.showToast(`精准释义超时`, "error");
                } finally {
                    setActiveNote(prev => ({ ...prev, isDisambiguating: false }));
                }
            };

            if (!text.trim()) return null;

            if (readingMode === 'pure') {
                return (
                    <div className="mb-8">
                        <div className="text-gray-900 dark:text-gray-200 text-justify break-words" style={{ fontFamily: typographyConfig.fontFamily, fontSize: `${typographyConfig.fontSize}px`, lineHeight: typographyConfig.lineHeight }}>
                            {text}
                        </div>
                    </div>
                );
            }

            let textSegments = [{ text: text, isTarget: false }];
            if (showAnalysis && analysisData?.complexSentences?.length > 0) {
                analysisData.complexSentences.forEach(compObj => {
                    let target = compObj.originalSentence?.trim();
                    if (!target) return;
                    let newSegments = [];
                    textSegments.forEach(seg => {
                        if (seg.isTarget) {
                            newSegments.push(seg);
                        } else {
                            let idx = seg.text.indexOf(target);
                            let matchedText = target;

                            if (idx === -1) {
                                const escaped = escapeRegExp(target);
                                const flexStr = escaped.replace(/\s+/g, '\\s+').replace(/['’`]/g, "['’`]");
                                try {
                                    const flexRegex = new RegExp(flexStr, 'i');
                                    const match = seg.text.match(flexRegex);
                                    if (match) {
                                        idx = match.index;
                                        matchedText = match[0];
                                    }
                                } catch(e){}
                            }
                            
                            if (idx === -1 && compObj.chunks && compObj.chunks.length > 0) {
                                const firstChunk = compObj.chunks[0].text.trim();
                                const lastChunk = compObj.chunks[compObj.chunks.length - 1].text.trim();
                                if (firstChunk && lastChunk) {
                                    try {
                                        const flexFirst = new RegExp(escapeRegExp(firstChunk).replace(/\s+/g, '\\s+').replace(/['’`]/g, "['’`]"), 'i');
                                        const flexLast = new RegExp(escapeRegExp(lastChunk).replace(/\s+/g, '\\s+').replace(/['’`]/g, "['’`]"), 'i');
                                        
                                        const matchFirst = seg.text.match(flexFirst);
                                        if (matchFirst) {
                                            const startIdx = matchFirst.index;
                                            const remainingText = seg.text.substring(startIdx);
                                            const matchLast = remainingText.match(flexLast);
                                            if (matchLast) {
                                                const endIdx = startIdx + matchLast.index + matchLast[0].length;
                                                matchedText = seg.text.substring(startIdx, endIdx);
                                                idx = startIdx;
                                            }
                                        }
                                    } catch(e){}
                                }
                            }
                            
                            if (idx !== -1) {
                                newSegments.push({ text: seg.text.substring(0, idx), isTarget: false });
                                newSegments.push({ text: seg.text.substring(idx, idx + matchedText.length), isTarget: true });
                                newSegments.push({ text: seg.text.substring(idx + matchedText.length), isTarget: false });
                            } else {
                                newSegments.push(seg);
                            }
                        }
                    });
                    textSegments = newSegments;
                });
            }

            const renderProcessedText = (segmentText, isTarget) => {
                let chunks = phraseRegex ? segmentText.split(phraseRegex) : [segmentText];

                const content = chunks.map((chunk, index) => {
                    const lowerChunk = chunk.toLowerCase();
                    let phraseData = PHRASE_DB[lowerChunk];
                    
                    if (!phraseData) {
                        for (const dict of activeDicts) {
                            if (dict.data && dict.data[lowerChunk]) {
                                phraseData = { trans: dict.data[lowerChunk], type: dict.type };
                                break;
                            }
                        }
                    }

                    if (phraseData && lowerChunk.includes(' ') && highlightMode !== 'none') {
                        const isRed = phraseData.type === 'hard';
                        if (highlightMode === 'red' && !isRed) return <span key={index}>{chunk}</span>;
                        if (highlightMode === 'blue' && isRed) return <span key={index}>{chunk}</span>;

                        const isActive = activeNote && activeNote.word === chunk && activeNote.isPhrase;
                        return (
                            <span key={index} onClick={(e) => { e.stopPropagation(); setActiveNote({ word: chunk, isPhrase: true, trans: phraseData.trans || phraseData.translation, note: phraseData.note, type: phraseData.type }); }} className={`cursor-pointer mx-0.5 border-b-[2px] border-dashed transition-all duration-200 ${isActive ? 'border-sky-400 bg-sky-100/60 text-[#004b87] rounded-sm px-0.5 dark:bg-sky-900/50 dark:border-sky-500 dark:text-sky-200' : 'border-sky-300 hover:border-sky-400 hover:bg-sky-50 text-gray-900 dark:text-gray-200 dark:border-sky-700 dark:hover:bg-sky-900/30'}`}>{chunk}</span>
                        );
                    }
                    return <WordHighlighter key={index} text={chunk} activeDicts={activeDicts} highlightMode={highlightMode} onWordClick={handleWordClick} />;
                });
                return isTarget ? <span className="bg-amber-200/50 dark:bg-amber-900/40 border-b-[2px] border-amber-300/80 dark:border-amber-700 px-[2px] rounded-sm transition-all duration-500 shadow-[0_0_10px_rgba(253,230,138,0.4)] dark:shadow-none">{content}</span> : content;
            };

            const finalTranslationToShow = translationText || localTranslation;

            return (
                <div 
                    className="mb-14 relative group"
                    onMouseEnter={() => setIsInteracting(true)}
                    onMouseLeave={() => setIsInteracting(false)}
                >
                    <div 
                        className="text-gray-900 dark:text-gray-200 text-justify break-words relative z-10 transition-all cursor-pointer md:cursor-auto"
                        style={{ fontFamily: typographyConfig.fontFamily, fontSize: `${typographyConfig.fontSize}px`, lineHeight: typographyConfig.lineHeight }}
                        onClick={handleParagraphClick}
                    >
                        {textSegments.map((seg, i) => <Fragment key={i}>{renderProcessedText(seg.text, seg.isTarget)}</Fragment>)}
                    </div>

                    {activeNote && (
                        <div className="mt-4 p-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl animate-fade-in-down relative shadow-lg z-20">
                            <button onClick={() => setActiveNote(null)} className="absolute top-3 right-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 rounded-full p-1 transition-colors"><svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                            <div className="flex items-center space-x-2 mb-2">
                                <span className={`text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm tracking-wider ${activeNote.type === 'hard' ? 'bg-red-600 dark:bg-red-700' : 'bg-sky-600 dark:bg-sky-700'}`}>{activeNote.isPhrase ? "语法与佳句" : (activeNote.type === 'hard' ? "考研生词" : "词库匹配")}</span>
                                <span className={`font-serif font-bold text-[15px] ${activeNote.type === 'hard' ? 'text-red-800 dark:text-red-400' : 'text-[#004b87] dark:text-sky-300'}`}>{activeNote.word}</span>
                                {activeNote.lemma && activeNote.lemma !== activeNote.word.toLowerCase() && <span className="text-[12px] text-gray-400 dark:text-gray-500 font-mono">({activeNote.lemma})</span>}
                            </div>
                            <div className="text-[13px] font-semibold text-gray-800 dark:text-gray-200 mb-2 whitespace-pre-wrap">{activeNote.translation || activeNote.trans}</div>
                            {activeNote.note && <div className="text-[13.5px] text-gray-700 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-900 p-3 rounded-lg border border-gray-100 dark:border-gray-700">{activeNote.note}</div>}
                            
                            {!activeNote.isPhrase && (
                                <div className="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700">
                                    <button onClick={() => handleDisambiguate(activeNote)} disabled={activeNote.isDisambiguating} className="flex items-center text-[12px] font-medium text-purple-700 dark:text-purple-300 bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 px-3 py-1.5 rounded-lg transition-colors active:scale-95">
                                        {activeNote.isDisambiguating ? "AI 分析语境中..." : "🤖 结合语境精判该词意思"}
                                    </button>
                                    {activeNote.aiContextMeaning && <div className="mt-3 p-3 bg-purple-50/60 dark:bg-purple-900/20 border border-purple-100 dark:border-purple-900/50 rounded-lg text-[13px] text-purple-900 dark:text-purple-200 leading-relaxed animate-fade-in"><span className="font-bold mr-1">精准释义：</span>{activeNote.aiContextMeaning}</div>}
                                </div>
                            )}
                        </div>
                    )}

                    <div className={`flex flex-wrap items-center gap-2 transition-all duration-300 ease-in-out overflow-hidden origin-top ${showActions ? 'max-h-[150px] opacity-100 mt-4 scale-y-100' : 'max-h-0 opacity-0 mt-0 scale-y-95 pointer-events-none'}`}>
                        <button 
                            onClick={handleToggleTrans} 
                            disabled={(isTransLoading || isLocalTransLoading) && !finalTranslationToShow} 
                            className={`flex items-center space-x-1.5 text-[11px] font-medium border px-3.5 py-1.5 rounded-full transition-all ${showTranslation ? 'bg-gray-800 dark:bg-gray-700 text-white border-gray-800 dark:border-gray-600' : 'bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 shadow-sm'}`}
                        >
                            <span className="font-serif italic text-[11px]">文A</span>
                            <span>{(isTransLoading || isLocalTransLoading) && !finalTranslationToShow ? "处理中..." : showTranslation ? "收起精翻" : "展开精翻"}</span>
                        </button>

                        {isConsideredParagraph && (
                            <button onClick={handleToggleAnalysis} disabled={isAnalysisLoading} className={`flex items-center space-x-1.5 text-[11px] font-medium border px-3.5 py-1.5 rounded-full transition-all ${showAnalysis ? 'bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800' : 'bg-white dark:bg-gray-800 text-amber-700 dark:text-amber-500 border-amber-200 dark:border-gray-700 hover:bg-amber-50 dark:hover:bg-gray-700 shadow-sm'}`}>
                                {isAnalysisLoading ? <svg className="animate-spin w-3 h-3 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2-1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>}
                                <span>{isAnalysisLoading ? "智能解构中..." : showAnalysis ? "收起句法" : "长难句解构"}</span>
                            </button>
                        )}
                        {!audioUrl && isConsideredParagraph && (
                             <button onClick={handleToggleAudio} disabled={isAudioLoading} className={`flex items-center space-x-1.5 text-[11px] font-medium border px-3.5 py-1.5 rounded-full transition-all bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 border-blue-200 dark:border-gray-700 hover:bg-blue-50 dark:hover:bg-gray-700 shadow-sm`}>
                                {isAudioLoading ? <svg className="animate-spin w-3 h-3 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <span>🎙️</span> }
                                <span>{isAudioLoading ? "音频请求中..." : "外教领读"}</span>
                             </button>
                        )}
                        {isConsideredParagraph && (
                             <button onClick={handleToggleQuiz} disabled={isQuizLoading} className={`flex items-center space-x-1.5 text-[11px] font-medium border px-3.5 py-1.5 rounded-full transition-all ${showQuiz ? 'bg-purple-100 dark:bg-purple-900/40 text-purple-800 dark:text-purple-300 border-purple-200 dark:border-purple-800' : 'bg-white dark:bg-gray-800 text-purple-600 dark:text-purple-400 border-purple-200 dark:border-gray-700 hover:bg-purple-50 dark:hover:bg-gray-700 shadow-sm'}`}>
                                {isQuizLoading ? <svg className="animate-spin w-3 h-3 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <span>📝</span> }
                                <span>{isQuizLoading ? "预测中..." : showQuiz ? "收起模拟题" : "出题测试"}</span>
                             </button>
                        )}
                    </div>

                    {audioUrl && <div className="mt-3 animate-fade-in-down w-full max-w-sm"><audio src={audioUrl} controls className="h-9 w-full rounded-full" autoPlay /></div>}
                    
                    {showTranslation && finalTranslationToShow && <div className="mt-4 text-gray-800 dark:text-gray-300 font-sans animate-fade-in-down whitespace-pre-wrap border-l-[3px] border-gray-300 dark:border-gray-600 pl-4 py-1 bg-gray-50/50 dark:bg-gray-800/50 rounded-r-lg" style={{ fontSize: `${Math.max(14, typographyConfig.fontSize - 2)}px`, lineHeight: typographyConfig.lineHeight }}>{finalTranslationToShow}</div>}
                    
                    {showAnalysis && analysisData && <SyntaxBreakdowns data={analysisData} />}
                    {showQuiz && quizData && (
                        <div className="mt-4 p-5 bg-purple-50/60 dark:bg-purple-900/10 border border-purple-100 dark:border-purple-900/50 rounded-2xl animate-fade-in-down shadow-sm">
                             <div className="flex items-center space-x-2 mb-4"><span className="bg-purple-600 text-white text-[11px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Reading Comprehension</span></div>
                             <p className="text-[15px] font-serif font-bold text-gray-900 dark:text-gray-100 mb-1">{quizData.questionEn}</p>
                             <p className="text-[12.5px] text-gray-500 dark:text-gray-400 mb-5">{quizData.questionZh}</p>
                             <div className="space-y-2">
                                 {quizData.options.map((opt) => {
                                     const showStatus = selectedOption !== null;
                                     let btnClass = "border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:border-purple-300 dark:hover:border-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/20";
                                     if (showStatus) {
                                         if (opt.id === quizData.correctAnswerId) btnClass = "border-green-400 dark:border-green-600 bg-green-50 dark:bg-green-900/20 text-green-900 dark:text-green-300";
                                         else if (selectedOption === opt.id) btnClass = "border-red-300 dark:border-red-600 bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-300";
                                         else btnClass = "border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-gray-400 dark:text-gray-600";
                                     }
                                     return (
                                         <button key={opt.id} onClick={() => !showStatus && setSelectedOption(opt.id)} disabled={showStatus} className={`w-full text-left p-3 rounded-xl border transition-all duration-200 flex flex-col ${btnClass}`}>
                                             <span className="text-[14px] font-serif font-medium">{opt.id}. {opt.textEn}</span>
                                             {showStatus && <span className="text-[12px] mt-1 opacity-80">{opt.textZh}</span>}
                                         </button>
                                     );
                                 })}
                             </div>
                             {selectedOption && (
                                 <div className="mt-5 p-4 bg-white dark:bg-gray-800 rounded-xl border border-purple-100 dark:border-purple-900/50 animate-fade-in-down">
                                        <div className="flex items-center space-x-2 mb-2">
                                             {selectedOption === quizData.correctAnswerId ? <span className="text-green-600 dark:text-green-400 font-bold text-[14px]">✅ 回答正确</span> : <span className="text-red-500 dark:text-red-400 font-bold text-[14px]">❌ 回答错误 (正确答案: {quizData.correctAnswerId})</span>}
                                        </div>
                                        <div className="text-[13px] text-gray-700 dark:text-gray-300 leading-relaxed text-justify"><span className="font-bold text-purple-700 dark:text-purple-400 mr-1">名师解析：</span>{quizData.analysis}</div>
                                 </div>
                             )}
                        </div>
                    )}
                </div>
            );
        };

        const DEFAULT_API_CONFIG = { apiType: 'gemini', key: '', model: 'gemini-2.0-flash', baseUrl: 'https://generativelanguage.googleapis.com', apiVersion: 'v1beta' };
        const DEFAULT_TYPOGRAPHY_CONFIG = { fontFamily: '"Noto Serif SC", STSong, "Times New Roman", serif', fontSize: 17, lineHeight: 2.4, paddingX: 6, theme: 'light' };
        const LOCAL_STORAGE_KEY = 'yang-reader-state-v1';

        const App = () => {
            const localState = useMemo(() => {
                try {
                    return JSON.parse(window.localStorage.getItem(LOCAL_STORAGE_KEY) || '{}') || {};
                } catch (error) {
                    console.warn('Local state restore failed:', error);
                    return {};
                }
            }, []);

            const persistLocalState = (patch) => {
                try {
                    const previous = JSON.parse(window.localStorage.getItem(LOCAL_STORAGE_KEY) || '{}') || {};
                    window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({ ...previous, ...patch }));
                } catch (error) {
                    console.warn('Local state save failed:', error);
                }
            };

            const [apiConfig, setApiConfig] = useState({ ...DEFAULT_API_CONFIG, ...(localState.apiConfig || {}) });
            const [isApiModalOpen, setIsApiModalOpen] = useState(false);
            const [tempApiConfig, setTempApiConfig] = useState({ ...DEFAULT_API_CONFIG, ...(localState.apiConfig || {}) });

            const [typographyConfig, setTypographyConfig] = useState({ ...DEFAULT_TYPOGRAPHY_CONFIG, ...(localState.typographyConfig || {}) });
            const [isTypographyModalOpen, setIsTypographyModalOpen] = useState(false);
            const [tempTypographyConfig, setTempTypographyConfig] = useState({ ...DEFAULT_TYPOGRAPHY_CONFIG, ...(localState.typographyConfig || {}) });

            const [inputText, setInputText] = useState("");
            const [isReadingMode, setIsReadingMode] = useState(false);
            const [readingMode, setReadingMode] = useState('intensive'); 
            
            const [highlightMode, setHighlightMode] = useState('both'); 
            
            const [fullTranslations, setFullTranslations] = useState([]);
            const [isFullTransLoading, setIsFullTransLoading] = useState(false);

            const [showGlobalLogic, setShowGlobalLogic] = useState(false);
            const [globalLogicData, setGlobalLogicData] = useState(null);
            const [isGlobalLogicLoading, setIsGlobalLogicLoading] = useState(false);

            const [isAnalyzingMap, setIsAnalyzingMap] = useState(false);
            const [fullMapData, setFullMapData] = useState(null);
            const [mapMode, setMapMode] = useState('bilingual'); 
            const [isMapModalOpen, setIsMapModalOpen] = useState(false);
            const [mapScale, setMapScale] = useState(1);

            const [isExtracting, setIsExtracting] = useState(false);
            const fileInputRef = useRef(null);

            const [isDictModalOpen, setIsDictModalOpen] = useState(false);
            const [dictInputText, setDictInputText] = useState("");
            const [customDict, setCustomDict] = useState(localState.customDict || {});
            
            const [presetDict, setPresetDict] = useState({});
            const [hardDict, setHardDict] = useState({});

            const [history, setHistory] = useState(localState.history || []);
            const [isHistoryDrawerOpen, setIsHistoryDrawerOpen] = useState(false);
            const [currentHistoryId, setCurrentHistoryId] = useState(null);
            const [user, setUser] = useState(null);

            const [dbInstance, setDbInstance] = useState(null);
            const [authInstance, setAuthInstance] = useState(null);
            const [corpusCount, setCorpusCount] = useState(0);

            const activeDicts = useMemo(() => [
                { data: hardDict, type: 'hard' },
                { data: customDict, type: 'custom' },
                { data: presetDict, type: 'preset' },
                { data: VOCAB_DB.kaoyan, type: 'default' },
                { data: VOCAB_DB.cet6, type: 'default' }
            ], [hardDict, customDict, presetDict]);
            
            useEffect(() => {
                fetchAndParseCorpus(setCorpusCount);
                fetch(PRESET_DICT_URL).then(r=>r.text()).then(t=>setPresetDict(parseDictText(t))).catch(console.error);
                fetch(HARD_DICT_URL).then(r=>r.text()).then(t=>setHardDict(parseDictText(t))).catch(console.error);
            }, []);

            useEffect(() => {
                let isMounted = true;
                const checkFirebase = setInterval(() => {
                    if (window.firebaseImports && isMounted) {
                        clearInterval(checkFirebase);
                        const { initializeApp, getAuth, getFirestore } = window.firebaseImports;
                        try {
                            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                            if (Object.keys(firebaseConfig).length > 0) {
                                const app = initializeApp(firebaseConfig);
                                setAuthInstance(getAuth(app));
                                setDbInstance(getFirestore(app));
                            }
                        } catch (e) { console.error("Firebase config error"); }
                    }
                }, 100);
                return () => { isMounted = false; clearInterval(checkFirebase); };
            }, []);

            useEffect(() => {
                if (!authInstance || !window.firebaseImports) return;
                const { signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.firebaseImports;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(authInstance, __initial_auth_token);
                        else await signInAnonymously(authInstance);
                    } catch(e) {}
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(authInstance, setUser);
                return () => unsubscribe();
            }, [authInstance]);

            useEffect(() => {
                if (!user || !dbInstance || !window.firebaseImports) return;
                const { collection, doc, onSnapshot } = window.firebaseImports;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                const unsubHistory = onSnapshot(collection(dbInstance, 'artifacts', appId, 'users', user.uid, 'history'), 
                    (snapshot) => {
                        const historyData = snapshot.docs.map(document => ({ id: document.id, ...document.data() }));
                        const sortedHistory = historyData.sort((a, b) => b.createdAt - a.createdAt);
                        setHistory(sortedHistory);
                        persistLocalState({ history: sortedHistory });
                    },
                    (error) => { console.error("History sync error:", error); }
                );

                const unsubDict = onSnapshot(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'dictionary'), 
                    (docSnap) => {
                        if (docSnap.exists()) {
                            const vocab = docSnap.data().vocab || {};
                            setCustomDict(vocab);
                            persistLocalState({ customDict: vocab });
                        }
                    }
                );

                const unsubApi = onSnapshot(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'apiConfig'), 
                    (docSnap) => {
                        if (docSnap.exists()) {
                            const data = { ...DEFAULT_API_CONFIG, ...docSnap.data() };
                            setApiConfig(data);
                            setTempApiConfig(data);
                            persistLocalState({ apiConfig: data });
                        }
                    }
                );

                const unsubTypography = onSnapshot(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'typography'), 
                    (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            // 确保旧数据也有 theme 字段
                            const fullData = { ...DEFAULT_TYPOGRAPHY_CONFIG, ...data };
                            setTypographyConfig(fullData);
                            setTempTypographyConfig(fullData);
                            persistLocalState({ typographyConfig: fullData });
                        }
                    }
                );

                return () => { unsubHistory(); unsubDict(); unsubApi(); unsubTypography(); };
            }, [user, dbInstance]);

            const handleToggleTheme = () => {
                const newTheme = typographyConfig.theme === 'dark' ? 'light' : 'dark';
                const newConfig = { ...typographyConfig, theme: newTheme };
                setTypographyConfig(newConfig);
                setTempTypographyConfig(newConfig);
                persistLocalState({ typographyConfig: newConfig });
                
                if (user && dbInstance && window.firebaseImports) {
                    const { doc, setDoc } = window.firebaseImports;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    setDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'typography'), newConfig, { merge: true }).catch(()=>{});
                }
            };

            const handleSaveApiConfig = async () => {
                setApiConfig(tempApiConfig);
                persistLocalState({ apiConfig: tempApiConfig });
                setIsApiModalOpen(false);
                if (user && dbInstance && window.firebaseImports) {
                    const { doc, setDoc } = window.firebaseImports;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    try {
                        await setDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'apiConfig'), tempApiConfig, { merge: true });
                        window.showToast("API 配置已更新并同步至云端", "success");
                    } catch(e) { window.showToast("同步配置失败", "error"); }
                } else {
                    window.showToast("API 配置已保存到本地", "success");
                }
            };

            const handleSaveTypography = async () => {
                setTypographyConfig(tempTypographyConfig);
                persistLocalState({ typographyConfig: tempTypographyConfig });
                setIsTypographyModalOpen(false);
                if (user && dbInstance && window.firebaseImports) {
                    const { doc, setDoc } = window.firebaseImports;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    try {
                        await setDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'typography'), tempTypographyConfig, { merge: true });
                        window.showToast("排版设置已更新并同步至云端", "success");
                    } catch(e) { window.showToast("排版同步失败", "error"); }
                } else {
                    window.showToast("排版设置已保存到本地", "success");
                }
            };

            const saveHistoryToCloud = async (record) => {
                const normalizedRecord = { ...record, createdAt: record.createdAt || Date.now() };
                setHistory(prevHistory => {
                    const nextHistory = [normalizedRecord, ...prevHistory.filter(item => item.id !== normalizedRecord.id)]
                        .sort((a, b) => b.createdAt - a.createdAt);
                    persistLocalState({ history: nextHistory });
                    return nextHistory;
                });

                if (!user || !dbInstance || !window.firebaseImports) return; 
                const { doc, setDoc } = window.firebaseImports;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                try { await setDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'history', normalizedRecord.id), normalizedRecord, { merge: true }); } catch(e) {}
            };

            const handleSaveCustomDict = async () => {
                if (!dictInputText.trim()) return;
                const newVocab = { ...customDict, ...parseDictText(dictInputText) };
                setCustomDict(newVocab);
                persistLocalState({ customDict: newVocab });
                setIsDictModalOpen(false); 
                setDictInputText("");
                if (user && dbInstance && window.firebaseImports) {
                    const { doc, setDoc } = window.firebaseImports;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    try {
                        await setDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'dictionary'), { vocab: newVocab }, { merge: true });
                        window.showToast("词库已更新并同步至云端", "success");
                    } catch(e) { window.showToast("同步词库失败", "error"); }
                } else {
                    window.showToast("词库已保存到本地", "success");
                }
            };

            const fetchFullTranslation = async (text, recordId) => {
                setIsFullTransLoading(true);
                try {
                    const res = await callGeminiFullTranslation(text, apiConfig);
                    if (res) {
                        const transArray = res.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
                        setFullTranslations(transArray);
                        if (recordId && history.length > 0) {
                            const recordToUpdate = history.find(item => item.id === recordId) || { id: recordId, text };
                            saveHistoryToCloud({ ...recordToUpdate, fullTranslations: transArray });
                        }
                    }
                } catch (e) {
                    window.showToast(`全局翻译被拦截，可点击段落独立精翻。\n(${e.message})`, "warning");
                } finally { setIsFullTransLoading(false); }
            };

            const loadHistoryRecord = (record) => {
                setInputText(record.text);
                setFullMapData(record.fullMapData); 
                setFullTranslations(record.fullTranslations || []);
                setCurrentHistoryId(record.id);
                setIsReadingMode(true);
                setIsHistoryDrawerOpen(false);
                if (!record.fullTranslations || record.fullTranslations.length === 0) {
                    fetchFullTranslation(record.text, record.id);
                }
            };

            const deleteHistoryRecord = async (id, e) => {
                e.stopPropagation();
                setHistory(prevHistory => {
                    const nextHistory = prevHistory.filter(record => record.id !== id);
                    persistLocalState({ history: nextHistory });
                    return nextHistory;
                });
                if (currentHistoryId === id) setCurrentHistoryId(null);

                if (!user || !dbInstance || !window.firebaseImports) return;
                const { doc, deleteDoc } = window.firebaseImports;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                try {
                    await deleteDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'history', id));
                } catch(e) { window.showToast("删除记录失败", "error"); }
            };

            const clearAllHistory = () => {
                const confirmed = window.confirm("确定要清空所有阅读历史吗？");
                if (confirmed) {
                    setHistory([]);
                    persistLocalState({ history: [] });
                    setCurrentHistoryId(null);
                }

                if (confirmed && user && dbInstance && window.firebaseImports) {
                    const { doc, deleteDoc } = window.firebaseImports;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    history.forEach(async (record) => {
                        await deleteDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'history', record.id));
                    });
                    window.showToast("云端记录已清空", "success");
                } else if (confirmed) {
                    window.showToast("本地记录已清空", "success");
                }
            };

            const defaultText = `France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women. Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways. The parliament also agreed to ban websites that "incite excessive thinness" by promoting extreme dieting.`;

            const handleStartReading = () => {
                const finalContent = inputText.trim() || defaultText;
                setInputText(finalContent);
                setIsReadingMode(true);
                setFullMapData(null); 
                setShowGlobalLogic(false);
                setGlobalLogicData(null);
                setFullTranslations([]); 

                const newId = Date.now().toString();
                setCurrentHistoryId(newId);
                const newRecord = { 
                    id: newId, timestamp: new Date().toLocaleString('zh-CN'), 
                    text: finalContent, fullMapData: null, fullTranslations: [], createdAt: Date.now() 
                };
                saveHistoryToCloud(newRecord);
                fetchFullTranslation(finalContent, newId);
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                for (let file of files) {
                    if (file.size > 4 * 1024 * 1024) {
                        window.showToast(`文件 ${file.name} 超过 4MB，为避免卡死请拆分后上传`, "error");
                        return;
                    }
                }
                setIsExtracting(true);
                let combinedText = "";
                try {
                    for (let i = 0; i < files.length; i++) {
                        const base64Data = await new Promise((res) => {
                            const reader = new FileReader();
                            reader.onloadend = () => res(reader.result.split(',')[1]);
                            reader.readAsDataURL(files[i]);
                        });
                        combinedText += (combinedText ? '\n\n' : '') + await extractTextFromMedia(base64Data, files[i].type, apiConfig);
                    }
                    setInputText(prev => prev + (prev ? '\n\n' : '') + combinedText);
                    window.showToast("文件提取成功！请点击进入精读以保存记录", "success");
                } catch (err) { window.showToast(err.message, "error"); }
                setIsExtracting(false);
                if(fileInputRef.current) fileInputRef.current.value = '';
            };
