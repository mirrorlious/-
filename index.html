            const extractPdfTextLocally = async (file) => {
                setIsExtracting(true);
                setPdfExtractionProgress({ current: 0, total: 0 });
                let loadingTask = null;
                let pdfDocument = null;

                try {
                    const pdfjs = await waitForPdfJs();
                    const data = new Uint8Array(await file.arrayBuffer());
                    loadingTask = pdfjs.getDocument({ data });
                    pdfDocument = await loadingTask.promise;
                    setPdfExtractionProgress({ current: 0, total: pdfDocument.numPages });

                    const taskKey = `pdf:${await hashText(`${file.name}:${file.size}:${file.lastModified}`)}`;
                    const savedTask = await readReaderStore('pdf-tasks', taskKey);
                    const extractedParagraphs = savedTask?.paragraphs || [];
                    const completedPages = Math.min(savedTask?.completedPages || 0, pdfDocument.numPages);
                    if (completedPages > 0) setPdfExtractionProgress({ current: completedPages, total: pdfDocument.numPages });
                    for (let pageNumber = completedPages + 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
                        const page = await pdfDocument.getPage(pageNumber);
                        const viewport = page.getViewport({ scale: 1 });
                        const textContent = await page.getTextContent();
                        const lines = pdfItemsToLines(textContent.items, viewport.width);
                        const pageParagraphs = pdfLinesToParagraphs(lines, viewport.width);
                        extractedParagraphs.push(...pageParagraphs);
                        page.cleanup();
                        await writeReaderStore('pdf-tasks', { key: taskKey, fileName: file.name, totalPages: pdfDocument.numPages, completedPages: pageNumber, paragraphs: extractedParagraphs, updatedAt: Date.now() });

                        setPdfExtractionProgress({ current: pageNumber, total: pdfDocument.numPages });
                        if (pageNumber % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
                    }

                    const extractedText = extractedParagraphs.join("\n\n").trim();
                    if (extractedText.length < 80) {
                        throw new Error("这份 PDF 可能是扫描版，未检测到可提取文字。请使用原样阅读。");
                    }

                    setInputText(previous => previous ? `${previous}\n\n${extractedText}` : extractedText);
                    setPendingPdfFile(null);
                    setIsPdfChoiceOpen(false);
                    setIsPdfMode(false);
                    setPdfFile(null);
                    window.showToast(`已在本地重建 ${pdfDocument.numPages} 页、${extractedParagraphs.length} 个段落，文件未上传`, "success");
                    window.requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "auto" }));
                } catch (error) {
                    window.showToast(`PDF 本地提取失败：${error.message}`, "error");
                } finally {
                    setIsExtracting(false);
                    setPdfExtractionProgress({ current: 0, total: 0 });
                    if (pdfDocument) {
                        try { await pdfDocument.destroy(); } catch (error) {}
                    } else if (loadingTask) {

                        const mediaCacheKey = `media:${fileHash}`;

                        if (cachedMedia?.value) {

                            continue;
                        }
                        const base64Data = await new Promise((res) => {
                            const reader = new FileReader();
                            reader.onloadend = () => res(reader.result.split(',')[1]);
                            reader.readAsDataURL(files[i]);
                        });
                        const extractedMediaText = await extractTextFromMedia(base64Data, files[i].type, apiConfig);

                                            </div>
                                            <div className="p-4 text-[13px] text-gray-700 dark:text-gray-300">
                                                {rightPanelTab === 'outline' && (fullMapData?.mindmap ? <LogicTreeNode node={fullMapData.mindmap} isRoot={true} displayMode="bilingual" collapsedNodes={collapsedMapNodes} onToggle={toggleMapNode} /> : <p className="text-gray-400 dark:text-gray-500">Generate the outline from the reader actions.</p>)}
                                                {rightPanelTab === 'analysis' && (globalLogicData ? <div className="space-y-3"><h3 className="font-semibold text-gray-900 dark:text-gray-100">Analysis</h3><p className="leading-relaxed">{globalLogicData.coreMeaning}</p><p className="text-gray-500 dark:text-gray-400">{globalLogicData.logicalStructure}</p></div> : <p className="text-gray-400 dark:text-gray-500">Run full-text analysis to see results here.</p>)}
                                                {rightPanelTab === 'notes' && <textarea className="w-full min-h-[260px] resize-y bg-transparent border border-gray-200 dark:border-gray-700 p-3 outline-none focus:border-gray-500" placeholder="Write local reading notes..." />}
                                            </div>
                                        </div>
                                    </aside>
                                )}
                                </div>
                            )}
                        </main>

                        {isMapModalOpen && fullMapData && (
                            <div className="fixed inset-0 z-[70] bg-[#F3F4F6] dark:bg-gray-900 flex flex-col animate-fade-in" role="dialog" aria-modal="true" aria-label="思维导图全屏">
                                <div className="min-h-14 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex flex-wrap items-center gap-2 px-3 py-2 md:px-6 shadow-sm shrink-0 z-10 sticky top-0">
                                    <div className="flex items-center space-x-1 bg-gray-100 dark:bg-gray-900 p-1 rounded-sm border border-gray-200 dark:border-gray-700">
                                        <button onClick={() => setMapScale(s => Math.max(0.5, s - 0.1))} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-[2px] text-gray-700 dark:text-gray-300 font-bold hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform shadow-sm" aria-label="缩小导图">−</button>
                                        <button onClick={() => setMapScale(1)} className="text-[12px] font-medium w-12 text-center text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200" title="恢复默认大小">{Math.round(mapScale * 100)}%</button>
                                        <button onClick={() => setMapScale(s => Math.min(2, s + 0.1))} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-[2px] text-gray-700 dark:text-gray-300 font-bold hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform shadow-sm" aria-label="放大导图">+</button>
                                    </div>
                                    <button onClick={expandAllMapNodes} className="h-9 px-3 rounded-sm border border-gray-200 dark:border-gray-700 text-[12px] text-gray-600 dark:text-gray-300 hover:border-gray-500">展开全部</button>
                                    <button onClick={collapseAllMapNodes} className="h-9 px-3 rounded-sm border border-gray-200 dark:border-gray-700 text-[12px] text-gray-600 dark:text-gray-300 hover:border-gray-500">收起全部</button>
                                    <div className="ml-auto text-[12px] text-gray-400 hidden md:block">点击分支箭头单独展开或收起</div>
                                    <button onClick={() => setIsMapModalOpen(false)} className="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 rounded-sm text-[13px] font-medium hover:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform">退出全屏</button>
                                </div>
                                <div className="flex-1 overflow-auto p-3 md:p-8 custom-scrollbar">
                                    <div className="max-w-5xl mx-auto transition-transform duration-200 ease-out origin-top" style={{ transform: `scale(${mapScale})` }}>
                                        <div className="bg-white dark:bg-gray-800 p-3 md:p-5 border border-gray-200 dark:border-gray-700">
                                            <LogicTreeNode node={fullMapData.mindmap} isRoot={true} displayMode={mapMode} collapsedNodes={collapsedMapNodes} onToggle={toggleMapNode} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
