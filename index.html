                                             {selectedOption === quizData.correctAnswerId ? <span className="text-green-600 dark:text-green-400 font-bold text-[14px]">✅ 回答正确</span> : <span className="text-red-500 dark:text-red-400 font-bold text-[14px]">❌ 回答错误 (正确答案: {quizData.correctAnswerId})</span>}
                                        </div>
                                        <div className="text-[13px] text-gray-700 dark:text-gray-300 leading-relaxed text-justify"><span className="font-bold text-purple-700 dark:text-purple-400 mr-1">名师解析：</span>{quizData.analysis}</div>
                                 </div>
                             )}
                        </div>
                    )}
                </div>
            );
        };

        const waitForPdfJs = () => {
            if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
            return new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error("PDF 组件加载超时")), 15000);
                window.addEventListener('pdfjs-ready', () => {
                    clearTimeout(timeout);
                    resolve(window.pdfjsLib);
                }, { once: true });
            });
        };

        const PdfReader = ({ file, onClose, onExtract, isExtractingText, extractionProgress }) => {
            const canvasRef = useRef(null);
            const viewerRef = useRef(null);
            const renderTaskRef = useRef(null);
            const [pdfDocument, setPdfDocument] = useState(null);
            const [pageNumber, setPageNumber] = useState(1);
            const [pageCount, setPageCount] = useState(0);
            const [scale, setScale] = useState(1.25);
            const [fitWidth, setFitWidth] = useState(true);
            const [containerWidth, setContainerWidth] = useState(0);
            const [isLoading, setIsLoading] = useState(true);
            const [isRendering, setIsRendering] = useState(false);
            const [error, setError] = useState("");
            const fileUrl = useMemo(() => URL.createObjectURL(file), [file]);

            useEffect(() => () => URL.revokeObjectURL(fileUrl), [fileUrl]);

            useEffect(() => {
                const element = viewerRef.current;
                if (!element || typeof ResizeObserver === 'undefined') return;
                const observer = new ResizeObserver(entries => {
                    const width = entries[0]?.contentRect?.width || 0;
                    if (width) setContainerWidth(width);
                });
                observer.observe(element);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                let isCancelled = false;
                let loadingTask = null;

                const loadPdf = async () => {
                    setIsLoading(true);
                    setError("");
                    try {
                        const pdfjsLib = await waitForPdfJs();
                        const data = new Uint8Array(await file.arrayBuffer());
                        loadingTask = pdfjsLib.getDocument({ data });
                        const documentProxy = await loadingTask.promise;
                        if (isCancelled) {
                            await documentProxy.destroy();
                            return;
                        }
                        setPdfDocument(documentProxy);
                        setPageCount(documentProxy.numPages);
                        setPageNumber(1);
                    } catch (loadError) {
                        if (!isCancelled) setError(loadError.message || "PDF 打开失败");
                    } finally {
                        if (!isCancelled) setIsLoading(false);
                    }
                };

                loadPdf();
                return () => {
                    isCancelled = true;
                    if (renderTaskRef.current) renderTaskRef.current.cancel();
                    if (loadingTask) loadingTask.destroy();
                };
            }, [file]);

            useEffect(() => {
                if (!pdfDocument || !canvasRef.current || !containerWidth) return;
                let isCancelled = false;

                const renderPage = async () => {
                    setIsRendering(true);
                    try {
                        if (renderTaskRef.current) renderTaskRef.current.cancel();
                        const page = await pdfDocument.getPage(pageNumber);
                        const baseViewport = page.getViewport({ scale: 1 });
                        const renderScale = fitWidth ? Math.max(0.35, Math.min(2.5, (containerWidth - 32) / baseViewport.width)) : scale;
                        const viewport = page.getViewport({ scale: renderScale });
                        const canvas = canvasRef.current;
                        const context = canvas.getContext('2d', { alpha: false });
                        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
                        canvas.width = Math.floor(viewport.width * outputScale);
                        canvas.height = Math.floor(viewport.height * outputScale);
                        canvas.style.width = `${Math.floor(viewport.width)}px`;
                        canvas.style.height = `${Math.floor(viewport.height)}px`;
                        const transform = outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0];
                        const renderTask = page.render({ canvasContext: context, viewport, transform });
                        renderTaskRef.current = renderTask;
                        await renderTask.promise;
                    } catch (renderError) {
                        if (renderError?.name !== 'RenderingCancelledException' && !isCancelled) setError(renderError.message || "页面渲染失败");
                    } finally {
                        if (!isCancelled) setIsRendering(false);
                    }
                };

                renderPage();
                return () => {
                    isCancelled = true;
                    if (renderTaskRef.current) renderTaskRef.current.cancel();
                };
            }, [pdfDocument, pageNumber, scale, fitWidth, containerWidth]);

            const goToPage = (nextPage) => {
                const safePage = Math.min(pageCount || 1, Math.max(1, Number(nextPage) || 1));
                setPageNumber(safePage);
                if (viewerRef.current) viewerRef.current.scrollTop = 0;
            };

            const changeScale = (delta) => {
                setFitWidth(false);
                setScale(current => Math.min(3, Math.max(0.5, Number((current + delta).toFixed(2)))));
            };

            return (
                <section className="min-h-[calc(100vh-4rem)] bg-gray-200 dark:bg-gray-950">
                    <div className="sticky top-16 z-30 min-h-[58px] px-2 sm:px-4 py-2 bg-white/95 dark:bg-gray-900/95 backdrop-blur border-b border-gray-200 dark:border-gray-800 flex flex-wrap items-center gap-2">
                        <button onClick={onClose} className="w-10 h-10 grid place-items-center rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="关闭 PDF">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <div className="min-w-0 flex-1 sm:flex-none sm:w-56">
                            <div className="truncate text-[13px] font-semibold text-gray-800 dark:text-gray-100" title={file.name}>{file.name}</div>
                            <div className="text-[11px] text-gray-400">PDF 原样阅读 · 仅本地打开</div>
                        </div>
                        <div className="order-3 sm:order-none w-full sm:w-auto flex items-center justify-center gap-1">
                            <button onClick={() => goToPage(pageNumber - 1)} disabled={pageNumber <= 1} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-30" aria-label="上一页"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg></button>
                            <label className="flex items-center gap-1 text-[12px] text-gray-500 dark:text-gray-400">
                                <input type="number" min="1" max={pageCount || 1} value={pageNumber} onChange={e => goToPage(e.target.value)} className="w-14 h-9 text-center rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 outline-none" aria-label="当前页码" />
                                <span>/ {pageCount || '-'}</span>
                            </label>
                            <button onClick={() => goToPage(pageNumber + 1)} disabled={pageNumber >= pageCount} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-30" aria-label="下一页"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg></button>
                            <span className="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-1"></span>
                            <button onClick={() => changeScale(-0.15)} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="缩小"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 12h12"></path></svg></button>
                            <button onClick={() => setFitWidth(true)} className={`h-10 px-3 rounded-sm text-[12px] font-medium ${fitWidth ? 'bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900' : 'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300'}`}>适宽</button>
                            <button onClick={() => changeScale(0.15)} className="w-10 h-10 grid place-items-center rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="放大"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v12m6-6H6"></path></svg></button>
                        </div>
                        <div className="ml-auto flex items-center gap-1">
                            <button onClick={onExtract} disabled={isExtractingText} className="hidden md:inline-flex h-10 px-3 items-center rounded-md text-[12px] font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-50" title="在浏览器本地逐页提取文字">
                                {isExtractingText ? `本地提取 ${extractionProgress.current}/${extractionProgress.total || '-'}` : "转为精读文本"}
                            </button>
                            <a href={fileUrl} download={file.name} className="w-10 h-10 grid place-items-center rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="下载 PDF" title="下载 PDF"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"></path></svg></a>
                        </div>
                    </div>
                    <div ref={viewerRef} className="relative min-h-[calc(100vh-7.65rem)] overflow-auto px-4 py-6 sm:p-8">
                        {(isLoading || isRendering) && <div className="fixed right-4 bottom-4 z-20 px-3 py-2 rounded-sm bg-gray-900 text-white text-[12px] shadow-lg">{isLoading ? "正在打开 PDF..." : "正在渲染页面..."}</div>}
                        {error ? (
                            <div className="max-w-lg mx-auto mt-16 p-5 bg-white dark:bg-gray-900 border border-red-200 dark:border-red-900 rounded-lg text-center"><div className="font-semibold text-red-600 dark:text-red-400">PDF 无法打开</div><div className="mt-2 text-[13px] text-gray-500 dark:text-gray-400">{error}</div></div>
                        ) : (
                            <canvas ref={canvasRef} className="block mx-auto bg-white shadow-lg" aria-label={`PDF 第 ${pageNumber} 页`}></canvas>
                        )}
                    </div>
                </section>
            );
        };

        const DEFAULT_API_CONFIG = {
            apiType: 'gemini', key: '', model: CURRENT_GEMINI_TEXT_MODEL,
            baseUrl: 'https://generativelanguage.googleapis.com', apiVersion: 'v1beta',
            rememberKey: false,
            taskRoutes: {
                analysis: { model: CURRENT_GEMINI_TEXT_MODEL },
                ocr: { model: CURRENT_GEMINI_TEXT_MODEL },
                tts: { model: CURRENT_GEMINI_TTS_MODEL }
            }
        };
        const DEFAULT_TYPOGRAPHY_CONFIG = {
            preset: 'editorial',
            fontFamily: 'Georgia, "Times New Roman", serif',
            readingFontFamily: 'Georgia, "Times New Roman", serif',
            chineseFontFamily: '"Noto Serif SC", STSong, serif',
            fontSize: 20,
            lineHeight: 1.72,
            paragraphSpacing: 1.05,
            measure: 66,
            paddingX: 6,
            theme: 'light',
            typographyMigrationVersion: 1
        };
        const TYPOGRAPHY_PRESETS = {
            editorial: { readingFontFamily: 'Georgia, "Times New Roman", serif', chineseFontFamily: '"Noto Serif SC", STSong, serif', fontSize: 20, lineHeight: 1.72, paragraphSpacing: 1.05, measure: 66 },
            modern: { readingFontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif', chineseFontFamily: 'system-ui, "Microsoft YaHei", sans-serif', fontSize: 18, lineHeight: 1.65, paragraphSpacing: 0.9, measure: 70 },
            classic: { readingFontFamily: '"Times New Roman", Times, serif', chineseFontFamily: 'STSong, SimSun, serif', fontSize: 21, lineHeight: 1.85, paragraphSpacing: 1.2, measure: 62 },
            custom: {}
        };
        const LOCAL_STORAGE_KEY = 'yang-reader-state-v1';
        const API_KEY_SESSION_STORAGE_KEY = 'yang-reader-api-key-v1';
        const API_KEY_LOCAL_STORAGE_KEY = 'yang-reader-api-key-v1';
        const READER_DB_NAME = 'yang-reader-local-v1';
        const READER_DB_VERSION = 3;
        const CACHE_PROMPT_VERSION = '2026-07-26-v1';

        const openReaderDb = () => new Promise((resolve) => {
            if (!window.indexedDB) { resolve(null); return; }
            const request = window.indexedDB.open(READER_DB_NAME, READER_DB_VERSION);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains('ai-cache')) db.createObjectStore('ai-cache', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('tts-cache')) db.createObjectStore('tts-cache', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('pdf-tasks')) db.createObjectStore('pdf-tasks', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('book-imports')) db.createObjectStore('book-imports', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('book-articles')) db.createObjectStore('book-articles', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('article-bundles')) db.createObjectStore('article-bundles', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('batch-analysis-jobs')) db.createObjectStore('batch-analysis-jobs', { keyPath: 'key' });
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve(null);
        });

        const readReaderStore = async (storeName, key) => {
            const db = await openReaderDb();
            if (!db) return null;
            return new Promise(resolve => {
                const request = db.transaction(storeName, 'readonly').objectStore(storeName).get(key);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => resolve(null);
            });
        };

        const writeReaderStore = async (storeName, value) => {
            const db = await openReaderDb();
            if (!db) return false;
            return new Promise(resolve => {
                const request = db.transaction(storeName, 'readwrite').objectStore(storeName).put(value);
                request.onsuccess = () => resolve(true);
                request.onerror = () => resolve(false);
            });
        };

        const deleteReaderStore = async (storeName, key) => {
            const db = await openReaderDb();
            if (!db) return false;
            return new Promise(resolve => {
                const request = db.transaction(storeName, 'readwrite').objectStore(storeName).delete(key);
                request.onsuccess = () => resolve(true);
                request.onerror = () => resolve(false);
            });
        };

        const readAllReaderStore = async (storeName) => {
            const db = await openReaderDb();
            if (!db || !db.objectStoreNames.contains(storeName)) return [];
            return new Promise(resolve => {
                const request = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
                request.onsuccess = () => resolve(Array.isArray(request.result) ? request.result : []);
                request.onerror = () => resolve([]);
            });
        };

        const hashText = async (value) => {
            const bytes = new TextEncoder().encode(value);
            if (window.crypto?.subtle) {
                const digest = await window.crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
            }
            return btoa(unescape(encodeURIComponent(value))).slice(0, 64);
        };

        const hashBytes = async (bytes) => {
            if (window.crypto?.subtle) {
                const digest = await window.crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
            }
            return hashText(String(bytes.byteLength));
        };

        const buildCacheKey = async (kind, input, config = {}, options = {}) => {
            const identity = JSON.stringify({ kind, input, model: config.model || '', apiType: config.apiType || '', baseUrl: config.baseUrl || '', promptVersion: CACHE_PROMPT_VERSION, options });
            return `${kind}:${await hashText(identity)}`;
        };

        const getStoredApiKey = (legacyKey = '') => {
            try {
                const sessionKey = window.sessionStorage.getItem(API_KEY_SESSION_STORAGE_KEY);
                if (sessionKey) return sessionKey;
                const rememberedKey = window.localStorage.getItem(API_KEY_LOCAL_STORAGE_KEY);
                if (rememberedKey) return rememberedKey;
                if (legacyKey) {
                    window.sessionStorage.setItem(API_KEY_SESSION_STORAGE_KEY, legacyKey);
                    try {
                        const state = JSON.parse(window.localStorage.getItem(LOCAL_STORAGE_KEY) || '{}') || {};
                        if (state.apiConfig?.key) {
                            const { key, ...safeApiConfig } = state.apiConfig;
                            state.apiConfig = safeApiConfig;
                            window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
                        }
                    } catch (error) { console.warn('Legacy API Key cleanup failed'); }
                    return legacyKey;
                }
            } catch (error) { console.warn('API Key restore failed'); }
            return '';
        };

        const sanitizeApiConfig = (config = {}) => {
            const { key, ...safeConfig } = config;
            return { ...safeConfig, key: '' };
        };

        const persistApiKey = (config = {}) => {
            try {
                const key = String(config.key || '').trim();
                if (key) window.sessionStorage.setItem(API_KEY_SESSION_STORAGE_KEY, key);
                else window.sessionStorage.removeItem(API_KEY_SESSION_STORAGE_KEY);
                if (config.rememberKey && key) window.localStorage.setItem(API_KEY_LOCAL_STORAGE_KEY, key);
                else window.localStorage.removeItem(API_KEY_LOCAL_STORAGE_KEY);
            } catch (error) { console.warn('API Key save failed'); }
        };

        const resolveTaskApiConfig = (config = {}, task = 'analysis') => {
            const route = config.taskRoutes?.[task] || {};
            return normalizeApiConfig({ ...config, ...route, key: getStoredApiKey(config.key) });
        };
        const formatFileSize = (bytes) => {
            if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        };

        const median = (values) => {
            const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
            if (sorted.length === 0) return 0;
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
        };

        const cleanPdfText = (text) => text
            .replace(/\s+/g, " ")
            .replace(/\s+([,.;:!?%)\]}])/g, "$1")
            .replace(/([([{])\s+/g, "$1")
            .replace(/([A-Za-z])([’'])\s+([A-Za-z]{1,2})\b/g, "$1$2$3")
            .trim();

        const pdfItemsToLines = (items, pageWidth) => {
            const lines = [];
            let currentLine = null;

            const flushLine = () => {
                if (currentLine?.text?.trim()) {
                    const text = cleanPdfText(currentLine.text);
                    if (text) lines.push({ ...currentLine, text, width: Math.max(0, currentLine.right - currentLine.x) });
                }
                currentLine = null;
            };

            items.forEach(item => {
                const rawText = typeof item.str === "string" ? item.str.trim() : "";
                const x = Number(item.transform?.[4]) || 0;
                const y = Number(item.transform?.[5]) || 0;
                const fontSize = Math.max(1, Math.abs(Number(item.transform?.[3])) || Number(item.height) || 10);
                const itemWidth = Math.max(0, Number(item.width) || 0);

                if (currentLine) {
                    const baselineChanged = Math.abs(y - currentLine.y) > Math.max(2, Math.min(fontSize, currentLine.fontSize) * 0.45);
                    const separatedColumn = !baselineChanged && x - currentLine.right > Math.max(18, pageWidth * 0.035);
                    if (baselineChanged || separatedColumn) flushLine();
                }

                if (rawText) {
                    if (!currentLine) {
                        currentLine = { text: "", x, y, right: x, fontSize };
                    }
                    const needsSpace = currentLine.text &&
                        !/[\s-]$/.test(currentLine.text) &&
                        !/^[,.;:!?%)\]}]/.test(rawText);
                    currentLine.text += `${needsSpace ? " " : ""}${rawText}`;
                    currentLine.x = Math.min(currentLine.x, x);
                    currentLine.right = Math.max(currentLine.right, x + itemWidth);
                    currentLine.fontSize = Math.max(currentLine.fontSize, fontSize);
                }

                if (item.hasEOL) flushLine();
            });
            flushLine();
            return lines;
        };

        const joinPdfLines = (lines) => cleanPdfText(lines.reduce((text, line) => {
            if (!text) return line.text;
            if (/[A-Za-z]-$/.test(text) && /^[a-z]/.test(line.text)) {
                return `${text.slice(0, -1)}${line.text}`;
            }
            return `${text} ${line.text}`;
        }, ""));

        const pdfLinesToParagraphs = (lines, pageWidth) => {
            if (lines.length === 0) return [];
            const bodyLines = lines.filter(line => line.text.split(/\s+/).length >= 5);
            const typicalFont = median((bodyLines.length ? bodyLines : lines).map(line => line.fontSize)) || 10;
            const typicalWidth = median((bodyLines.length ? bodyLines : lines).map(line => line.width)) || pageWidth * 0.28;
            const paragraphs = [];
            let current = [];

            const flushParagraph = () => {
                const paragraph = joinPdfLines(current);
                if (paragraph) paragraphs.push(paragraph);
                current = [];
            };

            lines.forEach((line, index) => {
                const previous = lines[index - 1];
                const next = lines[index + 1];
                const wordCount = line.text.split(/\s+/).filter(Boolean).length;
                const isHeading = line.fontSize > typicalFont * 1.18 ||
                    (wordCount <= 12 && line.fontSize > typicalFont * 1.08 && line.width < typicalWidth * 0.82 && !/[.!?;:]\s*[”"')\]]?$/.test(line.text));
                const previousIsHeading = previous && (previous.fontSize > typicalFont * 1.2);
                const columnReset = previous && line.y > previous.y + typicalFont * 1.35;
                const sideBySideColumn = previous && Math.abs(line.y - previous.y) < typicalFont * 0.8 && Math.abs(line.x - previous.x) > pageWidth * 0.16;
                const verticalGap = previous && previous.y > line.y && previous.y - line.y > typicalFont * 1.65;
                const startsIndented = next && line.y > next.y && Math.abs(line.x - next.x) < pageWidth * 0.08 && line.x - next.x > typicalFont * 1.2;
                const previousEndsParagraph = previous && previous.width < typicalWidth * 0.76 && /[.!?][”"')\]]?$/.test(previous.text);
                const startsListItem = /^(?:[•▪●]|\d{1,2}[.)]|[A-Z][.)])\s+/.test(line.text);
                const startsNewParagraph = current.length > 0 && (
                    isHeading || previousIsHeading || columnReset || sideBySideColumn || verticalGap || startsIndented || previousEndsParagraph || startsListItem
                );

                if (startsNewParagraph) flushParagraph();
                current.push(line);
                if (isHeading) flushParagraph();
            });
            flushParagraph();
            return paragraphs;
        };

        const getModelSafeText = (text, maxChars, actionLabel) => {
            const normalized = text.trim();
            if (normalized.length <= maxChars) return normalized;
            const candidates = [
                normalized.lastIndexOf(". ", maxChars),
                normalized.lastIndexOf("? ", maxChars),
                normalized.lastIndexOf("! ", maxChars)
            ];
            const sentenceCut = Math.max(...candidates);
            const cutAt = sentenceCut > maxChars * 0.6 ? sentenceCut + 1 : normalized.lastIndexOf(" ", maxChars);
            window.showToast(`${actionLabel}仅使用当前段落前 ${Math.round(maxChars / 1000)}k 字符，避免请求过长`, "warning");
            return normalized.slice(0, Math.max(1, cutAt)).trim();
        };

        const splitTextIntoChunks = (text, maxChars = 12000) => {
            const normalized = String(text || '').trim();
            if (!normalized) return [];
            const chunks = [];
            let remaining = normalized;
            while (remaining.length > maxChars) {
                const boundary = Math.max(remaining.lastIndexOf('\n\n', maxChars), remaining.lastIndexOf('. ', maxChars));
                const cutAt = boundary > maxChars * 0.55 ? boundary + (remaining[boundary] === '.' ? 1 : 0) : remaining.lastIndexOf(' ', maxChars);
                const safeCut = cutAt > 0 ? cutAt : maxChars;
                chunks.push(remaining.slice(0, safeCut).trim());
                remaining = remaining.slice(safeCut).trim();
            }
            if (remaining) chunks.push(remaining);
            return chunks;
        };

        const normalizeBookText = (text) => String(text || '')
            .replace(/\u00ad/g, '')
            .replace(/[ \t]+/g, ' ')
            .replace(/\n{3,}/g, '\n\n')
            .trim();

        const isLikelyContentsPage = (text) => {
            const normalized = normalizeBookText(text);
            const lines = normalized.split('\n').filter(Boolean);
            const dottedOrNumbered = lines.filter(line => /\.{3,}\s*\d+$/.test(line) || /.+\s+\d{1,4}$/.test(line)).length;
            return /\b(table of contents|contents)\b/i.test(normalized) || /目录|目\s*录/.test(normalized) || (lines.length >= 6 && dottedOrNumbered / lines.length > 0.45);
        };

        const isLikelyCoverOrNoisePage = (text) => {
            const normalized = normalizeBookText(text);
            const words = normalized.match(/[A-Za-z\u4e00-\u9fff]+/g) || [];
            const letters = (normalized.match(/[A-Za-z\u4e00-\u9fff]/g) || []).length;
            const digits = (normalized.match(/\d/g) || []).length;
            return words.length < 18 || letters < 60 || (digits > letters * 0.75 && words.length < 80);
        };

        const getHeadingCandidate = (text) => {
            const lines = normalizeBookText(text).split(/\n+/).map(line => line.trim()).filter(Boolean);
            for (const line of lines.slice(0, 8)) {
                const words = line.split(/\s+/).filter(Boolean);
                if (words.length < 2 || words.length > 18 || line.length > 150) continue;
                if (/[.!?;:]$/.test(line)) continue;
                const alphaWords = words.filter(word => /[A-Za-z]/.test(word));
                const titleCase = alphaWords.filter(word => /^[A-Z][A-Za-z'’-]*$/.test(word)).length;
                if (/^(chapter|part|section|article)\b/i.test(line) || /^(第[一二三四五六七八九十百\d]+[章节篇部])/.test(line) || (alphaWords.length >= 2 && titleCase / alphaWords.length >= 0.55)) return line;
            }
            return '';
        };

        const segmentBookPages = (pages = []) => {
            const ignored = [];
            const useful = [];
            pages.forEach(page => {
                const text = normalizeBookText(page.text);
                if (isLikelyContentsPage(text)) ignored.push({ ...page, reason: '目录页' });
                else if (isLikelyCoverOrNoisePage(text)) ignored.push({ ...page, reason: '封面、插图或低信息页' });
                else useful.push({ ...page, text, heading: getHeadingCandidate(text) });
            });

            const articles = [];
            let current = null;
            const flush = () => {
                if (!current) return;
                const text = normalizeBookText(current.pages.map(page => page.text).join('\n\n'));
                const wordCount = (text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)?|\p{Script=Han}/gu) || []).length;
                if (wordCount >= 80) {
                    articles.push({
                        id: `article-${articles.length + 1}`,
                        title: current.title || `未命名文章 ${articles.length + 1}`,
                        pageStart: current.pages[0].pageNumber,
                        pageEnd: current.pages[current.pages.length - 1].pageNumber,
                        text,
                        wordCount,
                        selected: true
                    });
                }
                current = null;
            };

            useful.forEach(page => {
                const currentWords = current ? current.pages.reduce((sum, item) => sum + (item.text.match(/\S+/g) || []).length, 0) : 0;
                const startsNew = Boolean(page.heading) && current && currentWords >= 220;
                if (startsNew) flush();
                if (!current) current = { title: page.heading || '', pages: [] };
                if (!current.title && page.heading) current.title = page.heading;
                current.pages.push(page);
            });
            flush();

            if (articles.length === 1 && articles[0].wordCount > 4500) {
                const source = articles[0];
                const blocks = source.text.split(/\n{2,}/);
                const splitArticles = [];
                let buffer = [];
                let title = source.title;
                const pushBuffer = () => {
                    const body = normalizeBookText(buffer.join('\n\n'));
                    const count = (body.match(/[A-Za-z]+(?:['’-][A-Za-z]+)?|\p{Script=Han}/gu) || []).length;
                    if (count >= 180) splitArticles.push({ title, text: body, wordCount: count });
                    buffer = [];
                };
                blocks.forEach(block => {
                    const heading = getHeadingCandidate(block);
                    const currentCount = (buffer.join(' ').match(/\S+/g) || []).length;
                    if (heading && currentCount >= 220) {
                        pushBuffer();
                        title = heading;
                    }
                    buffer.push(block);
                });
                pushBuffer();
                if (splitArticles.length > 1) {
                    return {
                        ignored,
                        articles: splitArticles.map((item, index) => ({
                            id: `article-${index + 1}`,
                            title: item.title || `未命名文章 ${index + 1}`,
                            pageStart: source.pageStart,
                            pageEnd: source.pageEnd,
                            text: item.text,
                            wordCount: item.wordCount,
                            selected: true
                        }))
                    };
                }
            }
            return { ignored, articles };
        };


        const ARTICLE_BUNDLE_SCHEMA_VERSION = 1;
        const ARTICLE_BUNDLE_BLOCK_LANGUAGE = 'yang-reader-data';
        const getArticleBundleKey = (articleId) => `article:${articleId}`;

        const inferArticleTitleFromText = (sourceText, fallback = '未命名文章') => {
            const lines = String(sourceText || '').split(/\n+/).map(line => line.trim()).filter(Boolean);
            const candidate = lines.find(line => line.length >= 4 && line.length <= 160 && line.split(/\s+/).length <= 24);
            return candidate || fallback;
        };

        const safeDownloadFileName = (value, fallback = 'yang-reader-article') => {
            const cleaned = String(value || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim();
            return (cleaned || fallback).slice(0, 100);
        };

        const encodeUtf8Base64 = (value) => {
            const bytes = new TextEncoder().encode(String(value || ''));
            let binary = '';
            for (let offset = 0; offset < bytes.length; offset += 0x8000) {
                binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
            }
            return btoa(binary);
        };

        const decodeUtf8Base64 = (value) => {
            const binary = atob(String(value || '').replace(/\s+/g, ''));
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
            return new TextDecoder().decode(bytes);
        };

        const downloadTextFile = (fileName, content, mimeType = 'text/markdown;charset=utf-8') => {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1200);
        };

        const mindMapToMarkdown = (node, depth = 0) => {
            if (!node) return '';
            const title = [node.nameEn, node.nameZh].filter(Boolean).join(' / ') || '未命名节点';
            const line = `${'  '.repeat(depth)}- ${title}`;
            const children = Array.isArray(node.children) ? node.children : [];
            return [line, ...children.map(child => mindMapToMarkdown(child, depth + 1))].filter(Boolean).join('\n');
        };

        const logicToMarkdown = (logic) => {
            if (!logic) return '';
            const blocks = [];
            if (logic.coreMeaning) blocks.push(`### 核心主旨\n\n${logic.coreMeaning}`);
            if (logic.logicalStructure) blocks.push(`### 逻辑结构\n\n${logic.logicalStructure}`);

            if (Array.isArray(logic.synonymMapping) && logic.synonymMapping.length) blocks.push(`### 同义替换\n\n${logic.synonymMapping.map(item => `- ${item.keyword || ''} → ${item.replacement || ''}`).join('\n')}`);
            if (logic.trapIdentification && logic.trapIdentification !== '无') blocks.push(`### 命题陷阱\n\n${logic.trapIdentification}`);

                const options = Array.isArray(quiz.options) ? quiz.options.map(option => `- ${option.id || ''}. ${option.textEn || ''}${option.textZh ? ` / ${option.textZh}` : ''}`).join('\n') : '';
                return [
                    `### ${heading}${questions.length > 1 ? ` ${index + 1}` : ''}`,
                    quiz.questionEn || '',
                    quiz.questionZh || '',
                    options,
                    quiz.correctAnswerId ? `**答案：${quiz.correctAnswerId}**` : '',
                    quiz.analysis ? `**解析：** ${quiz.analysis}` : ''
                ].filter(Boolean).join('\n\n');

            ].filter(Boolean).join('\n\n');
            const payload = encodeUtf8Base64(JSON.stringify({ ...bundle, schemaVersion: ARTICLE_BUNDLE_SCHEMA_VERSION }));
            return `${humanReadable}\n\n\`\`\`${ARTICLE_BUNDLE_BLOCK_LANGUAGE}\n${payload}\n\`\`\`\n`;

            }

            const getRecordSourceText = async (record) => {

            const updateHistoryBundleMeta = (articleId, bundle) => {
                setHistory(previous => {
                    const existing = previous.find(item => item.id === articleId) || {
                        id: articleId,
                        timestamp: new Date().toLocaleString('zh-CN'),
                        createdAt: bundle.article?.createdAt || Date.now()
                    };
                    const record = {
                        ...existing,
                        title: bundle.article?.title || existing.title,
                        preview: String(bundle.article?.sourceText || '').slice(0, 180),
                        bundleKey: bundle.key,
                        hasFullTranslations: Boolean(bundle.results?.fullTranslations?.length),
                        hasGlobalLogic: Boolean(bundle.results?.globalLogicData),
                        hasFullMap: Boolean(bundle.results?.fullMapData),
                        hasFullQuiz: Boolean(bundle.results?.fullQuizData),
                        updatedAt: Date.now()
                    };
                    const next = [record, ...previous.filter(item => item.id !== articleId)].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    persistLocalState({ history: next });
                    return next;
                });

            const buildCurrentArticleBundle = async () => {
                if (!currentHistoryId) return null;
                const record = history.find(item => item.id === currentHistoryId) || { id: currentHistoryId, createdAt: Date.now() };
                const sourceText = inputText || await getRecordSourceText(record);
                const base = await buildBundleFromRecord(record, sourceText);
                const notes = readingNotes.articles?.[currentHistoryId] || { documentNote: '', annotations: [] };
                return {
                    ...base,
                    article: {
                        ...base.article,
                        title: record.title || base.article.title || inferArticleTitleFromText(sourceText),
                        sourceText,
                        updatedAt: Date.now(),
                        contentHash: sourceText ? await hashText(sourceText) : ''
                    },
                    results: {
                        fullTranslations,
                        globalLogicData,
                        fullMapData,
                        fullQuizData,

                    },
                    notes: {
                        documentNote: notes.documentNote || '',

                    },
                    metadata: {
                        ...(base.metadata || {}),
                        model: apiConfig.model || '',
                        apiType: apiConfig.apiType || '',
                        promptVersion: CACHE_PROMPT_VERSION,
                        updatedAt: Date.now()
                    }

            const persistCurrentArticleBundle = async (options = {}) => {
                const bundle = await buildCurrentArticleBundle();

            const handlePersistParagraphResult = (result) => {
                if (!result || !Number.isFinite(result.paragraphIndex)) return;
                setParagraphResults(previous => {
                    const index = String(result.paragraphIndex);
                    const current = previous[index] || { sourceText: result.sourceText || '' };
                    const next = { ...current, sourceText: result.sourceText || current.sourceText || '', updatedAt: Date.now() };
                    if (result.kind === 'paragraph-translation') next.translation = result.data?.translation || '';
                    if (result.kind === 'paragraph-analysis') next.analysis = result.data || null;
                    if (result.kind === 'paragraph-quiz') next.quiz = result.data || null;
                    return { ...previous, [index]: next };

            useEffect(() => {

                const timer = window.setTimeout(() => {

            const restoreBundleNotes = (articleId, notes) => {

                    const next = {

                            }

            const downloadCurrentArticleMarkdown = async () => {
                setIsFullTextMenuOpen(false);
                const bundle = await persistCurrentArticleBundle();

            const importMarkdownFiles = async (files) => {
                const markdownFiles = Array.from(files || []).filter(file => /\.md$/i.test(file.name) || /markdown/i.test(file.type));
                if (!markdownFiles.length) return;
                const importedBundles = [];
                for (let fileIndex = 0; fileIndex < markdownFiles.length; fileIndex += 1) {
                    const file = markdownFiles[fileIndex];
                    const markdown = await file.text();
                    const parsedBundles = parseYangReaderMarkdown(markdown);
                    if (parsedBundles.length) {
                        importedBundles.push(...parsedBundles);
                    } else {
                        const sourceText = stripYangReaderDataBlocks(markdown)
                            .replace(/^---[\s\S]*?---\s*/m, '')
                            .replace(/^#\s+.+$/m, '')
                            .trim();
                        if (!sourceText) continue;
                        const id = `md-${Date.now()}-${fileIndex}`;
                        importedBundles.push({
                            key: getArticleBundleKey(id),
                            schemaVersion: ARTICLE_BUNDLE_SCHEMA_VERSION,
                            article: {
                                id,
                                title: (markdown.match(/^#\s+(.+)$/m)?.[1] || file.name.replace(/\.md$/i, '') || inferArticleTitleFromText(sourceText)).trim(),
                                sourceText,
                                sourceType: 'markdown',
                                sourceName: file.name,
                                createdAt: Date.now(),
                                updatedAt: Date.now(),
                                contentHash: await hashText(sourceText)
                            },
                            results: { fullTranslations: [], globalLogicData: null, fullMapData: null, fullQuizData: null, paragraphResults: {}, activeAnalysis: null },
                            notes: { documentNote: '', annotations: [] },
                            metadata: { importedAt: Date.now(), promptVersion: CACHE_PROMPT_VERSION }
                        });
                    }
                }
                if (!importedBundles.length) {
                    window.showToast('Markdown 中没有可恢复的文章内容', 'warning');
                    return;
                }

                const records = [];
                const notePatches = {};
                for (let index = 0; index < importedBundles.length; index += 1) {
                    const source = importedBundles[index];
                    const originalId = source.article?.id || `md-${Date.now()}-${index}`;
                    const conflict = history.some(item => item.id === originalId);
                    let articleId = originalId;
                    if (conflict) {
                        const replaceExisting = window.confirm(`阅读库中已存在“${source.article?.title || originalId}”。\n确定：替换现有文章；取消：另存为副本。`);
                        if (!replaceExisting) articleId = `${originalId}-copy-${Date.now()}-${index}`;
                    }
                    const bundle = {
                        ...source,
                        key: getArticleBundleKey(articleId),
                        schemaVersion: ARTICLE_BUNDLE_SCHEMA_VERSION,
                        article: {
                            ...(source.article || {}),
                            id: articleId,
                            title: source.article?.title || inferArticleTitleFromText(source.article?.sourceText),
                            updatedAt: Date.now(),
                            contentHash: source.article?.contentHash || await hashText(source.article?.sourceText || '')
                        },
                        results: {
                            fullTranslations: source.results?.fullTranslations || [],
                            globalLogicData: source.results?.globalLogicData || null,
                            fullMapData: source.results?.fullMapData || null,
                            fullQuizData: source.results?.fullQuizData || null,
                            paragraphResults: source.results?.paragraphResults || {},
                            activeAnalysis: source.results?.activeAnalysis || null
                        },
                        notes: {
                            documentNote: source.notes?.documentNote || '',
                            annotations: Array.isArray(source.notes?.annotations) ? source.notes.annotations : []
                        },
                        metadata: { ...(source.metadata || {}), importedAt: Date.now() }
                    };
                    await writeReaderStore('article-bundles', bundle);
                    notePatches[articleId] = bundle.notes;
                    records.push({
                        id: articleId,
                        title: bundle.article.title,
                        preview: bundle.article.sourceText.slice(0, 180),
                        sourceType: 'markdown',
                        sourceName: bundle.article.sourceName || '',
                        bundleKey: bundle.key,
                        timestamp: new Date().toLocaleString('zh-CN'),
                        createdAt: bundle.article.createdAt || Date.now() - index,
                        hasFullTranslations: Boolean(bundle.results.fullTranslations?.length),
                        hasGlobalLogic: Boolean(bundle.results.globalLogicData),
                        hasFullMap: Boolean(bundle.results.fullMapData),
                        hasFullQuiz: Boolean(bundle.results.fullQuizData)
                    });
                }

                setReadingNotes(previous => {
                    const next = { version: 1, articles: { ...(previous.articles || {}), ...notePatches } };
                    persistLocalState({ readingNotes: next });
                    return next;
                });
                setHistory(previous => {
                    const recordIds = new Set(records.map(record => record.id));
                    const next = [...records, ...previous.filter(item => !recordIds.has(item.id))].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    persistLocalState({ history: next });
                    return next;
                });
                window.showToast(`已从 Markdown 恢复 ${records.length} 篇文章`, 'success');
                if (records[0]) await loadHistoryRecord(records[0]);
            };

            const handleMarkdownUpload = async (event) => {
                try {
                    await importMarkdownFiles(event.target.files);
                } catch (error) {
                    window.showToast(`Markdown 导入失败：${error.message}`, 'error');
                } finally {
                    if (event.target) event.target.value = '';
                }
            };

            const toggleLibrarySelection = (articleId) => {
                setSelectedLibraryIds(previous => previous.includes(articleId) ? previous.filter(id => id !== articleId) : [...previous, articleId]);
            };

            const toggleLibrarySelectionMode = () => {
                setLibrarySelectionMode(previous => {
                    if (previous) setSelectedLibraryIds([]);
                    return !previous;
                });
            };

            const loadBundleForRecord = async (record) => {
                const stored = await readReaderStore('article-bundles', record.bundleKey || getArticleBundleKey(record.id));
                if (stored?.article?.sourceText) return stored;
                const bundle = await buildBundleFromRecord(record);
                await writeReaderStore('article-bundles', bundle);
                return bundle;
            };

            const downloadSelectedArticlesMarkdown = async () => {
                const records = history.filter(record => selectedLibraryIds.includes(record.id));
                if (!records.length) {
                    window.showToast('请先选择文章', 'warning');
                    return;
                }
                const bundles = [];
                for (const record of records) bundles.push(await loadBundleForRecord(record));
                const content = [
                    '# 杨的阅读器批量备份',
                    `> 共 ${bundles.length} 篇，导出时间 ${new Date().toLocaleString('zh-CN')}。每篇均含可无损恢复的数据块。`,
                    ...bundles.map((bundle, index) => `\n\n---\n\n## 备份文章 ${index + 1}\n\n${articleBundleToMarkdown(bundle)}`)
                ].join('\n\n');
                downloadTextFile(`杨的阅读器-批量备份-${new Date().toISOString().slice(0, 10)}.md`, content);
                window.showToast(`已导出 ${bundles.length} 篇文章`, 'success');
            };

            const generateFullTranslationForBundle = async (sourceText) => {
                if (sourceText.length > 120000) throw new Error('正文超过 120,000 字符，无法批量全文翻译');
                const chunks = splitTextIntoChunks(sourceText, 12000);
                const translated = [];
                for (const chunk of chunks) translated.push(await callGeminiFullTranslation(chunk, apiConfig));
                return translated.filter(Boolean).join('\n\n').split(/\n\s*\n/).map(item => item.trim()).filter(Boolean);
            };

            const waitForBatchControl = async () => {
                while (batchControlRef.current.paused && !batchControlRef.current.cancelled) {
                    await new Promise(resolve => window.setTimeout(resolve, 250));
                }
                return !batchControlRef.current.cancelled;
            };

            const runBatchAnalysis = async () => {
                const records = history.filter(record => selectedLibraryIds.includes(record.id));
                const selectedModules = Object.entries(batchModules).filter(([, enabled]) => enabled).map(([key]) => key);
                if (!records.length) {
                    window.showToast('请先在阅读库选择文章', 'warning');
                    return;
                }
                if (!selectedModules.length) {
                    window.showToast('请至少选择一个解析模块', 'warning');
                    return;
                }
                batchControlRef.current = { paused: false, cancelled: false };
                setIsBatchRunning(true);
                let job = {
                    key: `batch:${Date.now()}`,
                    articleIds: records.map(record => record.id),
                    selectedModules,
                    status: 'running',
                    currentIndex: 0,
                    currentArticleId: '',
                    currentTitle: '',
                    currentModule: '',
                    completedArticles: [],
                    failedArticles: [],
                    skippedModules: 0,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                const persistJob = async () => {
                    job.updatedAt = Date.now();
                    setBatchJob({ ...job, completedArticles: [...job.completedArticles], failedArticles: [...job.failedArticles] });
                    await writeReaderStore('batch-analysis-jobs', job);
                };
                await persistJob();

                for (let articleIndex = 0; articleIndex < records.length; articleIndex += 1) {
                    if (!(await waitForBatchControl())) break;
                    const record = records[articleIndex];
                    job.currentIndex = articleIndex;
                    job.currentArticleId = record.id;
                    job.currentTitle = record.title || record.preview || `文章 ${articleIndex + 1}`;
                    await persistJob();
                    const errors = [];
                    try {
                        const bundle = await loadBundleForRecord(record);
                        const sourceText = bundle.article.sourceText;
                        for (const module of selectedModules) {
                            if (!(await waitForBatchControl())) break;
                            job.currentModule = module;
                            await persistJob();
                            try {
                                if (module === 'translation') {
                                    if (bundle.results.fullTranslations?.length) job.skippedModules += 1;
                                    else bundle.results.fullTranslations = await generateFullTranslationForBundle(sourceText);
                                } else if (module === 'logic') {
                                    if (bundle.results.globalLogicData) job.skippedModules += 1;
                                    else bundle.results.globalLogicData = await callGeminiReadingAnalysis(getModelSafeText(sourceText, 30000, '批量全文逻辑'), apiConfig);
                                } else if (module === 'outline') {
                                    if (bundle.results.fullMapData) job.skippedModules += 1;
                                    else bundle.results.fullMapData = await callGeminiSummary(getModelSafeText(sourceText, 30000, '批量结构树'), apiConfig);
                                } else if (module === 'quiz') {
                                    if (normalizeQuizQuestions(bundle.results.fullQuizData).length >= 3) job.skippedModules += 1;
                                    else bundle.results.fullQuizData = await callGeminiFullQuiz(getModelSafeText(sourceText, 18000, '批量全文练习'), apiConfig);
                                }
                                bundle.article.updatedAt = Date.now();
                                bundle.metadata = { ...(bundle.metadata || {}), updatedAt: Date.now(), model: apiConfig.model || '' };
                                await writeReaderStore('article-bundles', bundle);
                                updateHistoryBundleMeta(record.id, bundle);
                            } catch (moduleError) {
                                errors.push(`${module}: ${moduleError.message}`);
                            }
                        }
                    } catch (articleError) {
                        errors.push(articleError.message);
                    }
                    if (errors.length) job.failedArticles.push({ id: record.id, title: job.currentTitle, errors });
                    else job.completedArticles.push(record.id);
                    await persistJob();
                }

                job.currentModule = '';
                job.currentArticleId = '';
                job.currentTitle = '';
                job.status = batchControlRef.current.cancelled ? 'cancelled' : 'completed';
                await persistJob();
                setIsBatchRunning(false);
                window.showToast(job.status === 'completed' ? `批量解析完成：${job.completedArticles.length} 篇成功` : '批量解析已取消', job.failedArticles.length ? 'warning' : 'success');
            };

            const pauseBatchAnalysis = () => {
                batchControlRef.current.paused = true;
                setBatchJob(previous => previous ? { ...previous, status: 'paused', updatedAt: Date.now() } : previous);
            };

            const resumeBatchAnalysis = () => {
                batchControlRef.current.paused = false;
                setBatchJob(previous => previous ? { ...previous, status: 'running', updatedAt: Date.now() } : previous);
            };

            const cancelBatchAnalysis = () => {
                batchControlRef.current.cancelled = true;
                batchControlRef.current.paused = false;
            };

            const handleSaveCustomDict = async () => {
                if (!dictInputText.trim()) return;
                const newVocab = { ...customDict, ...parseDictText(dictInputText) };
                setCustomDict(newVocab);
                persistLocalState({ customDict: newVocab });
                setIsDictModalOpen(false);
                setDictInputText("");
                if (user && dbInstance && window.firebaseImports) {
                    const { doc, setDoc } = window.firebaseImports;
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                    try {
                        await setDoc(doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'settings', 'dictionary'), { vocab: newVocab }, { merge: true });
                        window.showToast("词库已更新并同步至云端", "success");
                    } catch(e) { window.showToast("同步词库失败", "error"); }
                } else {
                    window.showToast("词库已保存到本地", "success");
                }
            };

            const fetchFullTranslation = async (text, recordId, options = {}) => {
                if (text.length > 120000) {
                    window.showToast("整本文本过长，已跳过一次性全文翻译；可按段展开精翻", "warning");
                    if (options.openPanel) {
                        setRightPanelAnalysis({ kind: 'error', title: '全文翻译', message: '正文超过 120,000 字符，请使用段落翻译。' });
                    }
                    return [];
                }
                setIsFullTransLoading(true);
                try {
                    const chunks = splitTextIntoChunks(text, 12000);
                    const translatedChunks = [];
                    for (let i = 0; i < chunks.length; i++) {
                        window.showToast(`正在处理全文翻译 ${i + 1}/${chunks.length}`, 'info');
                        translatedChunks.push(await callGeminiFullTranslation(chunks[i], apiConfig));
                    }
                    const res = translatedChunks.filter(Boolean).join('\n\n');
                    const transArray = res ? res.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean) : [];
                    if (transArray.length) {
                        setFullTranslations(transArray);
                        if (recordId) {
                            const recordToUpdate = history.find(item => item.id === recordId) || { id: recordId, text };
                            saveHistoryToCloud({ ...recordToUpdate, fullTranslations: transArray });
                        }
                        if (options.openPanel) {
                            setRightPanelAnalysis({ kind: 'document-translation', title: '全文翻译', data: { translations: transArray }, createdAt: Date.now() });
                        }
                    }
                    return transArray;
                } catch (e) {
                    window.showToast(`全局翻译被拦截，可点击段落独立精翻。\n(${e.message})`, "warning");
                    if (options.openPanel) setRightPanelAnalysis({ kind: 'error', title: '全文翻译', message: e.message });
                    return [];
                } finally {
                    setIsFullTransLoading(false);
                }
            };

            const loadHistoryRecord = async (record) => {
                const bundle = await loadBundleForRecord(record);
                const sourceText = bundle?.article?.sourceText || await getRecordSourceText(record);
                if (!sourceText) {
                    window.showToast("这篇文章的本地正文已不存在", "warning");
                    return;
                }
                const results = bundle.results || {};
                setInputText(sourceText);
                setFullMapData(results.fullMapData || record.fullMapData || null);
                setCollapsedMapNodes(new Set());
                setFullTranslations(results.fullTranslations || record.fullTranslations || []);
                setGlobalLogicData(results.globalLogicData || null);
                setShowGlobalLogic(false);
                setFullQuizData(results.fullQuizData || null);
                setParagraphResults(results.paragraphResults || {});
                setRightPanelAnalysis(results.activeAnalysis || null);
                setRightPanelTab(results.activeAnalysis ? 'analysis' : 'outline');
                setIsFullTextMenuOpen(false);
                setCurrentHistoryId(record.id);
                restoreBundleNotes(record.id, bundle.notes);
                setIsReadingMode(true);
                setIsHistoryDrawerOpen(false);
                setLibrarySelectionMode(false);
                setSelectedLibraryIds([]);

            const extractPdfTextLocally = async (file) => {
                setIsExtracting(true);
                setPdfExtractionProgress({ current: 0, total: 0 });
                let loadingTask = null;
                let pdfDocument = null;
                const diagnostics = {
                    cached: 0,
                    structuredText: 0,
                    rawText: 0,
                    ocr: 0,
                    ocrFailed: 0,
                    empty: 0,
                    pageErrors: []
                };

                try {
                    const pdfjs = await waitForPdfJs();
                    const data = new Uint8Array(await file.arrayBuffer());
                    loadingTask = pdfjs.getDocument({ data });
                    pdfDocument = await loadingTask.promise;
                    setPdfExtractionProgress({ current: 0, total: pdfDocument.numPages });

                    const taskKey = `pdf:${await hashText(`${file.name}:${file.size}:${file.lastModified}`)}`;
                    const savedTask = await readReaderStore('pdf-tasks', taskKey);
                    const cachedPages = new Map(
                        (Array.isArray(savedTask?.pages) ? savedTask.pages : [])
                            .filter(page => Number.isFinite(page?.pageNumber))
                            .map(page => [page.pageNumber, page])
                    );
                    const extractedPages = [];

                    for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
                        const cachedPage = cachedPages.get(pageNumber);
                        const cachedText = normalizeBookText(cachedPage?.text || '');
                        const cachedIsUsable = cachedText.length >= 40 && cachedPage?.invalid !== true;

                        if (cachedIsUsable) {
                            extractedPages.push({
                                ...cachedPage,
                                pageNumber,
                                text: cachedText,
                                processed: true,
                                extractionMethod: cachedPage.extractionMethod || 'cache'
                            });
                            diagnostics.cached += 1;
                            setPdfExtractionProgress({ current: pageNumber, total: pdfDocument.numPages });
                            continue;
                        }

                        let page = null;
                        let pageText = '';
                        let extractionMethod = 'empty';
                        let usedOcr = false;
                        let pageError = '';

                        try {
                            page = await pdfDocument.getPage(pageNumber);
                            const viewport = page.getViewport({ scale: 1 });
                            const textContent = await page.getTextContent();
                            const lines = pdfItemsToLines(textContent.items, viewport.width);
                            const structuredText = normalizeBookText(pdfLinesToParagraphs(lines, viewport.width).join('\n\n'));
                            const rawText = normalizeBookText(cleanPdfText(
                                textContent.items
                                    .map(item => typeof item.str === 'string' ? item.str : '')
                                    .filter(Boolean)
                                    .join(' ')
                            ));

                            if (structuredText.length >= 80) {
                                pageText = structuredText;
                                extractionMethod = 'text-structured';
                                diagnostics.structuredText += 1;
                            } else if (rawText.length >= 80) {
                                pageText = rawText;
                                extractionMethod = 'text-raw';
                                diagnostics.rawText += 1;
                            } else {
                                try {
                                    const ocrViewport = page.getViewport({ scale: 1.75 });
                                    const canvas = document.createElement('canvas');
                                    const context = canvas.getContext('2d', { alpha: false });
                                    canvas.width = Math.ceil(ocrViewport.width);
                                    canvas.height = Math.ceil(ocrViewport.height);
                                    await page.render({ canvasContext: context, viewport: ocrViewport }).promise;
                                    const imageData = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
                                    const ocrText = normalizeBookText(await extractTextFromMedia(imageData, 'image/jpeg', apiConfig));
                                    canvas.width = 1;
                                    canvas.height = 1;
                                    usedOcr = true;

                                    if (ocrText.length >= 40) {
                                        pageText = ocrText;
                                        extractionMethod = 'ocr';
                                        diagnostics.ocr += 1;
                                    } else {
                                        pageText = structuredText.length >= rawText.length ? structuredText : rawText;
                                        extractionMethod = pageText ? 'text-short' : 'empty';
                                        diagnostics.empty += pageText ? 0 : 1;
                                    }
                                } catch (ocrError) {
                                    diagnostics.ocrFailed += 1;
                                    pageError = `OCR失败：${ocrError.message}`;
                                    pageText = structuredText.length >= rawText.length ? structuredText : rawText;
                                    extractionMethod = pageText ? 'text-short' : 'empty';
                                    if (!pageText) diagnostics.empty += 1;
                                }
                            }
                        } catch (error) {
                            pageError = error.message || String(error);
                            diagnostics.pageErrors.push({ pageNumber, message: pageError });
                            diagnostics.empty += 1;
                        } finally {
                            if (page) {
                                try { page.cleanup(); } catch (error) {}
                            }
                        }

                        const pageRecord = {
                            pageNumber,
                            text: normalizeBookText(pageText),
                            usedOcr,
                            processed: true,
                            extractionMethod,
                            error: pageError || '',
                            invalid: false
                        };
                        extractedPages.push(pageRecord);

                        await writeReaderStore('pdf-tasks', {
                            key: taskKey,
                            fileName: file.name,
                            fileSize: file.size,
                            fileLastModified: file.lastModified,
                            totalPages: pdfDocument.numPages,
                            completedPages: pageNumber,
                            pages: extractedPages,
                            diagnostics,
                            updatedAt: Date.now()
                        });

                        setPdfExtractionProgress({ current: pageNumber, total: pdfDocument.numPages });
                        if (pageNumber % 3 === 0) await new Promise(resolve => setTimeout(resolve, 0));
                    }

                    const readablePages = extractedPages.filter(page => normalizeBookText(page.text).length >= 40);
                    const totalText = normalizeBookText(readablePages.map(page => page.text).join('\n\n'));

                    if (totalText.length < 80) {
                        await deleteReaderStore('pdf-tasks', taskKey);
                        const details = [
                            `共 ${pdfDocument.numPages} 页`,
                            `可读页 ${readablePages.length}`,
                            `缓存命中 ${diagnostics.cached}`,
                            `OCR成功 ${diagnostics.ocr}`,
                            `OCR失败 ${diagnostics.ocrFailed}`,
                            `空页 ${diagnostics.empty}`,
                            diagnostics.pageErrors.length ? `页面错误 ${diagnostics.pageErrors.length}` : ''
                        ].filter(Boolean).join('，');
                        throw new Error(`未提取到足够正文（${details}）。已清除无效缓存，请检查PDF文字层或OCR配置后重试。`);
                    }

                    const sourceHash = await hashText(`${file.name}:${file.size}:${file.lastModified}`);
                    const session = await prepareBookImport({ sourceName: file.name, sourceHash, pages: extractedPages });
                    setPendingPdfFile(null);
                    setIsPdfChoiceOpen(false);
                    setIsPdfMode(false);
                    setPdfFile(null);
                    window.showToast(`已识别 ${session.articles.length} 篇文章，忽略 ${session.ignored.length} 个目录、封面或低信息页`, 'success');
                } catch (error) {
                    window.showToast(`PDF 本地提取失败：${error.message}`, 'error');
                } finally {
                    setIsExtracting(false);
                    setPdfExtractionProgress({ current: 0, total: 0 });
                    if (pdfDocument) {
                        try { await pdfDocument.destroy(); } catch (error) {}
                    } else if (loadingTask) {

                    }
