                                        <span>考研真题: {corpusCount}句</span><span className="w-px h-3 bg-emerald-200 dark:bg-emerald-700"></span>
                                        <span>预设库: {Object.keys(presetDict).length}词</span><span className="w-px h-3 bg-emerald-200 dark:bg-emerald-700"></span>
                                        <span className="text-red-600 dark:text-red-400 font-bold">生词本: {Object.keys(hardDict).length}词</span>
                                    </div>
                                    <button onClick={() => setIsTypographyModalOpen(true)} className="text-[12px] font-medium text-blue-700 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 px-2.5 py-1.5 rounded flex items-center transition-colors whitespace-nowrap">
                                        🎨 排版设置
                                    </button>
                                    <button onClick={() => setIsApiModalOpen(true)} className="text-[12px] font-medium text-purple-700 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 px-2.5 py-1.5 rounded flex items-center transition-colors whitespace-nowrap">
                                        <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>模型配置
                                    </button>
                                    <button onClick={() => setIsDictModalOpen(true)} className="text-[12px] font-medium text-amber-700 dark:text-amber-500 bg-amber-50 dark:bg-amber-900/30 hover:bg-amber-100 dark:hover:bg-amber-900/50 px-2.5 py-1.5 rounded flex items-center transition-colors whitespace-nowrap">
                                        <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>个人词库
                                    </button>
                                    <button onClick={() => setIsHistoryDrawerOpen(true)} className="text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/30 hover:bg-sky-100 dark:hover:bg-sky-900/50 p-1.5 rounded flex items-center transition-colors shrink-0" title="阅读库"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg></button>
                                    {isReadingMode && <button onClick={() => setIsReadingMode(false)} className="text-[12px] font-medium text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 shrink-0">退出阅读</button>}
                                </div>
                            </div>
                        </header>

                        <main className="max-w-3xl mx-auto sm:my-8 bg-white dark:bg-gray-900 sm:shadow-sm sm:border border-gray-100 dark:border-gray-800 sm:rounded-xl min-h-[85vh] transition-colors">
                            {!isReadingMode ? (
                                <div className="p-6 md:p-10 space-y-6 animate-fade-in">
                                    <div className="flex flex-wrap gap-3 items-center border-b border-gray-100 dark:border-gray-800 pb-4">
                                         <input type="file" accept="image/*, application/pdf" multiple className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                                         <button onClick={() => fileInputRef.current?.click()} disabled={isExtracting} className="flex items-center text-[14px] font-medium text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-4 py-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                             <svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                             {isExtracting ? "高速解析中..." : "批量提取 (建议每份PDF < 4MB)"}
                                         </button>
                                    </div>
                                    <textarea className="w-full h-[55vh] p-2 bg-transparent outline-none resize-none font-serif text-[15.5px] leading-relaxed text-gray-700 dark:text-gray-300 placeholder-gray-400 dark:placeholder-gray-600" placeholder="在此粘贴外刊文本，或使用上方按钮提取内容..." value={inputText} onChange={(e) => setInputText(e.target.value)} />
                                    <button onClick={handleStartReading} disabled={isExtracting} className="w-full bg-gray-900 dark:bg-blue-600 text-white py-4 rounded-xl font-medium shadow-md text-[15px] hover:bg-gray-800 dark:hover:bg-blue-700 active:scale-[0.98] transition-transform">进入精读环境</button>
                                </div>
                            ) : (
                                <article className="py-8 animate-fade-in relative transition-all" style={{ paddingLeft: `${typographyConfig.paddingX}%`, paddingRight: `${typographyConfig.paddingX}%` }}>
                                    <div className="flex justify-center mb-10 items-center space-x-4">
                                        <div className="bg-gray-100 dark:bg-gray-800 p-1 rounded-xl flex space-x-1 border border-gray-200 dark:border-gray-700">
                                            <button onClick={() => setReadingMode('pure')} className={`px-6 py-2 rounded-lg text-[13px] font-medium transition-all flex items-center ${readingMode === 'pure' ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}>纯净文本</button>
                                            <button onClick={() => setReadingMode('intensive')} className={`px-6 py-2 rounded-lg text-[13px] font-medium transition-all flex items-center ${readingMode === 'intensive' ? 'bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}>深度精读</button>
                                        </div>
                                        
                                        {readingMode === 'intensive' && (
                                            <div className="flex items-center space-x-4 animate-fade-in">
                                                <div className="flex items-center space-x-2">
                                                    <select 
                                                        value={highlightMode} 
                                                        onChange={(e) => setHighlightMode(e.target.value)} 
                                                        className="w-auto h-8 px-2 rounded-md text-[12px] border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 outline-none focus:border-sky-400 cursor-pointer shadow-sm"
                                                    >
                                                        <option value="both">✨ 全部高亮 (红+蓝)</option>
                                                        <option value="red">🔴 仅考研生词 (红)</option>
                                                        <option value="blue">🔵 仅基础词汇 (蓝)</option>
                                                        <option value="none">⚪ 关闭高亮</option>
                                                    </select>
                                                </div>
                                                <button onClick={handleToggleGlobalLogic} disabled={isGlobalLogicLoading} className={`flex items-center space-x-1.5 text-[12px] font-medium border px-3 py-1.5 rounded-lg transition-all ${showGlobalLogic ? 'bg-teal-50 dark:bg-teal-900/30 text-teal-700 dark:text-teal-400 border-teal-200 dark:border-teal-800 shadow-sm' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                                    {isGlobalLogicLoading ? <svg className="animate-spin w-3.5 h-3.5 loader-spin text-teal-600 dark:text-teal-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <svg className={`w-3.5 h-3.5 ${showGlobalLogic ? 'text-teal-600 dark:text-teal-400' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg> }
                                                    <span>{isGlobalLogicLoading ? "剖析中..." : showGlobalLogic ? "收起全文逻辑" : "全文逻辑剖析"}</span>
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-4 border-b border-gray-100 dark:border-gray-800 pb-16 mb-12">
                                        {paragraphs.map((p, idx) => (
                                            <Paragraph 
                                                key={idx} 
                                                text={p} 
                                                activeDicts={activeDicts} 
                                                readingMode={readingMode} 
                                                highlightMode={highlightMode} 
                                                translationText={fullTranslations[idx]} 
                                                isTransLoading={isFullTransLoading} 
                                                apiConfig={apiConfig}
                                                typographyConfig={typographyConfig}
                                            />
                                        ))}
                                    </div>

                                    {showGlobalLogic && globalLogicData && (
                                        <div id="global-logic-section" className="mb-12 p-6 md:p-8 bg-teal-50/40 dark:bg-teal-900/10 border border-teal-100 dark:border-teal-900/50 rounded-2xl animate-fade-in shadow-sm font-sans">
                                            <div className="flex items-center space-x-2 mb-6 border-b border-teal-100/50 dark:border-teal-900/50 pb-4"><span className="bg-teal-600 dark:bg-teal-700 text-white text-[12px] font-bold px-3 py-1.5 rounded uppercase tracking-wider flex items-center"><svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>全文考研逻辑解剖</span></div>
                                            <div className="space-y-6">
                                                <div><h4 className="text-[14px] font-bold text-teal-900 dark:text-teal-300 mb-2 flex items-center"><span className="mr-1.5">📌</span> 全局指代与语义连贯</h4><ul className="list-disc list-inside text-[14px] text-gray-700 dark:text-gray-300 space-y-1.5 ml-1 pl-4 marker:text-teal-400">{globalLogicData.referenceAnalysis.map((ref, idx) => <li key={idx} className="leading-relaxed">{ref}</li>)}</ul></div>
                                                <div><h4 className="text-[14px] font-bold text-teal-900 dark:text-teal-300 mb-2 flex items-center"><span className="mr-1.5">🔗</span> 宏观逻辑结构拆解</h4><p className="text-[14px] text-gray-700 dark:text-gray-300 leading-[1.8] text-justify bg-white/70 dark:bg-gray-800/70 p-4 rounded-xl border border-teal-50 dark:border-teal-900">{globalLogicData.logicalStructure}</p></div>
                                                {globalLogicData.synonymMapping?.length > 0 && (
                                                    <div><h4 className="text-[14px] font-bold text-teal-900 dark:text-teal-300 mb-3 flex items-center"><span className="mr-1.5">🔄</span> 核心同义替换网络</h4><div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">{globalLogicData.synonymMapping.map((mapping, idx) => (<div key={idx} className="bg-white dark:bg-gray-800/70 p-3 rounded-xl border border-teal-50 dark:border-teal-900 flex flex-col shadow-sm"><span className="text-[12.5px] text-gray-400 font-mono line-through decoration-red-300 mb-1">{mapping.keyword}</span><span className="text-[14px] font-bold text-teal-700 dark:text-teal-400">{mapping.replacement}</span></div>))}</div></div>
                                                )}
                                                {globalLogicData.trapIdentification && globalLogicData.trapIdentification !== "无" && (
                                                    <div><h4 className="text-[14px] font-bold text-red-700 dark:text-red-400 mb-2 flex items-center"><span className="mr-1.5">⚠️</span> 命题人陷阱预警</h4><p className="text-[14px] text-red-800/80 dark:text-red-300 leading-[1.8] bg-red-50/50 dark:bg-red-900/20 p-4 rounded-xl border border-red-100 dark:border-red-900/50 text-justify">{globalLogicData.trapIdentification}</p></div>
                                                )}
                                                <div className="pt-2"><h4 className="text-[14px] font-bold text-teal-900 dark:text-teal-300 mb-2 flex items-center"><span className="mr-1.5">💡</span> 全文核心主旨 (Core Meaning)</h4><p className="text-[15px] font-bold text-gray-800 dark:text-gray-200 leading-[1.8] bg-teal-100/50 dark:bg-teal-900/30 p-4 rounded-xl border-l-4 border-teal-500">{globalLogicData.coreMeaning}</p></div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex flex-col items-center">
                                        {!fullMapData ? (
                                            <button onClick={handleGenerateSummary} disabled={isAnalyzingMap} className={`flex items-center space-x-2 px-8 py-4 rounded-full border transition-all ${isAnalyzingMap ? 'bg-gray-50 dark:bg-gray-800 text-gray-400 border-gray-200 dark:border-gray-700 cursor-wait' : 'bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 border-gray-300 dark:border-gray-600 hover:border-gray-900 dark:hover:border-gray-400 hover:shadow-md'}`}>
                                                {isAnalyzingMap ? <svg className="animate-spin w-5 h-5 loader-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> : <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>}
                                                <span className="text-[15px] font-medium">{isAnalyzingMap ? "正在飞速生成全文逻辑树..." : "提炼全文思维导图"}</span>
                                            </button>
                                        ) : (
                                            <div className="w-full space-y-6 animate-fade-in">
                                                <div className="flex justify-between items-end border-b border-gray-100 dark:border-gray-800 pb-3">
                                                    <h3 className="text-[16px] font-bold text-gray-900 dark:text-gray-100 flex items-center"><svg className="w-4 h-4 mr-2 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>结构树 (Mind Map)</h3>
                                                    <div className="flex gap-2"><div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-md text-[12px] font-medium"><button onClick={() => setMapMode('bilingual')} className={`px-2.5 py-1 rounded-sm transition-colors ${mapMode === 'bilingual' ? 'bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white' : 'text-gray-500 dark:text-gray-400'}`}>双语</button><button onClick={() => setMapMode('en')} className={`px-2.5 py-1 rounded-sm transition-colors ${mapMode === 'en' ? 'bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white' : 'text-gray-500 dark:text-gray-400'}`}>英</button><button onClick={() => setMapMode('zh')} className={`px-2.5 py-1 rounded-sm transition-colors ${mapMode === 'zh' ? 'bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white' : 'text-gray-500 dark:text-gray-400'}`}>中</button></div></div>
                                                </div>
                                                <div className="overflow-x-auto w-full py-6 pb-8 custom-scrollbar relative cursor-zoom-in group" onClick={() => { setIsMapModalOpen(true); setMapScale(1); }}>
                                                    <div className="absolute right-4 top-4 bg-gray-900 dark:bg-black text-white px-3 py-1.5 rounded-full shadow-md text-[12px] font-medium flex items-center z-20 pointer-events-none hover:scale-105 transition-transform"><svg className="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>点我全屏放大</div>
                                                    <div className="inline-block min-w-max pr-8 bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm"><LogicTreeNode node={fullMapData.mindmap} isRoot={true} displayMode={mapMode} /></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </article>
                            )}
                        </main>

                        {isMapModalOpen && fullMapData && (
                            <div className="fixed inset-0 z-[70] bg-[#F3F4F6] dark:bg-gray-900 flex flex-col animate-fade-in">
                                <div className="h-14 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-3 md:px-6 shadow-sm shrink-0 z-10 sticky top-0">
                                    <div className="flex items-center space-x-1 bg-gray-100 dark:bg-gray-900 p-1 rounded-lg border border-gray-200 dark:border-gray-700">
                                        <button onClick={() => setMapScale(s => Math.max(0.1, s - 0.1))} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-md text-gray-700 dark:text-gray-300 font-bold hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform shadow-sm">−</button>
                                        <button onClick={() => setMapScale(1)} className="text-[12px] font-medium w-12 text-center text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200" title="恢复默认大小">{Math.round(mapScale * 100)}%</button>
                                        <button onClick={() => setMapScale(s => Math.min(3.0, s + 0.1))} className="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-800 rounded-md text-gray-700 dark:text-gray-300 font-bold hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-95 transition-transform shadow-sm">+</button>
                                    </div>
                                    <div className="text-[12px] text-gray-400 hidden sm:block font-medium">调整至合适大小后自行截图</div>
                                    <button onClick={() => setIsMapModalOpen(false)} className="px-4 py-2 bg-gray-900 dark:bg-gray-700 text-white rounded-lg text-[13px] font-medium hover:bg-gray-800 dark:hover:bg-gray-600 active:scale-95 transition-transform shadow-sm">退出全屏</button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 md:p-12 custom-scrollbar relative">
                                     <div className="inline-block transition-transform duration-200 ease-out origin-top-left min-w-max" style={{ transform: `scale(${mapScale})` }}><div className="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 inline-block min-w-max"><LogicTreeNode node={fullMapData.mindmap} isRoot={true} displayMode={mapMode} /></div></div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
